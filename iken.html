<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>意見箱│サクラG</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ color-scheme: light; --bg:#FBF7F8; --ink:#5C4B4F; --sub:#9C8B8F; --line:#F1E3E7; --pink:#FF9EC0; --pink-deep:#e5638c; --pink-soft:#FFF0F5; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 80px;}
  h1{font-size:20px;font-weight:800;color:var(--pink-deep);}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;}
  .rules{background:var(--pink-soft);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.8;margin-top:12px;}
  .rules b{color:var(--pink-deep);}
  label.t{display:block;font-size:12.5px;font-weight:800;color:var(--sub);margin:14px 0 6px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-family:inherit;font-size:13px;font-weight:800;color:var(--sub);cursor:pointer;}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff;}
  select,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;}
  textarea{min-height:150px;resize:vertical;line-height:1.6;}
  .count{font-size:11.5px;color:var(--sub);text-align:right;margin-top:3px;}
  .name-row{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;}
  .send{width:100%;margin-top:16px;padding:13px;border:none;border-radius:99px;background:var(--pink-deep);color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;}
  .send:disabled{opacity:.5;cursor:wait;}
  .msg{margin-top:10px;font-size:13.5px;font-weight:800;text-align:center;}
  .msg.err{color:#d9534f;} .msg.ok{color:#2f9e6e;}
  .reader{display:block;text-align:center;margin-top:26px;font-size:12px;color:var(--sub);}
  .back{position:fixed;left:12px;bottom:12px;background:#fff;color:#e5638c;border:1.5px solid #ffc2d1;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;text-decoration:none;box-shadow:0 4px 14px rgba(229,99,140,.2);}
</style>
</head>
<body>
<div class="wrap">
  <h1>📮 意見箱</h1>
  <div class="rules">
    アプリの<b>良いところ・直してほしいところ・こうしたら便利</b>など、なんでも送ってください。<br>
    ・読むのは<b>店長だけ</b>です。<b>名前を出さずに</b>送れます（そのときは、だれが送ったかは残りません）。<br>
    ・<b>お店への不満や、ほかの人の悪口は書かないでください。</b><br>
    ・悩みごとがあるときは、<b>いつでもスタッフに相談してください。</b>
  </div>

  <div class="card">
    <label class="t">どんな内容？</label>
    <div class="chips" id="kinds"></div>

    <label class="t">どのアプリ？</label>
    <select id="app">
      <option value="">えらばない</option>
      <option>ポータル</option><option>サクラシフト</option><option>内勤カレンダー</option>
      <option>在籍作成ルーム</option><option>キャストプロフ</option><option>記録簿・キャスト台帳</option><option>そのほか</option>
    </select>

    <label class="t">内容</label>
    <textarea id="body" maxlength="2000" placeholder="例：シフトの画面で、〇〇を押すと△△になって困りました"></textarea>
    <div class="count"><span id="cnt">0</span> / 2000</div>

    <label class="t">名前</label>
    <div class="name-row">
      <label><input type="radio" name="nm" value="" checked> 名前を出さない</label>
      <label><input type="radio" name="nm" value="me"> 名前を出す（<span id="opName">担当者</span>）</label>
    </div>

    <button class="send" id="send">送る</button>
    <div class="msg" id="msg"></div>
  </div>

  <a class="reader" href="iken_read.html">🔑 店長用：意見を読む</a>
</div>
<a class="back" href="./">🏠 ポータル</a>

<script>
const SUPABASE_URL = "https://tuxqpqokbvkrckgxcfdn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PyvCZHSzYlaqauYbdZybng_zbftghak";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const KINDS = [["good","😊 良いところ"],["bad","😣 直してほしい"],["idea","💡 こうしたら便利"],["bug","🐞 うまく動かない"],["other","💬 そのほか"]];
// 人を傷つける言葉（Supabase のほうにも同じものがある）
const BAD = /(死ね|氏ね|シネ|ｼﾈ|殺す|ころす|消えろ|黙れ|きもい|キモい|キモイ|うざい|ウザい|ウザイ|ブス|ブサイク|ぶさいく|不細工|デブ|バカ|馬鹿|アホ|あほ|クズ|クソ|くそ|糞|無能|ガイジ|池沼|キチガイ|きちがい|基地外|ハゲ|淫乱|ヤリマン|ビッチ)/i;
let kind = "";
const operator = (()=>{ try{ return localStorage.getItem("currentOperator") || ""; }catch(e){ return ""; } })();
document.getElementById("opName").textContent = operator || "担当者を選んでいません";
if(!operator) document.querySelector('input[name=nm][value=me]').disabled = true;

function renderKinds(){
  document.getElementById("kinds").innerHTML = KINDS.map(k=>
    `<button type="button" class="chip ${kind===k[0]?"on":""}" onclick="kind='${k[0]}';renderKinds()">${k[1]}</button>`).join("");
}
renderKinds();
const bodyEl = document.getElementById("body");
bodyEl.addEventListener("input", ()=>{ document.getElementById("cnt").textContent = bodyEl.value.length; });

function say(t, ok){ const m = document.getElementById("msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); }

document.getElementById("send").addEventListener("click", async ()=>{
  const body = bodyEl.value.trim();
  if(!kind) return say("「どんな内容？」を選んでください");
  if(!body) return say("内容を書いてください");
  if(BAD.test(body)) return say("人を傷つける言葉が入っているため送れません。言い方を変えてください。");
  const named = document.querySelector('input[name=nm]:checked').value === "me";
  const btn = document.getElementById("send");
  btn.disabled = true; say("送っています…", true);
  try{
    const { data, error } = await sb.rpc("fb_submit", { p_kind: kind, p_app: document.getElementById("app").value, p_body: body, p_name: named ? operator : "" });
    if(error) throw error;
    if(data && data.error){
      const M = { unauthorized:"ログインが切れています。ポータルからログインし直してください。", bad_words:"人を傷つける言葉が入っているため送れません。言い方を変えてください。",
                  too_many:"いま送られている数が多いため、少し時間をおいて送ってください。", empty:"内容を書いてください" };
      say(M[data.error] || ("送れませんでした：" + data.error));
    }else{
      say("送りました。ありがとうございます！", true);
      bodyEl.value = ""; document.getElementById("cnt").textContent = "0"; kind = ""; renderKinds();
    }
  }catch(e){ say("送れませんでした（通信エラー）。もう一度お試しください。"); }
  btn.disabled = false;
});
</script>
</body>
</html>
