<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精算│記録簿</title>
<link rel="icon" type="image/png" href="../favicon.png?v=3">
<link rel="stylesheet" href="kb.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/session_guard.js"></script><!-- 退勤時刻で自動ログアウト -->
<script src="kb_common.js"></script>
<style>
  .daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .daybar input[type=date]{font-family:inherit;font-size:14px;padding:8px 12px;border:1.5px solid var(--line);border-radius:99px;background:#fff;color:var(--ink);}
  .sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .sum .s{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;font-size:12px;color:var(--sub);font-weight:800;}
  .sum .s b{display:block;font-size:17px;color:var(--ink);}
  .sum .s.hide b{filter:blur(7px);user-select:none;}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;}
  .card.done{border-color:#9ad9bd;background:#F6FCF9;}
  .card h2{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card h2 .st{font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;background:var(--lemon-soft);color:#9a7000;}
  .card.done h2 .st{background:var(--mint-soft);color:#1a7a5e;}
  table.res{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 8px;}
  table.res th{font-size:11px;color:var(--sub);text-align:left;font-weight:800;padding:3px 4px;border-bottom:1px solid var(--line);}
  table.res td{padding:4px;border-bottom:1px dashed var(--line);}
  table.res tr.off td{color:var(--sub);text-decoration:line-through;}
  .money{text-align:right;white-space:nowrap;}
  .calc{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;max-width:420px;}
  .calc .k{color:var(--sub);}
  .calc .v{text-align:right;font-weight:800;}
  .calc .big{font-size:16px;color:var(--pink-deep, #e5638c);}
  .items{margin:6px 0;}
  .items .it{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
  .items .it input{font-family:inherit;font-size:12.5px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;}
  .items .it input.lbl{flex:1;}
  .items .it input.amt{width:100px;text-align:right;}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .hint2{font-size:11.5px;color:var(--sub);}
  .note2{font-size:12px;background:var(--lemon-soft);border-radius:10px;padding:6px 10px;margin:6px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="kbh"><h1>💴 精算（記録簿）</h1><span class="spacer"></span></header>
  <div id="navArea"></div>
  <div id="wipArea"></div>
  <div id="gate" class="gate">読み込み中…</div>

  <div id="main" style="display:none">
    <div class="daybar">
      <button class="btn btn-ghost btn-sm" onclick="moveDay(-1)">◀</button>
      <input type="date" id="day" onchange="loadDay()">
      <button class="btn btn-ghost btn-sm" onclick="moveDay(1)">▶</button>
      <button class="btn btn-ghost btn-sm" onclick="goToday()">今日（営業日）</button>
    </div>
    <div class="hint2" style="margin-bottom:8px">その日に受付のあったキャストが並びます。報酬・雑費・交通費バックは自動で計算。プラス・マイナスは手で足せます。<b>終わったら「精算済にする」。</b></div>
    <div class="sum" id="sum"></div>
    <div id="list"></div>
  </div>
</div>

<script>
/* ============================================================
   精算（1日ごと・キャストごと）
   ・報酬 ＝ 受付の「キャストの報酬」（コースのバック＋延長など＋手で直した報酬）。キャンセル・トビは入れない
   ・OP ＝ バック有オプションのバック
   ・交通費バック ＝ 台帳の条件「交通費をバック」（全額／半額／金額）から自動
   ・雑費 ＝（報酬＋OP）÷10,500 の切り捨て × 500円（上限 3,000円）。台帳の「雑費なし」の曜日は 0円。手で直せる
   ・手取り ＝ 報酬 ＋ OP ＋ プラス（交通費バックなど）− 雑費 − マイナス
   ・カード払分 ＝ お支払いが「カード精算済」の総額
   ・投函額 ＝ 総額の合計 − 手取り − カード払分
   ・源泉徴収（税務用）＝（報酬＋OP）÷ 9（手取りからは引かない）
   ============================================================ */
const sb = KB.sb, q = KB.q, esc = KB.esc, yen = KB.yen, toast = KB.toast, $ = id => document.getElementById(id);
$("navArea").innerHTML = KB.nav("settle.html");
$("wipArea").innerHTML = KB.wipBanner();
if(!KB.CAN_EDIT) document.body.classList.add("readonly");

const PLACES = ["池袋", "鶯谷", "五反田", "錦糸町", "事務所", "そのほか"];
const DOW = ["日","月","火","水","木","金","土"];
let day = "", M = {}, rows = [], days = {}, showMoney = false;

async function init(){
  if(location.hash) history.replaceState(null, "", location.pathname + location.search);
  if(!(await KB.staffSession())){ $("gate").textContent = "ポータルから開いてください（ポータルでログインしてから20時間たった場合も、開き直してください）"; return; }
  try{
    const r = await Promise.all([
      sb.from("master_casts").select("id,official_name,temp_name"),
      sb.from("master_stores").select("key,label"),
      sb.from("kb_cast_rules").select("*").eq("active", true),
    ]);
    const [casts, stores, rules] = r.map(q);
    M = { casts, stores, rules };
  }catch(e){ $("gate").textContent = "読み込みに失敗しました：" + (e.message || e); return; }
  $("gate").style.display = "none"; $("main").style.display = "";
  goToday();
}
function goToday(){ $("day").value = KB.bizDateOf(); loadDay(); }
function moveDay(n){ const d = new Date($("day").value + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); $("day").value = d.toISOString().slice(0, 10); loadDay(); }
function castName(id){ const c = M.casts.find(x=>x.id === id); return c ? (c.official_name || c.temp_name) : (id || "—"); }
function storeLabel(k){ const s = M.stores.find(x=>x.key === k); return s ? s.label : (k || ""); }
function hm(iso){ if(!iso) return "--:--"; const d = new Date(new Date(iso).getTime() + 9*3600*1000); return String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0"); }
function backOf(r){ return r.back_override != null ? r.back_override : (r.course_back + r.option_back + r.extra_back); }
function rulesOn(castId){ return M.rules.filter(r=>r.cast_id === castId && (r.valid_from || "2000-01-01") <= day && (!r.valid_to || r.valid_to > day)); }

async function loadDay(){
  day = $("day").value;
  $("list").innerHTML = `<div class="gate">読み込み中…</div>`;
  try{
    const [rs, ds] = await Promise.all([
      sb.from("kb_reservations").select("*").eq("biz_date", day).eq("deleted", false).order("start_at"),
      sb.from("kb_cast_days").select("*").eq("biz_date", day),
    ]);
    rows = q(rs) || [];
    days = {}; (q(ds) || []).forEach(d=>{ days[d.cast_id] = d; });
    render();
  }catch(e){ $("list").innerHTML = `<div class="warn">読み込めませんでした：${esc(e.message || e)}</div>`; }
}

// キャスト1人分の計算
function calcCast(castId){
  const all = rows.filter(r=>r.cast_id === castId);
  const live = all.filter(r=>r.status !== "cancel" && r.status !== "tobi");
  const cd = days[castId] || {};
  // 報酬：手で直した報酬があればそれ（OP込みの金額として扱う）
  let reward = 0, option = 0;
  live.forEach(r=>{
    if(r.back_override != null) reward += r.back_override;
    else { reward += (r.course_back || 0) + (r.extra_back || 0); option += (r.option_back || 0); }
  });
  // 交通費バック（台帳の条件）
  let transportBack = 0; const why = [];
  rulesOn(castId).filter(x=>x.kind === "transport_back").forEach(x=>{
    live.forEach(r=>{
      const t = r.transport || 0; if(!t) return;
      const v = x.params && x.params.amount != null ? Math.min(Number(x.params.amount) || 0, t) : Math.round(t * (Number(x.params && x.params.rate) || 0));
      if(v){ transportBack += v; }
    });
    if(transportBack) why.push("交通費バック：" + x.note);
  });
  // 雑費（自動・免除の曜日・手で直したとき）
  const dow = new Date(day + "T12:00:00Z").getUTCDay();
  const exempt = rulesOn(castId).some(x=>x.kind === "zappi_exempt" && (x.params.days || []).includes(dow));
  const zappiAuto = exempt ? 0 : Math.min(3000, Math.floor((reward + option) / 10500) * 500);
  const zappi = cd.zappi_override != null ? cd.zappi_override : zappiAuto;
  const plusItems = Array.isArray(cd.plus_items) ? cd.plus_items : [];
  const minusItems = Array.isArray(cd.minus_items) ? cd.minus_items : [];
  const plus = plusItems.reduce((a, b)=>a + (Number(b.amount) || 0), 0);
  const minus = minusItems.reduce((a, b)=>a + (Number(b.amount) || 0), 0);
  const takeHome = reward + option + transportBack + plus - zappi - minus;
  const total = live.reduce((a, r)=>a + (r.total || 0), 0);
  // カードは予約の1時間前までに決済URLで先に払ってもらう（現金はキャストに入らない）。「カード」「カード精算済」どちらも引く
  const cardPaid = live.filter(r=>r.payment === "card" || r.payment === "card_paid").reduce((a, r)=>a + (r.total || 0), 0);
  const cardUnconfirmed = live.filter(r=>r.payment === "card").length;
  const drop = total - takeHome - cardPaid;
  const withholding = Math.floor((reward + option) / 9);
  const provisional = total - reward - option;          // 暫定残額（総額 − 報酬）
  const shopDrop = total - takeHome;                    // 店落ち（暫定残額 ＋ 雑費 など）
  const realDrop = provisional - withholding;           // 実質的な店落ち（暫定残額 − 源泉）
  const deposited = cd.deposited != null ? cd.deposited : null;
  const diff = deposited != null ? deposited - drop : null;   // マイナス＝未精算／プラス＝お釣り
  return { all, live, cd, reward, option, transportBack, why, exempt, zappiAuto, zappi, plusItems, minusItems, plus, minus, takeHome, total, cardPaid, cardUnconfirmed, drop, withholding, provisional, shopDrop, realDrop, deposited, diff };
}

function render(){
  const ids = [...new Set(rows.map(r=>r.cast_id).filter(Boolean).concat(Object.keys(days)))];
  const first = id => { const r = rows.find(x=>x.cast_id === id && x.start_at); return r ? r.start_at : "9999"; };
  ids.sort((a, b)=>String(first(a)).localeCompare(String(first(b))));
  const cs = ids.map(id=>({ id, c: calcCast(id) }));
  const sum = cs.reduce((a, x)=>({ total: a.total + x.c.total, take: a.take + x.c.takeHome, drop: a.drop + x.c.drop, zappi: a.zappi + x.c.zappi, done: a.done + (x.c.cd.settled ? 1 : 0), shop: a.shop + x.c.shopDrop }), { total: 0, take: 0, drop: 0, zappi: 0, done: 0, shop: 0 });
  // 店落ち（暫定的な残額＋雑費）を22時まで／22時からに分ける（予約の始まりで。雑費は、その子の最初の予約の時間帯）。交通費バック・プラスマイナスは入れない
  const night = r => { if(!r.start_at) return false; const d = new Date(new Date(r.start_at).getTime() + 9 * 3600 * 1000); let h = d.getUTCHours(); if(h < 8) h += 24; return h >= 22; };
  const split = [0, 0];
  cs.forEach(({ c }) => {
    const mine = [...c.live].sort((a, b) => String(a.start_at || "").localeCompare(String(b.start_at || "")));
    mine.forEach(r => { split[night(r) ? 1 : 0] += (r.total || 0) - (Number(backOf(r)) || 0); });
    split[mine[0] && night(mine[0]) ? 1 : 0] += c.zappi || 0;
  });
  $("sum").innerHTML = `<div class="s">精算済み<b>${sum.done} / ${cs.length}人</b></div>
    <div class="s ${showMoney ? "" : "hide"}">総額<b>${yen(sum.total)}</b></div>
    <div class="s ${showMoney ? "" : "hide"}">キャスト手取り<b>${yen(sum.take)}</b></div>
    <div class="s ${showMoney ? "" : "hide"}">投函額（−はお店から渡す）<b>${yen(sum.drop)}</b></div>
    <div class="s ${showMoney ? "" : "hide"}">店落ち<b>${yen(sum.shop)}</b></div>
    <div class="s ${showMoney ? "" : "hide"}">☀️ 22時まで（暫定＋雑費）<b>${yen(split[0])}</b></div>
    <div class="s ${showMoney ? "" : "hide"}">🌙 22時から（暫定＋雑費）<b>${yen(split[1])}</b></div>
    <button class="btn btn-ghost btn-sm" onclick="showMoney=!showMoney;render()">${showMoney ? "🙈 金額をかくす" : "👁 金額を見る"}</button>`;
  if(!cs.length){ $("list").innerHTML = `<div class="gate">この日（${esc(day)}）の受付はまだありません</div>`; return; }
  $("list").innerHTML = cs.map(({ id, c })=>cardHtml(id, c)).join("");
}

function cardHtml(id, c){
  const cd = c.cd, done = !!cd.settled, dis = (!KB.CAN_EDIT || done) ? "disabled" : "";
  const res = c.all.map(r=>{
    const off = r.status === "cancel" || r.status === "tobi";
    return `<tr class="${off ? "off" : ""}"><td>${hm(r.start_at)}</td><td>${esc(storeLabel(r.store_key))}${r.dummy_name ? " 🎭" + esc(r.dummy_name) : ""}</td>
      <td>${esc(r.course)}${r.extension_count ? " 延長" + r.extension_count : ""}${off ? (r.status === "cancel" ? "（キャンセル）" : "（トビ）") : ""}</td>
      <td class="money">${yen(r.total)}${r.payment === "card_paid" ? " 💳" : ""}</td><td class="money">${off ? "－" : yen(backOf(r))}</td></tr>`;
  }).join("");
  const items = (list, kind)=> list.map((x, i)=>`<div class="it"><input class="lbl" value="${esc(x.label)}" ${dis} onchange="setItem('${id}','${kind}',${i},'label',this.value)">
      <input class="amt" type="number" value="${Number(x.amount) || 0}" ${dis} onchange="setItem('${id}','${kind}',${i},'amount',this.value)">
      ${dis ? "" : `<button class="btn btn-ghost btn-sm" onclick="delItem('${id}','${kind}',${i})">🗑</button>`}</div>`).join("");
  return `<div class="card ${done ? "done" : ""}" id="card-${id}">
    <h2>${esc(castName(id))}<span class="st">${done ? "精算済" + (cd.settle_place ? "（" + esc(cd.settle_place) + "）" : "") : "未精算"}</span>
      ${done && cd.settled_at ? `<small class="hint2">${esc(cd.settled_by || "")} ${hm(cd.settled_at)}</small>` : ""}</h2>
    <table class="res"><tr><th>時間</th><th>店舗</th><th>コース</th><th class="money">総額</th><th class="money">報酬</th></tr>${res}</table>
    ${c.why.length ? `<div class="note2">🧮 ${c.why.map(esc).join("<br>")}</div>` : ""}
    ${c.cardUnconfirmed ? `<div class="warn" style="margin:6px 0">⚠️ お支払いが「カード」のままの予約が ${c.cardUnconfirmed}件あります。カード決済の完了を確認して、本日のキャスト一覧のカードのプルダウンで「✅ 決済済み」にしてください。</div>` : ""}
    <div class="calc">
      <span class="k">① 報酬</span><span class="v">${yen(c.reward)}</span>
      <span class="k">OP（バック有）</span><span class="v">${yen(c.option)}</span>
      ${c.transportBack ? `<span class="k">交通費バック（自動）</span><span class="v">＋${yen(c.transportBack)}</span>` : ""}
      ${c.plus ? `<span class="k">② プラス（手入力）</span><span class="v">＋${yen(c.plus)}</span>` : ""}
      <span class="k">③ 雑費${c.exempt ? "（この曜日はなし）" : ""}${cd.zappi_override != null ? "（手で直した）" : ""}</span><span class="v">−${yen(c.zappi)}</span>
      ${c.minus ? `<span class="k">マイナス（手入力）</span><span class="v">−${yen(c.minus)}</span>` : ""}
      <span class="k"><b>手取り</b></span><span class="v big">${yen(c.takeHome)}</span>
      <span class="k">カード払分</span><span class="v">${yen(c.cardPaid)}</span>
      ${c.drop >= 0
        ? `<span class="k"><b>投函額</b>（総額 ${yen(c.total)} − 手取り − カード払分）</span><span class="v big">${yen(c.drop)}</span>`
        : `<span class="k"><b>お店からキャストに渡す</b>（カードで現金がないため）</span><span class="v big" style="color:#2f7fd0">${yen(-c.drop)}</span>`}
      <span class="k">投函した額（お金を確認したあと手入力）</span><span class="v">
        <input type="number" id="dep-${id}" value="${c.deposited != null ? c.deposited : ""}" placeholder="${c.drop >= 0 ? c.drop : ""}" ${KB.CAN_EDIT ? "" : "disabled"}
          style="width:110px;text-align:right;font-family:inherit;font-size:13px;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px" onchange="setDeposit('${id}',this.value)"></span>
      ${c.diff != null && c.diff !== 0 ? `<span class="k">${c.diff < 0 ? "<b style='color:#d9534f'>未精算（マイナス）</b>" : "<b style='color:#2f9e6e'>お釣り（プラス）</b>"}</span><span class="v" style="color:${c.diff < 0 ? "#d9534f" : "#2f9e6e"}">${c.diff < 0 ? "−" : "＋"}${yen(Math.abs(c.diff))}</span>` : ""}
      ${c.diff === 0 ? `<span class="k">投函した額</span><span class="v" style="color:#2f9e6e">ぴったり ✅</span>` : ""}
    </div>
    <details style="margin-top:6px"><summary style="cursor:pointer;font-size:12.5px;font-weight:800;color:var(--sub)">🏪 店落ち・税務用</summary>
      <div class="calc" style="margin-top:4px">
        <span class="k">暫定的な残額（総額 − 報酬）</span><span class="v">${yen(c.provisional)}</span>
        <span class="k"><b>店落ち</b>（総額 − 手取り）</span><span class="v">${yen(c.shopDrop)}</span>
        <span class="k">【税務用】源泉徴収（手取りからは引かない）</span><span class="v">${yen(c.withholding)}</span>
        <span class="k">実質的な店落ち（暫定的な残額 − 源泉）</span><span class="v">${yen(c.realDrop)}</span>
      </div>
    </details>
    ${dis ? "" : `<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:800;font-size:13px">✏️ プラス・マイナス・雑費を直す</summary>
      <div class="hint2" style="margin-top:6px">② プラス（交通費・ボーナスなど）</div><div class="items">${items(c.plusItems, "plus")}</div>
      <button class="btn btn-ghost btn-sm" onclick="addItem('${id}','plus')">＋ プラスを足す</button>
      <div class="hint2" style="margin-top:8px">マイナス（雑費以外）</div><div class="items">${items(c.minusItems, "minus")}</div>
      <button class="btn btn-ghost btn-sm" onclick="addItem('${id}','minus')">＋ マイナスを足す</button>
      <div class="hint2" style="margin-top:8px">雑費（自動：${yen(c.zappiAuto)}）</div>
      <div class="it" style="display:flex;gap:6px;align-items:center"><input type="number" id="zo-${id}" value="${cd.zappi_override != null ? cd.zappi_override : ""}" placeholder="空なら自動" style="width:120px">
        <button class="btn btn-ghost btn-sm" onclick="setZappi('${id}')">雑費を直す</button></div>
    </details>`}
    <div class="acts">
      <button class="btn btn-ghost btn-sm" onclick="copyDetail('${id}')">📋 精算明細をコピー（LINE用）</button>
      <button class="btn btn-ghost btn-sm" onclick="copyDetailImg('${id}')">🖼 画像でコピー</button>
      ${KB.CAN_EDIT ? (done
        ? `<button class="btn btn-ghost btn-sm" onclick="unsettle('${id}')">↩ 精算済をもどす</button>`
        : `<select id="pl-${id}">${PLACES.map(p=>`<option ${cd.settle_place === p ? "selected" : ""}>${p}</option>`).join("")}</select>
           <button class="btn btn-primary btn-sm" onclick="settle('${id}')">✅ 精算済にする</button>`) : ""}
    </div>
  </div>`;
}

/* ---------- 保存（kb_cast_days） ---------- */
async function saveDay(id, patch){
  const row = Object.assign({ biz_date: day, cast_id: id }, patch, { updated_at: new Date().toISOString(), updated_by: KB.operatorName() });
  try{
    const r = q(await sb.from("kb_cast_days").upsert(row, { onConflict: "biz_date,cast_id" }).select().single());
    days[id] = r; render();
  }catch(e){ toast("保存できませんでした：" + (e.message || e)); }
}
function curItems(id, kind){ const cd = days[id] || {}; const l = cd[kind + "_items"]; return Array.isArray(l) ? l.map(x=>Object.assign({}, x)) : []; }
function addItem(id, kind){ const l = curItems(id, kind); l.push({ label: kind === "plus" ? "交通費" : "", amount: 0 }); saveDay(id, { [kind + "_items"]: l }); }
function setItem(id, kind, i, k, v){ const l = curItems(id, kind); if(!l[i]) return; l[i][k] = k === "amount" ? (Number(v) || 0) : v; saveDay(id, { [kind + "_items"]: l }); }
function delItem(id, kind, i){ const l = curItems(id, kind); l.splice(i, 1); saveDay(id, { [kind + "_items"]: l }); }
function setDeposit(id, v){ saveDay(id, { deposited: v === "" ? null : Number(v) || 0 }); }
function setZappi(id){ const v = $("zo-" + id).value; saveDay(id, { zappi_override: v === "" ? null : Math.max(0, Number(v) || 0) }); }
function settle(id){
  const c = calcCast(id);
  if(!confirm(castName(id) + " を精算済にしますか？\n手取り " + yen(c.takeHome) + "／投函額 " + yen(c.drop))) return;
  const snap = { reward: c.reward, option: c.option, transportBack: c.transportBack, plus: c.plus, zappi: c.zappi, minus: c.minus,
                 takeHome: c.takeHome, total: c.total, cardPaid: c.cardPaid, drop: c.drop, withholding: c.withholding,
                 shopDrop: c.shopDrop, realDrop: c.realDrop, deposited: c.deposited, diff: c.diff, by: KB.operatorName(), at: new Date().toISOString() };
  saveDay(id, { settled: true, settled_at: new Date().toISOString(), settled_by: KB.operatorName(), settle_place: $("pl-" + id).value, settle_snapshot: snap });
}
function unsettle(id){
  if(!confirm(castName(id) + " の精算済をもどしますか？")) return;
  saveDay(id, { settled: false, settled_at: null, settle_snapshot: null });
}

/* ---------- 🖼 精算明細を画像でコピー（LINE に貼りつけ）。コピーできないブラウザは画像を保存 ---------- */
function settleCanvas(id){
  const c = calcCast(id), d = new Date(day + "T12:00:00Z");
  const L = [];   // [左, 右, 種類]
  c.all.forEach(r=>{
    const off = r.status === "cancel" || r.status === "tobi";
    L.push([`${hm(r.start_at)} ${storeLabel(r.store_key)} ${r.course}${/^\d+$/.test(r.course) ? "分" : ""}${r.extension_count ? " 延長" + r.extension_count : ""}`, off ? (r.status === "cancel" ? "キャンセル" : "トビ") : yen(backOf(r)), off ? "off" : "res"]);
  });
  L.push(["", "", "line"]);
  L.push(["報酬", yen(c.reward)]);
  if(c.option) L.push(["OP", yen(c.option)]);
  if(c.transportBack) L.push(["交通費バック", "＋" + yen(c.transportBack)]);
  c.plusItems.forEach(x=>{ if(Number(x.amount)) L.push([x.label || "プラス", "＋" + yen(x.amount)]); });
  L.push(["雑費", "−" + yen(c.zappi)]);
  c.minusItems.forEach(x=>{ if(Number(x.amount)) L.push([x.label || "マイナス", "−" + yen(x.amount)]); });
  L.push(["", "", "line"]);
  L.push(["本日のお給料", yen(c.takeHome), "big"]);
  if(c.drop >= 0) L.push(["投函額", yen(c.drop), "big2"]); else L.push(["お店からお渡し（カード決済のため）", yen(-c.drop), "big2"]);
  const S = 2, W = 560, PAD = 28, FONT = '"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic","Meiryo",sans-serif';
  const hOf = k => k === "line" ? 18 : k === "big" || k === "big2" ? 44 : 34;
  const H = 96 + L.reduce((a, x)=>a + hOf(x[2]), 0) + 64;
  const cv = document.createElement("canvas"); cv.width = W * S; cv.height = H * S;
  const g = cv.getContext("2d"); g.scale(S, S);
  g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, W, H);
  const grd = g.createLinearGradient(0, 0, W, 0); grd.addColorStop(0, "#ff9fb8"); grd.addColorStop(1, "#e5638c");
  g.fillStyle = grd; g.fillRect(0, 0, W, 72);
  g.fillStyle = "#fff"; g.font = `bold 15px ${FONT}`; g.fillText(`精算　${d.getUTCMonth() + 1}/${d.getUTCDate()}(${DOW[d.getUTCDay()]})`, PAD, 28);
  g.font = `bold 24px ${FONT}`; g.fillText(`${castName(id)}さん`, PAD, 58);
  let y = 96;
  L.forEach(([l, v, k])=>{
    const h = hOf(k);
    if(k === "line"){ g.strokeStyle = "#F1C9D5"; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(PAD, y + 6); g.lineTo(W - PAD, y + 6); g.stroke(); g.setLineDash([]); y += h; return; }
    const big = k === "big" || k === "big2";
    g.font = `${big ? "bold 19px" : k === "res" || k === "off" ? "15px" : "bold 16px"} ${FONT}`;
    g.fillStyle = k === "off" ? "#B9A9AD" : "#5C4B4F"; g.textAlign = "left"; g.fillText(l, PAD, y + h / 2 + 6);
    g.font = `${big ? "bold 24px" : "bold 16px"} ${FONT}`;
    g.fillStyle = k === "big" ? "#e5638c" : k === "big2" ? "#2f7fd0" : k === "off" ? "#B9A9AD" : "#5C4B4F"; g.textAlign = "right"; g.fillText(v, W - PAD, y + h / 2 + 7);
    y += h;
  });
  g.textAlign = "center"; g.fillStyle = "#e5638c"; g.font = `bold 15px ${FONT}`; g.fillText("お疲れさまでした🌸", W / 2, y + 34);
  return cv;
}
function copyDetailImg(id){
  const cv = settleCanvas(id);
  cv.toBlob(async b=>{
    try{
      if(!navigator.clipboard || !window.ClipboardItem) throw new Error("no");
      await navigator.clipboard.write([new ClipboardItem({ "image/png": b })]);
      toast("🖼 精算を画像でコピーしました（LINEに貼りつけできます）");
    }catch(e){
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `精算_${day}_${castName(id)}.png`; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      toast("🖼 コピーできないので、画像を保存しました");
    }
  }, "image/png");
}
/* ---------- 精算明細（LINE に送る文） ---------- */
function copyDetail(id){
  const c = calcCast(id), d = new Date(day + "T12:00:00Z");
  const lines = [`【精算】${d.getUTCMonth() + 1}/${d.getUTCDate()}(${DOW[d.getUTCDay()]}) ${castName(id)}さん`, ""];
  c.all.forEach(r=>{
    const off = r.status === "cancel" || r.status === "tobi";
    lines.push(`・${hm(r.start_at)} ${storeLabel(r.store_key)} ${r.course}${/^\d+$/.test(r.course) ? "分" : ""}${r.extension_count ? " 延長" + r.extension_count : ""}　${off ? (r.status === "cancel" ? "キャンセル" : "トビ") : "報酬 " + yen(backOf(r))}`);
  });
  lines.push("", `報酬　${yen(c.reward)}`);
  if(c.option) lines.push(`OP　${yen(c.option)}`);
  if(c.transportBack) lines.push(`交通費バック　＋${yen(c.transportBack)}`);
  c.plusItems.forEach(x=>{ if(Number(x.amount)) lines.push(`${x.label || "プラス"}　＋${yen(x.amount)}`); });
  lines.push(`雑費　−${yen(c.zappi)}`);
  c.minusItems.forEach(x=>{ if(Number(x.amount)) lines.push(`${x.label || "マイナス"}　−${yen(x.amount)}`); });
  lines.push("", `本日のお給料　${yen(c.takeHome)}`);
  if(c.drop >= 0) lines.push(`投函額　${yen(c.drop)}`);
  else lines.push(`（カード決済のため、お店から ${yen(-c.drop)} お渡しします）`);
  lines.push("", "お疲れさまでした🌸");
  navigator.clipboard.writeText(lines.join("\n")).then(()=>toast("📋 精算明細をコピーしました"), ()=>alert(lines.join("\n")));
}

init();
