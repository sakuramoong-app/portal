<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフトの色マップ│サクラG</title>
<link rel="icon" type="image/png" href="../favicon.png?v=3">
<link rel="stylesheet" href="kb.css"><link rel="stylesheet" href="kb_theme.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/session_guard.js"></script>
<script src="kb_common.js?v=25"></script>
<script src="kb_face.js?v=6"></script>
<style>
  body{font-size:14px}
  .wrap.wide{max-width:1400px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .bar input[type=date]{font-family:inherit;font-size:15px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px}
  table.sm{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(92,75,79,.08)}
  table.sm th, table.sm td{border-bottom:1px solid #F3E6EA;padding:4px 6px;vertical-align:middle}
  table.sm thead th{background:#FCE4EC;color:#AD1457;font-size:13px;position:sticky;top:0;z-index:2}
  table.sm thead th.today{background:#E5638C;color:#fff}
  table.sm td.nm{white-space:nowrap;font-weight:900;font-size:13px;min-width:150px}
  table.sm td.nm .kbface{margin-right:6px}
  .day{position:relative;height:26px;min-width:120px;background:repeating-linear-gradient(90deg,#FAF5F7 0 calc(100%/18 - 1px),#EFE4E8 calc(100%/18 - 1px) calc(100%/18));border-radius:6px}
  .seg{position:absolute;top:3px;bottom:3px;border-radius:5px;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .seg.ok{background:linear-gradient(90deg,#E5638C,#F48FB1)}
  .seg.wait{background:repeating-linear-gradient(135deg,#F8BBD0 0 6px,#FCE4EC 6px 12px);color:#AD1457}
  .seg.kan{box-shadow:inset 0 0 0 2px #7B1FA2}
  tr.cnt td{background:#FFF8E1;font-weight:800;font-size:12px}
  .heat{display:flex;height:22px;border-radius:6px;overflow:hidden}
  .heat span{flex:1;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#5C4B4F}
  .hours{display:flex;font-size:10px;color:#9C8B8F;font-weight:700} .hours span{flex:1;text-align:left}
  .leg{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#7a6a6f;font-weight:700}
  .leg i{display:inline-block;width:26px;height:12px;border-radius:4px;vertical-align:middle;margin-right:4px}
</style>
</head>
<body>
<div class="wrap wide">
  <header class="kbh"><h1>🗓 シフトの色マップ</h1><span class="sub">1週間 × キャスト（見るだけ・店長と社長だけ）</span></header>
  <div id="gate" class="gate">読み込み中…</div>
  <div id="main" style="display:none">
    <div class="bar">
      <button class="btn btn-ghost btn-sm" onclick="moveWeek(-7)">◀ 前の週</button>
      <input type="date" id="wk" onchange="load()">
      <button class="btn btn-ghost btn-sm" onclick="moveWeek(7)">次の週 ▶</button>
      <button class="btn btn-ghost btn-sm" onclick="$('wk').value=mondayOf(KB.bizDateOf());load()">今週</button>
      <span class="leg"><span><i style="background:linear-gradient(90deg,#E5638C,#F48FB1)"></i>出勤（受理ずみ）</span><span><i style="background:repeating-linear-gradient(135deg,#F8BBD0 0 6px,#FCE4EC 6px 12px)"></i>まだ受理していない</span><span><i style="box-shadow:inset 0 0 0 2px #7B1FA2;background:#fff"></i>完（完全終了）</span></span>
    </div>
    <div class="hint" style="margin-bottom:6px">1マス＝1時間（11時〜翌5時）。いちばん上の黄色い行は、その時間に何人出勤しているか（こいほど多い）。</div>
    <div id="out"></div>
  </div>
</div>
<script>
const sb = KB.sb, $ = id => document.getElementById(id), esc = KB.esc, q = KB.q;
const H0 = 11, H1 = 29, HN = H1 - H0;   // 11時〜翌5時
const DOW = ["日", "月", "火", "水", "木", "金", "土"];
const ACC = ["input_waiting", "inputting", "confirmed", "change_requested", "change_inputting", "change_confirmed"];
let casts = [];
function mondayOf(ymd){ const d = new Date(ymd + "T12:00:00Z"), w = d.getUTCDay(); d.setUTCDate(d.getUTCDate() + (w === 0 ? -6 : 1 - w)); return d.toISOString().slice(0, 10); }
function addDays(ymd, n){ const d = new Date(ymd + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function hl(h){ h = Number(h); const x = h >= 24 ? h - 24 : h; return Math.floor(x) + (h % 1 ? ":30" : ""); }
function moveWeek(n){ $("wk").value = addDays(mondayOf($("wk").value), n); load(); }
async function init(){
  if(!(await KB.staffSession())){ $("gate").textContent = "ポータルから開いてください"; return; }
  if(!KB.IS_BOSS){ $("gate").textContent = "店長・社長だけのページです"; return; }
  try{ casts = q(await sb.from("master_casts").select("id,official_name,temp_name,shift_name,kana,status,stores").neq("status", "left")) || []; }catch(e){ casts = []; }
  window.KBF_CASTS = casts;
  $("gate").style.display = "none"; $("main").style.display = "";
  $("wk").value = mondayOf(KB.bizDateOf()); load();
}
async function load(){
  const wk = mondayOf($("wk").value); $("wk").value = wk;
  $("out").innerHTML = `<div class="gate">読み込み中…</div>`;
  let rows = [];
  try{ rows = q(await sb.from("shift_weeks").select("cast_name,data").eq("wk", wk)) || []; }catch(e){ $("out").innerHTML = `<div class="warn">読めませんでした：${esc(e.message || e)}</div>`; return; }
  const days = [...Array(7)].map((_, i) => addDays(wk, i)), today = KB.bizDateOf();
  const list = rows.map(r => {
    const c = casts.find(x => x.shift_name === r.cast_name || x.official_name === r.cast_name) || null;
    const sh = (r.data && r.data.shifts) || {}, acc = ACC.includes(r.data && r.data.status), kan = (r.data && r.data.kanzen) || {};
    return { name: c ? (c.official_name || c.temp_name) : r.cast_name, c, kana: (c && c.kana) || r.cast_name, acc, cells: days.map(d => { const s = sh[d]; return s && s.start != null && s.end != null ? { s: Number(s.start), e: Number(s.end), kan: !!kan[d] } : null; }) };
  }).filter(x => x.cells.some(Boolean)).sort((a, b) => b.cells.filter(Boolean).length - a.cells.filter(Boolean).length || String(a.kana).localeCompare(String(b.kana), "ja"));
  // その時間に何人（受理ずみだけ）
  const heat = days.map((d, i) => [...Array(HN)].map((_, k) => list.filter(x => x.acc && x.cells[i] && x.cells[i].s <= H0 + k && x.cells[i].e > H0 + k).length));
  const mx = Math.max(1, ...heat.flat());
  const heatHtml = h => `<div class="heat">${h.map(n => `<span style="background:rgba(229,99,140,${(n / mx * .85).toFixed(2)});color:${n / mx > .55 ? "#fff" : "#5C4B4F"}" title="${n}人">${n || ""}</span>`).join("")}</div>`;
  const seg = c => { const L = Math.max(0, (c.s - H0) / HN * 100), R = Math.min(100, (c.e - H0) / HN * 100); return `<div class="seg ${c.acc ? "ok" : "wait"} ${c.kan ? "kan" : ""}" style="left:${L}%;width:${Math.max(2, R - L)}%">${hl(c.s)}-${hl(c.e)}${c.kan ? "完" : ""}</div>`; };
  $("out").innerHTML = list.length ? `<table class="sm"><thead><tr><th>キャスト（${list.length}人）</th>${days.map(d => { const dd = new Date(d + "T12:00:00Z"); return `<th class="${d === today ? "today" : ""}">${dd.getUTCMonth() + 1}/${dd.getUTCDate()}（${DOW[dd.getUTCDay()]}）<div class="hours">${[11, 14, 17, 20, 23, 26].map(h => `<span>${h >= 24 ? h - 24 : h}</span>`).join("")}</div></th>`; }).join("")}</tr></thead>
    <tbody><tr class="cnt"><td>🔥 出勤している人数</td>${heat.map(h => `<td>${heatHtml(h)}</td>`).join("")}</tr>
    ${list.map(x => `<tr><td class="nm">${KBF.img(x.c || { official_name: x.name }, 28)}${esc(x.name)}${x.acc ? "" : ` <small style="color:#AD1457">（まだ受理していない）</small>`}</td>${x.cells.map(c => `<td><div class="day">${c ? seg(Object.assign({ acc: x.acc }, c)) : ""}</div></td>`).join("")}</tr>`).join("")}</tbody></table>`
    : `<div class="gate">この週のシフトはありません</div>`;
}
init();
</script>
</body>
</html>
