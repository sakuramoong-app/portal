<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顧客台帳│サクラG</title>
<link rel="icon" type="image/png" href="../favicon.png?v=3">
<link rel="stylesheet" href="kb.css"><link rel="stylesheet" href="kb_theme.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/session_guard.js"></script><!-- 退勤時刻で自動ログアウト -->
<script src="kb_common.js?v=25"></script>
<script src="kb_face.js?v=8"></script><!-- 🖼 キャストの写真アイコン -->
<style>
  body{font-size:14.5px;}
  .wrap.wide{max-width:1280px;}
  header.kbh .navinhead{flex:1;} header.kbh .navinhead .kbnav{margin:0;}
  .cols{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:12px;align-items:start;}
  @media (max-width:900px){ .cols{grid-template-columns:1fr;} }
  .search{display:flex;gap:6px;margin-bottom:8px;}
  .search input{flex:1;font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;}
  .flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .list{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;max-height:76vh;overflow-y:auto;}
  .li{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;}
  .li:hover{background:#FFF8FA;} .li.on{background:var(--pink-soft);}
  .li .nm{font-weight:800;} .li .sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .badge{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:800;margin-left:4px;}
  .b-ng{background:#FFE3E3;color:#B0213F;} .b-cng{background:#FFF0E0;color:#A35A00;}
  .detail{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;}
  .detail h2{font-size:18px;color:var(--pink-deep);margin-bottom:4px;}
  .csec{margin-top:14px;} .csec h3{font-size:14.5px;color:var(--sub);margin-bottom:6px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;}
  .stats .c{background:#FBF7F8;border-radius:12px;padding:8px 10px;} .stats .k{font-size:11.5px;color:var(--sub);font-weight:800;} .stats .v{font-size:16px;font-weight:800;}
  .ngbox{background:#FFE8EC;border:2px solid #E5486C;border-radius:12px;padding:8px 10px;color:#B0213F;font-weight:800;}
  table.h{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.h th,table.h td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;}
  table.h th{background:#FBF3F6;color:var(--sub);font-size:11.5px;position:sticky;top:0;}
  table.h tr.cancel td{background:#FFF1DE;} table.h tr.tobi td{background:#FFE1E1;} table.h tr.flowed td{background:#E6F6E8;}
  table.h tr.castng td{color:#D0021B;font-weight:800;}
  table.h td.memo{white-space:pre-wrap;max-width:320px;}
  /* 利用の履歴（カード） */
  .hfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .hlist{max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:6px;}
  .hc{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font-size:13.5px;line-height:1.6;}
  .hc.cancel{background:#FFF7EC;border-color:#F3C77A;} .hc.tobi{background:#FFF0F0;border-color:#F2A1A1;} .hc.flowed{background:#F1FAF2;border-color:#A8DDB0;}
  .hc.castng{border-color:#E5484D;border-width:2px;}
  .hc .hh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .hc .hm{color:#5C4B4F;font-size:13px;margin-top:2px;}
  .hc .hmemo{white-space:pre-wrap;background:#FBF7F8;border-radius:8px;padding:6px 8px;margin-top:6px;font-size:14px;}
  .hc .hmemo.red{color:#C62828;font-weight:700;}
  .hc .hmemo .hw{color:#fff;background:#E5484D;border-radius:4px;padding:0 3px;}
  .badge{font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px;background:#eee;}
  .badge.cancel{background:#FFE2B8;color:#8a5a00;} .badge.tobi{background:#FFD0D0;color:#C62828;} .badge.flowed{background:#D2F2D8;color:#1f7a3a;}
  .tag{font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:0 7px;}
  .dot{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(0,0,0,.15);font-size:10px;font-weight:800;}
  .mark{display:inline-block;background:#FFF3B0;border:1.5px solid #E8C200;border-radius:6px;padding:0 5px;font-size:11px;font-weight:800;color:#7a5d00;margin-left:4px;}
  .src{font-size:10.5px;color:var(--sub);}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;} @media (max-width:640px){ .f2{grid-template-columns:1fr;} }
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .pl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .empty{color:var(--sub);padding:20px;text-align:center;}
  /* 🫧 顧客台帳：まるっと・ぷくっと（2026/11/7 店長）。中身は変えない */
  body .search input{border-radius:16px;border-color:#F0DCE3;box-shadow:0 3px 0 #F3E3E9,0 6px 14px rgba(92,75,79,.06);padding:11px 14px}
  body .list{border-radius:20px;border-color:#F2E0E6;box-shadow:0 4px 0 #F3E3E9,0 10px 24px rgba(92,75,79,.07);padding:6px;background:#fff}
  body .li{border:1.5px solid #F4E6EB;border-radius:14px;margin:6px 4px;padding:10px 14px;background:linear-gradient(180deg,#fff,#FFFAFC);box-shadow:0 2px 0 #F3E3E9;transition:transform .08s}
  body .li:hover{transform:translateY(-1px);background:#FFF5F8}
  body .li.on{background:linear-gradient(90deg,#FFE3EC,#FFF5F8);border-color:#F7B6CF;box-shadow:inset 6px 0 0 #E5638C,0 3px 0 #F1CFDB}
  body .li .nm{font-size:16px;font-weight:900}
  body .li .sub{font-size:13px;font-weight:800;color:#7c6a70;margin-top:3px}
  body .detail{border-radius:22px;border-color:#F2E0E6;box-shadow:0 4px 0 #F3E3E9,0 12px 28px rgba(92,75,79,.08);padding:18px}
  body .detail h2{font-size:24px;font-weight:900}
  body .detail h2 small{font-size:16px !important;font-weight:800}
  body .ngbox{border-radius:16px;font-size:14.5px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
  body .stats{gap:10px;grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
  body .stats .c{position:relative;background:linear-gradient(180deg,#fff,#FFF7FA);border:1.5px solid #F4E6EB;border-radius:16px;padding:10px 12px 10px 46px;box-shadow:0 3px 0 #F3E3E9,0 6px 14px rgba(92,75,79,.05)}
  body .stats .c::before{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:22px}
  body .stats .c:nth-child(1)::before{content:"🗓"} body .stats .c:nth-child(2)::before{content:"💰"} body .stats .c:nth-child(3)::before{content:"🌱"}
  body .stats .c:nth-child(4)::before{content:"📅"} body .stats .c:nth-child(5)::before{content:"🚫"}
  body .stats .k{font-size:12.5px} body .stats .v{font-size:19px !important;font-weight:900}
  body .csec{margin-top:16px}
  body .csec > h3{font-size:16.5px;font-weight:900;color:#5C4B4F;margin-bottom:8px}
  body .csec:has(> h3){background:linear-gradient(180deg,#FFFBFD,#fff 60px);border:1.5px solid #F4E6EB;border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 #F3E3E9}
  body .detail .f2 input, body .detail .f2 select, body .detail textarea, body .detail input{border-radius:12px}
  body .hc{border-radius:16px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 4px 10px rgba(92,75,79,.05);padding:10px 12px}
  body .hc .hmemo{border-radius:12px}
  body .ctag{box-shadow:0 3px 0 #F1D3DE,0 5px 10px rgba(229,99,140,.08);font-weight:900;padding:6px 14px}
  body .ctag.on{box-shadow:0 3px 0 #C24A74}
  body .ctag.on.tg-ng{box-shadow:0 3px 0 #8E0014} body .ctag.on.tg-chk{box-shadow:0 3px 0 #B05A10}
  body #tagSel{box-shadow:0 3px 0 #F1D3DE;border:1.5px solid #F2D9E2;background:linear-gradient(180deg,#fff,#FFF5F8);font-family:inherit;color:#5C4B4F}
</style>
</head>
<body>
<div class="wrap wide">
  <header class="kbh"><h1>👥 顧客台帳</h1><div id="navArea" class="navinhead"></div></header>
  <div id="wipArea"></div>
  <div id="gate" class="gate">読み込み中…</div>
  <div id="main" style="display:none">
    <div class="cols">
      <div>
        <div class="search"><input id="q" placeholder="電話番号（下3けたからでも）か名前で探す" oninput="debounceSearch()" autocomplete="off"></div>
        <div class="search"><input id="qp" placeholder="📍 エリア・ホテル名・住所で探す（例：川崎）" oninput="debouncePlace()" autocomplete="off"></div>
        <div class="flt">
          <button class="chip on" data-f="all" onclick="setFilter('all')">ぜんぶ</button>
          <button class="chip" data-f="ng" onclick="setFilter('ng')">⚠️ 店NG</button>
          <button class="chip" data-f="cng" onclick="setFilter('cng')">🙅 キャストNGあり</button>
          <button class="chip" onclick="openNgReview()" title="台帳エクセルと見比べて、本当にNGか1人ずつ決める">🔎 NGの見比べ</button>
          <select id="tagSel" onchange="searchByTag(this.value)" onfocus="fillTagSel()" style="border-radius:99px;padding:4px 10px;font-weight:800"><option value="">🏷 タグで探す</option></select>
          <button class="btn btn-ghost btn-sm edit-only" onclick="newCustomer()">＋ お客さんを足す</button>
        </div>
        <div class="list" id="list"><div class="empty">読み込み中…</div></div>
        <div class="hint" id="listHint" style="font-size:12px;color:var(--sub);margin-top:6px"></div>
      </div>
      <div id="detail" class="detail"><div class="empty">左からお客さんを選んでください</div></div>
    </div>
  </div>
</div>
<script>
/* ============================================================
   👥 顧客台帳
   ・電話番号（下3けたからでも）か名前で探す。店NG・キャストNGありで絞れる
   ・1人ずつ：名前・電話・NG（理由）・メモ・キャストごとのNG・よく使う場所・利用の履歴・数字
   ・履歴＝新しい記録簿の予約 ＋ 台帳エクセルから取りこんだ過去の利用（kb_cust_history）
     台帳エクセルで目立たせてあったところ（赤い文字・塗りつぶし）と備考も、そのまま目立たせて出す
   ・直せるのは、作成中は店長（きゃ）だけ
   ============================================================ */
const { sb, q, esc, yen, toast } = KB;
const $ = id => document.getElementById(id);
// 電話番号：数字だけ。「+81」（日本）は 0 から始まる形に、ほかの国の「+」「00」で始まる番号は「+」を残す（記録簿の受付と同じ）
const phoneNormC = s => { const t = String(s || "").normalize("NFKC").trim(), d = t.replace(/[^\d]/g, ""); if(!/^(\+|00)/.test(t)) return d; const n = t.startsWith("00") ? d.slice(2) : d; return n.startsWith("81") ? "0" + n.slice(2) : (n ? "+" + n : ""); };
let M = { casts: [], stores: [] }, results = [], cur = null, filter = "all", timer = null;
const STATUS = { done: "", cancel: "キャンセル", tobi: "トビ", flowed: "流れた" };
const castLabel = id => { const c = M.casts.find(x=>x.id === id); return c ? (c.official_name || c.temp_name) : ""; };
const storeLabel = k => { const s = M.stores.find(x=>x.key === k); return s ? s.label : k; };
const md = d => { if(!d) return ""; const [y, m, dd] = String(d).split("-"); return `${y}/${Number(m)}/${Number(dd)}`; };
const fmtPhone = p => { p = String(p || ""); return p.length === 11 ? p.slice(0, 3) + "-" + p.slice(3, 7) + "-" + p.slice(7) : p.length === 10 ? p.slice(0, 2) + "-" + p.slice(2, 6) + "-" + p.slice(6) : p; };

async function init(){
  $("navArea").innerHTML = KB.nav("customers.html");
  if(!KB.CAN_EDIT) document.body.classList.add("readonly");
  $("wipArea").innerHTML = KB.wipBanner();
  if(!(await KB.staffSession())){ $("gate").textContent = "ポータルから開いてください（ポータルでログインしてから20時間たった場合も、開き直してください）"; return; }
  try{
    const [casts, stores] = await Promise.all([
      sb.from("master_casts").select("id,official_name,temp_name,kana,status,stores").order("kana"),
      sb.from("master_stores").select("key,label").order("sort"),
    ]);
    M.casts = q(casts) || []; M.stores = q(stores) || [];
  }catch(e){ $("gate").textContent = "読み込みに失敗しました：" + (e.message || e); return; }
  $("gate").style.display = "none"; $("main").style.display = "";
  await search();
  const id = Number(new URLSearchParams(location.search).get("id"));   // 記録簿から「?id=」で開いたとき
  if(id) openCustomer(id);
}
function debounceSearch(){ clearTimeout(timer); if($("qp")) $("qp").value = ""; timer = setTimeout(search, 300); }
// 📍 エリア・ホテル名・住所で探す（台帳エクセルの履歴＋記録簿の予約。交通費の参考に）SQL 215。2026/11/6
function debouncePlace(){ clearTimeout(timer); $("q").value = ""; timer = setTimeout(placeSearch, 400); }
async function placeSearch(){
  const t = $("qp").value.trim();
  if(t.length < 2){ if(!t) search(); else $("listHint").textContent = "2文字以上入れてください"; return; }
  $("listHint").textContent = "探しています…";
  let l = [];
  try{ l = q(await sb.rpc("kb_customer_place_search", { p_q: t, p_limit: 200 })) || []; }
  catch(e){ $("listHint").textContent = "探せませんでした（SQL 215 は実行ずみ？）：" + (e.message || e); return; }
  if($("qp").value.trim() !== t) return;
  const tr = l.filter(x => Number(x.transport) > 0).map(x => Number(x.transport));
  const avg = tr.length ? Math.round(tr.reduce((a, b) => a + b, 0) / tr.length / 500) * 500 : null;
  $("listHint").innerHTML = `「${esc(t)}」で入ったこと：${l.length}件${l.length >= 200 ? "（新しい200件）" : ""}・${new Set(l.map(x => x.customer_id)).size}人`
    + (tr.length ? `　🚕 交通費（記録簿の${tr.length}件）：よくある額 <b>${yen(mode(tr))}</b>・平均 約${yen(avg)}・${yen(Math.min(...tr))}〜${yen(Math.max(...tr))}` : "");
  $("list").innerHTML = l.length ? l.map(x => `<div class="li" onclick="openCustomer(${x.customer_id})">
      <div class="nm">${esc(x.name || "（名前なし）")}${x.ng ? '<span class="badge b-ng">⚠️ 店NG</span>' : ""}<small style="color:var(--sub);font-weight:600;margin-left:6px">${x.biz_date ? md(x.biz_date) : ""}</small></div>
      <div class="sub">📍 ${esc([x.area, x.place].filter(Boolean).join(" "))}${Number(x.transport) ? `　🚕 ${yen(x.transport)}` : ""}　<small>${esc(x.src)}</small></div></div>`).join("")
    : `<div class="empty">見つかりません</div>`;
}
const mode = a => { const c = {}; a.forEach(v => c[v] = (c[v] || 0) + 1); return Number(Object.keys(c).sort((x, y) => c[y] - c[x])[0]); };
function setFilter(f){ filter = f; document.querySelectorAll(".flt .chip").forEach(b=>b.classList.toggle("on", b.dataset.f === f));
  // 2026/11/13 店長：店NG・キャストNGありは、最近の60人の中だけでなく、台帳の全員から出す（検索の文字が空のとき）
  if((f === "ng" || f === "cng") && !$("q").value.trim()){ loadNgAll(f); return; }
  if(f === "all" && results.some(r => r.ngAll)) { search(); return; }
  paintList(); }
async function loadNgAll(f){
  $("listHint").textContent = "読み込んでいます…";
  try{
    let l = [];
    if(f === "ng"){
      l = q(await sb.from("kb_customers").select("id,name,phone,ng,ng_ask,ng_reason").eq("ng", true).order("updated_at", { ascending: false }).limit(2000)) || [];
    } else {
      const ns = q(await sb.from("kb_cust_cast_ng").select("customer_id").limit(10000)) || [];
      const cnt = {}; ns.forEach(x => { if(x.customer_id) cnt[x.customer_id] = (cnt[x.customer_id] || 0) + 1; });
      const ids = Object.keys(cnt).map(Number);
      for(let i = 0; i < ids.length; i += 200){
        const part = q(await sb.from("kb_customers").select("id,name,phone,ng,ng_ask,ng_reason").in("id", ids.slice(i, i + 200))) || [];
        l = l.concat(part.map(x => Object.assign(x, { cast_ng: cnt[x.id] || 0 })));
      }
      l.sort((a, b) => (b.cast_ng || 0) - (a.cast_ng || 0));
    }
    if(filter !== f) return;
    results = l.map(x => Object.assign({ ngAll: true }, x));
    $("listHint").textContent = f === "ng" ? `⚠️ 店NGのお客さん ${l.length}人（台帳の全員から）${l.some(x => x.ng_ask) ? `・🤔 決めてほしい人 ${l.filter(x => x.ng_ask).length}人` : ""}` : `🙅 キャストNGがあるお客さん ${l.length}人（台帳の全員から）`;
  }catch(e){ results = []; $("listHint").textContent = "読めませんでした：" + (e.message || e); }
  paintList();
}
async function search(){
  const t = $("q").value.trim();
  if($("tagSel") && t) $("tagSel").value = "";
  try{
    results = q(await sb.rpc("kb_customer_search", { p_q: t, p_limit: t ? 100 : 60 })) || [];
    $("listHint").textContent = t ? `${results.length}人見つかりました${results.length >= 100 ? "（100人まで表示）" : ""}` : "最近のお客さん（新しく来た順）。電話番号か名前で探せます";
  }catch(e){ results = []; $("listHint").textContent = "探せませんでした（SQL 124 は実行ずみ？）：" + (e.message || e); }
  paintList();
}
function paintList(){
  let list = results.filter(r=>filter === "all" || (filter === "ng" && r.ng) || (filter === "cng" && r.cast_ng > 0));
  // 🎯 完全一致（番号・名前がぴったり）を先に、その下に 🔎 一部一致（エクセルの Ctrl+F と同じ）2026/11/7
  const t = $("q").value.trim(), d = t.replace(/\D/g, ""), nk = s => String(s || "").normalize("NFKC").replace(/\s|　/g, "");
  const exact = r => !!t && ((d.length >= 6 && String(r.phone || "") === d) || (!!nk(t) && nk(r.name) === nk(t)));
  if(t){ const ex = list.filter(exact), pa = list.filter(r => !exact(r)); list = ex.concat(pa);
    const head = (s, n) => `<div class="li" style="cursor:default;background:#FFF5D6;font-weight:900;padding:6px 10px">${s}（${n}人）</div>`;
    const row = r => liHtml(r);
    $("list").innerHTML = list.length ? (ex.length ? head("🎯 完全一致", ex.length) + ex.map(row).join("") : `<div class="li" style="cursor:default;background:#FFF5D6;font-weight:900;padding:6px 10px">🎯 完全一致はありません</div>`)
      + (pa.length ? head("🔎 一部一致の候補", pa.length) + pa.map(row).join("") : "") : `<div class="empty">見つかりません</div>`;
    return; }
  $("list").innerHTML = list.length ? list.map(liHtml).join("")
    : `<div class="empty">見つかりません</div>`;
}
function liHtml(r){ return `<div class="li ${cur && cur.id === r.id ? "on" : ""}" onclick="openCustomer(${r.id})">
      <div class="nm">${esc(r.name || "（名前なし）")}${r.ng ? '<span class="badge b-ng">⚠️ 店NG</span>' : ""}${r.cast_ng ? `<span class="badge b-cng">🙅 キャストNG ${r.cast_ng}</span>` : ""}</div>
      <div class="sub">📞 ${esc(fmtPhone(r.phone))}　${r.ngAll ? (r.ng_ask ? "🤔 決めてほしい：" : "") + esc(String(r.ng_reason || "").slice(0, 40)) : r.tagOnly ? "🏷 " + esc((r.tags || []).join("・")) : r.visits ? `${r.visits}回・最後 ${md(r.last_date)}・合計 ${yen(r.total)}` : "まだ利用なし"}</div></div>`;
}

/* ---------- 1人ずつ ---------- */
async function openCustomer(id){
  $("detail").innerHTML = `<div class="empty">読み込み中…</div>`;
  try{
    const [c, res, hist, ngs, places] = await Promise.all([
      sb.from("kb_customers").select("*").eq("id", id).maybeSingle(),
      sb.from("kb_reservations").select("id,biz_date,store_key,dummy_name,cast_id,course,extension_count,area,address,total,status,payment,memo_log,visit_kind").eq("customer_id", id).eq("deleted", false).order("biz_date", { ascending: false }).limit(500),
      sb.from("kb_cust_history").select("*").eq("customer_id", id).order("biz_date", { ascending: false }).limit(1000),
      sb.from("kb_cust_cast_ng").select("*").eq("customer_id", id).order("at"),
      sb.from("kb_customer_places").select("*").eq("customer_id", id).order("last_used", { ascending: false }),
    ]);

<script>
/* ---------- 🔎 店NGの見比べ（2026/11/13 店長）：台帳エクセルと見比べて、本当にNGか1人ずつ決める
   ・また来そうな人（最後に来た日が新しい人）から順に
   ・NGのもとになったエクセルの行（何行目・備考の全文）。行番号は「A123」の形でコピー → エクセルで Ctrl+G に貼ると、その行に飛ぶ

let ngRev = null, ngRevHideDone = true;
const NGR_WORDS = /NG|ＮＧ|出禁|トビ|ﾄﾋﾞ|飛ん|飛ば|とんだ|クレーム|トラブル|警察|盗撮|暴力|薬|要注意|注意|しつこ|強要|ブラック/;
async function openNgReview(){
  let bg = $("ngRevBg");
  if(!bg){ bg = document.createElement("div"); bg.id = "ngRevBg"; bg.className = "ngrbg"; document.body.appendChild(bg);
    bg.addEventListener("click", e => { if(e.target === bg) bg.remove(); }); }
  bg.innerHTML = `<div class="ngr"><div class="ngrh"><b>🔎 店NGの見比べ</b><button class="btn btn-ghost btn-sm" onclick="$('ngRevBg').remove()">閉じる</button></div><div class="empty">読み込んでいます…</div></div>`;
  try{
    const cs = q(await sb.from("kb_customers").select("id,name,phone,ng,ng_reason,ng_ask,ng_ask_done").eq("ng", true).limit(3000)) || [];
    const ids = cs.map(c => c.id), hist = {}, last = {};
    for(let i = 0; i < ids.length; i += 200){
      const part = ids.slice(i, i + 200);
      const [h, r] = await Promise.all([
        sb.from("kb_cust_history").select("customer_id,biz_date,src_row,memo,status,cast_raw,cast_ng").in("customer_id", part).limit(20000),
        sb.from("kb_reservations").select("customer_id,biz_date").in("customer_id", part).eq("deleted", false).limit(20000)]);
      (h.data || []).forEach(x => { (hist[x.customer_id] = hist[x.customer_id] || []).push(x); if(x.biz_date && (!last[x.customer_id] || x.biz_date > last[x.customer_id])) last[x.customer_id] = x.biz_date; });
      (r.data || []).forEach(x => { if(x.biz_date && (!last[x.customer_id] || x.biz_date > last[x.customer_id])) last[x.customer_id] = x.biz_date; });
    }
    ngRev = cs.map(c => {
      const hs = (hist[c.id] || []).slice().sort((a, b) => String(b.biz_date || "").localeCompare(String(a.biz_date || "")));
      const d = (String(c.ng_reason || "").match(/【台帳\s*(\d{4}-\d{2}-\d{2})/) || [])[1];
      // NGのもとの行：理由に書いてある日付の行 → なければ、NG・出禁などの言葉がある行・トビの行

}

      <button class="btn btn-ghost btn-sm" onclick="$('ngRevBg').remove()">閉じる</button></div>
    <div class="hint" style="margin:0 0 8px">最後に来た日が新しい人（また来そうな人）から順です。<b>📋 A123</b> を押すと行番号をコピー → エクセルで <b>Ctrl+G</b> → 貼って Enter で、その行に飛びます。</div>
    ${list.map(x => { const c = x.c;
      return `<div class="ngrc ${x.done ? "done" : ""}" id="ngr_${c.id}">
        <div class="ngrt"><b>${esc(c.name || "（名前なし）")}</b><small>📞 ${esc(fmtPhone(c.phone))}　最後に来た日 ${x.last ? md(x.last) : "なし"}</small>
          ${c.ng_ask ? `<span class="badge" style="background:#FFF3C4;color:#7a5600">🤔 条件つきの書き方</span>` : ""}
          <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="$('ngRevBg').remove();openCustomer(${c.id})">開く</button></div>
        <div class="ngrr">⚠️ ${esc(c.ng_reason || "理由なし")}</div>
        ${x.src.length ? x.src.map(h => `<div class="ngrs">${h.src_row ? `<button class="ngrcp" onclick="ngRevCopy(${h.src_row})" title="エクセルで Ctrl+G に貼るとこの行に飛ぶ">📋 A${h.src_row}</button>` : `<span class="ngrcp no">行なし</span>`}
            <b>${h.biz_date ? md(h.biz_date) : "日付なし"}</b> ${esc(h.cast_raw || "")}${h.status === "tobi" ? ` <b style="color:#C62828">【トビ】</b>` : h.status === "cancel" ? ` <b style="color:#C62828">【キャンセル】</b>` : ""}${h.cast_ng ? " 🙅" : ""}
            ${h.memo ? `<div class="ngrm">${esc(h.memo)}</div>` : ""}</div>`).join("") : `<div class="ngrs" style="color:#9A97AE">エクセルの行が見つかりません（理由の文だけ）</div>`}
        <div class="ngrb">${x.was ? `<span class="ngrres">${x.c.ng ? "✅ NGで正しい にしました" : "❌ NGではない にしました（店NGを外しました）"}</span><button class="btn btn-ghost btn-sm" onclick="ngRevUndo(${c.id})">↩ 戻す</button>`
          : x.done ? `<span class="ngrres">確認ずみ</span>`
          : ed ? `<button class="btn btn-danger btn-sm" onclick="ngRevSet(${c.id},true)">✅ NGで正しい</button><button class="btn btn-ghost btn-sm" onclick="ngRevSet(${c.id},false)">❌ NGではない</button>` : ""}</div></div>`; }).join("") || `<div class="empty">ぜんぶ確認ずみです 🎉</div>`}</div>`;
}
function ngRevCopy(row){ const t = "A" + row; navigator.clipboard.writeText(t).then(() => toast(`📋 ${t} をコピーしました（エクセルで Ctrl+G → 貼って Enter）`)).catch(() => toast(t)); }
async function ngRevSet(id, isNg){
  const x = ngRev.find(y => y.c.id === id); if(!x) return;
  if(!isNg && !confirm(`「${x.c.name || "名前なし"}」の店NGを外しますか？（あとで「↩ 戻す」もできます）`)) return;
  const was = { ng: x.c.ng, ng_ask: x.c.ng_ask, ng_ask_done: x.c.ng_ask_done };
  const u = isNg ? { ng_ask: false, ng_ask_done: true } : { ng: false, ng_ask: false, ng_ask_done: true };
  try{ q(await sb.from("kb_customers").update(u).eq("id", id)); Object.assign(x.c, u); x.done = true; x.was = was; paintNgReview(); }
  catch(e){ toast("できませんでした：" + (e.message || e)); }
}
async function ngRevUndo(id){
  const x = ngRev.find(y => y.c.id === id); if(!x || !x.was) return;
  try{ q(await sb.from("kb_customers").update(x.was).eq("id", id)); Object.assign(x.c, x.was); x.done = !!x.was.ng_ask_done; x.was = null; paintNgReview(); toast("↩ 戻しました"); }
  catch(e){ toast("できませんでした：" + (e.message || e)); }
}
document.head.insertAdjacentHTML("beforeend", `<style>
  .ngrbg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}

  .ngrp{position:relative;flex:1;min-width:160px;background:#F3F1FF;border-radius:99px;padding:3px 12px;overflow:hidden;font-weight:800} .ngrp i{position:absolute;left:0;top:0;bottom:0;background:#C9EFD6;z-index:0} .ngrp b{position:relative;z-index:1} .ngrp{z-index:0}
  .ngrc{border:2px solid #F1A9AF;border-radius:14px;padding:8px 10px;margin-top:8px} .ngrc.done{border-color:#BFE6CB;background:#F7FCF8}

  .ngrb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px} .ngrres{font-weight:900;color:#2e8b57}

</style>`);
</script>
<script>
/* ---------- 🙅 キャストNGの見比べ（2026/11/13 店長）：店NGの見比べと同じやり方で、キャストNGを1件ずつ
   ・また来そうなお客さん（最後に来た日が新しい人）から順に。確認ずみ（ask_done）は下
   ・もとのエクセルの行（その子の「🙅」の印がついた回・備考にその子の名前がある回）。📋 A123 で行番号をコピー
   ・「✅ NGで正しい」→ 確認ずみの印だけ（ask_done）／「❌ NGではない」→ そのキャストNGを外す（顧客台帳の「外す」と同じ。エクセルの回の🙅の印も外す）
   ・押しまちがいは「↩ 戻す」（外したものを元どおりに入れなおす） ---------- */
let cngRev = null, cngRevHideDone = true;
// 🎯 しぼりこみ（2026/11/14 店長：665件は多すぎる）：期間（お客さんが最後に来た日）・在籍中の子だけ・キャストで
let cngDays = 365, cngWho = "now", cngCast = "";
function cngIsNow(x){ const c = x.n.cast_id && M.casts.find(y => y.id === x.n.cast_id); return !!c && c.status !== "left"; }
function cngIn(x, skipCast){
  if(cngDays && (!x.last || x.last < new Date(Date.now() - cngDays * 86400000 + 9 * 3600000).toISOString().slice(0, 10))) return false;
  if(cngWho === "now" && !cngIsNow(x)) return false;
  if(cngWho === "none" && x.n.cast_id) return false;
  if(!skipCast && cngCast && x.nm !== cngCast) return false;
  return true;
}
async function openCastNgReview(){
  let bg = $("ngRevBg");
  if(!bg){ bg = document.createElement("div"); bg.id = "ngRevBg"; bg.className = "ngrbg"; document.body.appendChild(bg);
    bg.addEventListener("click", e => { if(e.target === bg) bg.remove(); }); }
  bg.innerHTML = `<div class="ngr"><div class="ngrh"><b>🙅 キャストNGの見比べ</b><button class="btn btn-ghost btn-sm" onclick="$('ngRevBg').remove()">閉じる</button></div><div class="empty">読み込んでいます…</div></div>`;
  try{
    const ns = q(await sb.from("kb_cust_cast_ng").select("*").limit(10000)) || [];
    const ids = [...new Set(ns.map(n => n.customer_id))], cust = {}, hist = {}, last = {};
    for(let i = 0; i < ids.length; i += 200){
      const part = ids.slice(i, i + 200);
      const [c, h, r] = await Promise.all([
        sb.from("kb_customers").select("id,name,phone").in("id", part),
        sb.from("kb_cust_history").select("id,customer_id,biz_date,src_row,memo,status,cast_id,cast_raw,cast_ng").in("customer_id", part).limit(20000),
        sb.from("kb_reservations").select("customer_id,biz_date").in("customer_id", part).eq("deleted", false).limit(20000)]);
      (c.data || []).forEach(x => { cust[x.id] = x; });
      (h.data || []).forEach(x => { (hist[x.customer_id] = hist[x.customer_id] || []).push(x); if(x.biz_date && (!last[x.customer_id] || x.biz_date > last[x.customer_id])) last[x.customer_id] = x.biz_date; });
      (r.data || []).forEach(x => { if(x.biz_date && (!last[x.customer_id] || x.biz_date > last[x.customer_id])) last[x.customer_id] = x.biz_date; });
    }
    cngRev = ns.map(n => {
      const nm = n.cast_id ? castLabel(n.cast_id) : n.cast_name, short = String(n.cast_name || nm || "").trim();
      const hs = (hist[n.customer_id] || []).slice().sort((a, b) => String(b.biz_date || "").localeCompare(String(a.biz_date || "")));
      const same = x => (n.cast_id && x.cast_id === n.cast_id) || (short && String(x.cast_raw || "").includes(short));
      let src = hs.filter(x => x.cast_ng && same(x));
      if(!src.length) src = hs.filter(x => short && String(x.memo || "").includes(short) && NGR_WORDS.test(x.memo || ""));
      if(!src.length) src = hs.filter(same);
      return { n, c: cust[n.customer_id] || { id: n.customer_id }, nm: nm || short || "（名前なし）", last: last[n.customer_id] || "", src: src.slice(0, 4), done: !!n.ask_done, was: null };
    }).sort((a, b) => (a.done - b.done) || String(b.last).localeCompare(String(a.last)));
  }catch(e){ bg.querySelector(".ngr").innerHTML = `<div class="warn">読めませんでした：${esc(e.message || e)}</div>`; return; }
  paintCastNgReview();
}
function paintCastNgReview(){
  const bg = $("ngRevBg"); if(!bg || !cngRev) return;
  const pool = cngRev.filter(x => cngIn(x)), done = pool.filter(x => x.done).length, list = pool.filter(x => !cngRevHideDone || !x.done || x.was), ed = KB.CAN_EDIT;
  const byCast = {}; cngRev.filter(x => cngIn(x, true)).forEach(x => { byCast[x.nm] = (byCast[x.nm] || 0) + 1; });
  const castOpts = Object.entries(byCast).sort((a, b) => b[1] - a[1]);
  bg.innerHTML = `<div class="ngr">
    <div class="ngrh"><b>🙅 キャストNGの見比べ</b><button class="btn btn-ghost btn-sm" onclick="openNgReview()">⚠️ 店NGへ</button>
      <span class="ngrp">確認ずみ <b>${done}</b> ／ ${pool.length}件<i style="width:${pool.length ? Math.round(done / pool.length * 100) : 0}%"></i></span>
      <label style="font-size:12.5px;font-weight:700"><input type="checkbox" ${cngRevHideDone ? "checked" : ""} onchange="cngRevHideDone=this.checked;paintCastNgReview()"> 確認ずみを隠す</label>
      <button class="btn btn-ghost btn-sm" onclick="$('ngRevBg').remove()">閉じる</button></div>
    <div class="ngrf">🎯
      <select onchange="cngDays=+this.value;cngCast='';paintCastNgReview()"><option value="365" ${cngDays === 365 ? "selected" : ""}>1年以内に来たお客さん</option><option value="1095" ${cngDays === 1095 ? "selected" : ""}>3年以内に来たお客さん</option><option value="0" ${!cngDays ? "selected" : ""}>ぜんぶ（いつでも）</option></select>
      <select onchange="cngWho=this.value;cngCast='';paintCastNgReview()"><option value="now" ${cngWho === "now" ? "selected" : ""}>在籍中の子のNGだけ</option><option value="all" ${cngWho === "all" ? "selected" : ""}>ぜんぶの子</option><option value="none" ${cngWho === "none" ? "selected" : ""}>キャストにつながらない名前だけ</option></select>
      <select onchange="cngCast=this.value;paintCastNgReview()"><option value="">キャスト：ぜんぶ</option>${castOpts.map(([k, v]) => `<option value="${esc(k)}" ${cngCast === k ? "selected" : ""}>${esc(k)}（${v}）</option>`).join("")}</select>
      <small>全部で ${cngRev.length}件のうち、この条件 ${pool.length}件</small></div>
    <div class="hint" style="margin:0 0 8px">最後に来た日が新しいお客さんから順です。<b>📋 A123</b> を押すと行番号をコピー → エクセルで <b>Ctrl+G</b> → 貼って Enter で、その行に飛びます。</div>
    ${list.map(x => { const n = x.n, c = x.c;
      return `<div class="ngrc ${x.done ? "done" : ""}">
        <div class="ngrt"><b>🙅 ${esc(x.nm)}</b><span>のNG</span>　<b>${esc(c.name || "（名前なし）")}</b><small>📞 ${esc(fmtPhone(c.phone))}　最後に来た日 ${x.last ? md(x.last) : "なし"}</small>
          ${n.ask ? `<span class="badge" style="background:#FFF3C4;color:#7a5600">🤔 だれのNGか・条件があいまい</span>` : ""}
          <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="$('ngRevBg').remove();openCustomer(${c.id})">開く</button></div>
        <div class="ngrr">${esc(n.reason || "理由なし")}${n.source === "excel" ? ` <small style="color:var(--sub)">（エクセルから）</small>` : n.by_name ? ` <small style="color:var(--sub)">（${esc(n.by_name)}が入れた）</small>` : ""}</div>
        ${x.src.length ? x.src.map(h => `<div class="ngrs">${h.src_row ? `<button class="ngrcp" onclick="ngRevCopy(${h.src_row})" title="エクセルで Ctrl+G に貼るとこの行に飛ぶ">📋 A${h.src_row}</button>` : `<span class="ngrcp no">行なし</span>`}
            <b>${h.biz_date ? md(h.biz_date) : "日付なし"}</b> ${esc(h.cast_raw || "")}${h.status === "tobi" ? ` <b style="color:#C62828">【トビ】</b>` : h.status === "cancel" ? ` <b style="color:#C62828">【キャンセル】</b>` : ""}${h.cast_ng ? " 🙅" : ""}
            ${h.memo ? `<div class="ngrm">${esc(h.memo)}</div>` : ""}</div>`).join("") : `<div class="ngrs" style="color:#9A97AE">エクセルの行が見つかりません（理由の文だけ）</div>`}
        <div class="ngrb">${x.was ? `<span class="ngrres">${x.was.kind === "ok" ? "✅ NGで正しい にしました" : "❌ NGではない にしました（キャストNGを外しました）"}</span><button class="btn btn-ghost btn-sm" onclick="cngRevUndo(${n.id})">↩ 戻す</button>`
          : x.done ? `<span class="ngrres">確認ずみ</span>`
          : ed ? `<button class="btn btn-danger btn-sm" onclick="cngRevSet(${n.id},true)">✅ NGで正しい</button><button class="btn btn-ghost btn-sm" onclick="cngRevSet(${n.id},false)">❌ NGではない</button>` : ""}</div></div>`; }).join("") || `<div class="empty">ぜんぶ確認ずみです 🎉</div>`}</div>`;
}
async function cngRevSet(id, isNg){
  const x = cngRev.find(y => y.n.id === id); if(!x) return;
  try{
    if(isNg){
      q(await sb.from("kb_cust_cast_ng").update({ ask: false, ask_done: true }).eq("id", id));
      x.was = { kind: "ok", ask: x.n.ask, ask_done: x.n.ask_done }; x.n.ask = false; x.n.ask_done = true;
    } else {
      if(!confirm(`「${x.c.name || "名前なし"}」の「${x.nm}」NGを外しますか？（あとで「↩ 戻す」もできます）`)) return;
      const marks = x.src.filter(h => h.cast_ng && h.id).map(h => h.id);
      q(await sb.from("kb_cust_cast_ng").delete().eq("id", id));
      for(const hid of marks) await sb.from("kb_cust_history").update({ cast_ng: false }).eq("id", hid);
      x.src.forEach(h => { if(marks.includes(h.id)) h.cast_ng = false; });
      x.was = { kind: "off", row: Object.assign({}, x.n), marks };
    }
    x.done = true; paintCastNgReview();
  }catch(e){ toast("できませんでした：" + (e.message || e)); }
}
async function cngRevUndo(id){
  const x = cngRev.find(y => y.n.id === id); if(!x || !x.was) return;
  try{
    if(x.was.kind === "ok"){ q(await sb.from("kb_cust_cast_ng").update({ ask: x.was.ask, ask_done: x.was.ask_done }).eq("id", id)); x.n.ask = x.was.ask; x.n.ask_done = x.was.ask_done; }
    else {
      const row = Object.assign({}, x.was.row); delete row.id;
      const ins = q(await sb.from("kb_cust_cast_ng").insert(row).select("id").maybeSingle());
      if(ins && ins.id) x.n.id = ins.id;
      for(const hid of x.was.marks) await sb.from("kb_cust_history").update({ cast_ng: true }).eq("id", hid);
      x.src.forEach(h => { if(x.was.marks.includes(h.id)) h.cast_ng = true; });
    }
    x.done = !!x.n.ask_done; x.was = null; paintCastNgReview(); toast("↩ 戻しました");
  }catch(e){ toast("できませんでした：" + (e.message || e)); }
}
</script>
