      <button class="btn btn-ghost btn-sm" onclick="$('day').value=KB.bizDateOf();reload()" id="todayBtn">今日</button>
      <span id="plBar" style="display:none"></span>
    </div>

<script>
/* ============================================================
   📦 回収明細（紙の回収明細のかわり。店長と社長だけ。社長は見る＋サイン＋「受け取った」）
   ・キャストごと：店落ち（暫定的な残額＋雑費）／カード。回収サイン：✔黒＝当日回収／✔赤＝店長が回収／■赤＝未回収のまま社長に渡す（kb_collections・SQL 171）
       交通費・プラスはキャッシュフローから出して袋にそろえる → 袋には「店落ち − カード」が入る。精算ミス・前の日の分も出す。処理✓
       精算済にしていない日（直帰・まだ）は、予約から出した概算（雑費こみ。プラス・マイナスはまだ）
   ・社長に渡す ＝ 店落ち − カード − 経費（回収金からキャッシュフローに補充）− 未回収 − 内勤日払い（回収金から払った分）
   ・当日現金回収 ＝ ✔黒 の合計 − 内勤日払い（紙と同じ）
   ・📮 待機場の封筒：kb_envelope_checks（SQL 170）の前回の回収から、settle_place がその待機場の精算済を数える
   ============================================================ */
const { sb, q, esc, yen, toast } = KB;
const $ = id => document.getElementById(id);
const PLACES = ["池袋", "鶯谷", "五反田"];
const ALL_PLACES = ["池袋", "鶯谷", "五反田", "回収"];
const PLACE_COLOR = { "池袋": "#FFC966", "鶯谷": "#CCCCFF", "五反田": "#C6E0B4", "回収": "#FFC2D1" };
const DOW = ["日","月","火","水","木","金","土"];
const STATE = { day: "✔ 当日回収", later: "✔ 後日内勤回収", me: "✔ 店長回収", none: "■ 未回収" };   // later：あとの日に内勤が受け取った（SQL 225。2026/11/6）
// 日時は営業日で（朝6時まえは前の営業日の 24〜29時。2026/11/11 店長）
const when = t => { const d = new Date(t); if(isNaN(d)) return ""; const b = KB.realBizDateOf(d), p = b.split("-"), j = new Date(d.getTime() + 9 * 3600000), h = j.getUTCHours() + (j.toISOString().slice(0, 10) !== b ? 24 : 0);
  return `${Number(p[1])}/${Number(p[2])} ${String(h).padStart(2, "0")}:${String(j.getUTCMinutes()).padStart(2, "0")}`; };
const md = s => { const p = String(s).split("-"); return `${Number(p[1])}/${Number(p[2])}`; };
const num = n => (Number(n) || 0).toLocaleString("ja-JP");
const sgn = n => (n > 0 ? "＋" : n < 0 ? "−" : "") + num(Math.abs(n));
// その日の回収明細へ（2026/11/14 店長：精算画面ではなく、回収明細のその日に）
const jump = (d, cid) => `<a class="j" href="javascript:void 0" onclick="openDay('${d}')" title="回収明細のその日へ">${md(d)} ↗</a>`;
const backOf = KBM.backOf;   // 💴 計算は kb_money.js の1か所に
// 雑費（精算と同じ）：手で直していればその額。なければ 報酬＋OP 10,500円ごとに500円（3,000円まで）。雑費なしの曜日（キャストのルール）は0
let ZRULES = [];
function zappiOf(id, day, cd, mine){
  if(cd && cd.zappi_override != null) return Number(cd.zappi_override) || 0;
  if(KBM.zappiExempt(KBM.rulesOn(ZRULES, id, day), day)) return 0;   // 💴 計算は kb_money.js の1か所に
  return KBM.zappiAuto(mine.reduce((a, r) => a + backOf(r), 0));
}
const RESV_COLS = "*";   // 振込（SQL 173）の欄もあるので全部
let sortMode = (() => { try{ return localStorage.getItem("kaishuSort") || ""; }catch(e){ return ""; } })();
let names = {}, kanas = {}, kanaSel = "", staffNames = {}, ENV = {}, D = null, MO = null, place = "", mode = "day";

async function init(){
  // 📦 回収明細は、ポータル・記録簿のタブには出さない、店長・社長だけの別のページ（2026/11/4 社長の希望）。上のタブも出さない
  $("navArea").innerHTML = "";

function kaishuSortFn(day, R){

  const h = iso => { if(!iso) return null; const t = new Date(new Date(iso).getTime() + 9 * 3600 * 1000); let x = t.getUTCHours() + t.getUTCMinutes() / 60; if(x < 6) x += 24; return x; };

             end: cd.shift_end_ov != null ? Number(cd.shift_end_ov) : s ? s.end : mine.length ? Math.max(...mine.map(x => h(x.end_at || x.start_at))) : 99 };
  };
  return settleSort === "start" ? (a, b) => sh(a).start - sh(b).start || byKana(a, b) : (a, b) => sh(a).end - sh(b).end || byKana(a, b);
}
// その日のキャストごとの行
function rowsFor(day, R){
  const cds = R.cds.filter(c => c.biz_date === day), resv = R.resv.filter(r => r.biz_date === day && !["cancel", "tobi", "flowed"].includes(r.status));
  // お茶・欠勤で予約のない子は出さない
  const ids = [...new Set(resv.map(r => r.cast_id).filter(Boolean).concat(cds.filter(c => (c.settled || c.direct_home) && !["お茶", "欠勤"].includes(c.status)).map(c => c.cast_id)))];
  return ids.map(id => {
    const cd = cds.find(c => c.cast_id === id) || {}, s = cd.settled ? (cd.settle_snapshot || {}) : null, mine = resv.filter(r => r.cast_id === id);
    const cl = R.col.find(x => x.biz_date === day && x.cast_id === id) || {};
    let shop, card, tr = 0, exact = true;
    if(s && (s.shopDrop != null || s.total != null)){
      shop = s.shopDrop != null ? Number(s.shopDrop) : Number(s.total || 0) - Number(s.reward || 0) - Number(s.option || 0) + Number(s.zappi || 0);
      card = Number(s.cardPaid || 0); tr = Number(s.transferPaid || 0);

      card = mine.reduce((a, r) => a + ((r.payment === "card" || r.payment === "card_paid") ? (Number(r.total) || 0) : (Number(r.card_total) || 0)), 0);   // 現金＋カードはカードの分だけ
      tr = mine.filter(r => r.transfer_status && Number(r.transfer_amount)).reduce((a, r) => a + (Number(r.transfer_amount) || 0), 0);

    // 精算した営業日：後日の精算（paidOn）のほか、その日のページで「次の営業日」に精算したもの（精算した時刻の営業日）も後日（2026/11/11 おりひめ：翌日の昼に回収したのに当日回収になっていた）
    //   エクセルから取りこんだ日（settled_by＝エクセル）は、取りこんだ時刻なので見ない
    const paidOn = (s && s.paidOn) || (cd.settled && cd.settled_at && cd.settled_by !== "エクセル" ? KB.realBizDateOf(new Date(cd.settled_at)) : "");
    const kind = cd.settled ? (paidOn && paidOn > day ? "later" : "done") : cd.direct_home ? "home" : "open";
    // 精算場所が「回収」（内勤がその場でお金を受け取った）なら、チェックしなくても ✔ 当日回収（精算した内勤・時刻を出す）

    const auto = !cl.state && (kind === "done" || kind === "later") && cd.settle_place === "回収";
    return { id, cd, s, cl, day, paidOn, shop, card, tr, amt: shop - card - tr, exact, kind, place: cd.settle_place || "", state: cl.state || (auto ? (kind === "later" ? "later" : "day") : ""), auto, done: !!cl.done, nRes: mine.length, R };
  })
  // 売上0の子（予約なし・店落ちもカードも振込も投函も0：お茶・休みなど）は回収明細に出さない（合計は0円なので変わらない）2026/11/7
  .filter(r => r.nRes || r.shop || r.card || r.tr || Number(r.cd.deposited || 0))
  .sort(kaishuSortFn(day, R));   // 並び順は精算と同じ（あいうえお順／出勤が早い順／退勤が早い順・精算とどちらで選んでも同じ）2026/11/7
}
// 交通費・経費・精算ミス（その子のぶん）
// 🚃 交通費・プラス（キャッシュフローから）。あとの日に「まとめて精算」「未精算だけ精算」した日は、前は記録に交通費が入っていなかった（2026/11/15 かんな 11/2）
//   → 記録にないときは、その日の予約と台帳の交通費バックの条件から計算する（記録は変えない）
function tbOf(r){
  const s = r.s || {};
  if(s.transportBack != null || s.plus != null) return { v: Number(s.transportBack || 0) + Number(s.plus || 0), calc: false };
  if(!r.R || !r.R.resv) return { v: 0, calc: false };
  try{
    const all = r.R.resv.filter(x => x.biz_date === r.day && x.cast_id === r.id);
    const c = KBM.calcCast({ all, cd: Object.assign({}, r.cd, { settled: false }), rules: KBM.rulesOn(ZRULES, r.id, r.day), day: r.day });
    return { v: Number(c.transportBack || 0) + Number(c.plus || 0), calc: true };
  }catch(e){ return { v: 0, calc: false }; }
}
// 項目ごとに { key（処理✓のキー。空＝チェックなし）, html }
function extraList(r){
  const s = r.s || {}, a = [], id = r.id;

  if(s.diff) a.push({ key: "diff", warn: true, html: `<span style="color:#c0392b">⚠️ 精算ミス：投函が${s.diff < 0 ? "足りない " + num(-s.diff) + "（未精算へ）" : "多い " + num(s.diff) + "（お釣りへ）"} ${jump(r.day, id)}</span>` });
  (s.uns || []).forEach(x => a.push({ key: "uns:" + x.date, html: `<span style="color:#5b3fa6">↔ ${md(x.date)} の${x.kind === "day" ? "精算" + (x.amount != null && Number(x.amount) ? " " + num(x.amount) : "") : x.amount >= 0 ? "未精算 " + num(x.amount) : "お釣り " + num(-x.amount)} をいっしょに精算 ${jump(x.date, id)}</span>` }));
  if(r.kind === "later") a.push({ key: "", html: `<span style="color:#5b3fa6">→ ${md(r.paidOn)}${!r.s.paidOn ? " " + when(r.cd.settled_at).split(" ")[1] + " に精算" : r.s.only ? (r.s.at ? " " + when(r.s.at).split(" ")[1] : "") + " に個別精算" : " にまとめて精算"} ${jump(r.s.paidOn || r.day, id)}</span>` });
  // 📒 まだ精算していない未精算・お釣り（この子のぶん・ほかの日も）
  (D && D.unsOpen ? D.unsOpen.filter(u => u.cast_id === id) : []).forEach(u => a.push({ key: "", html: `<span style="color:#c0392b">📒 ${md(u.biz_date)} の${Number(u.amount) >= 0 ? "未精算 " + num(u.amount) : "お釣り " + num(-Number(u.amount))}（まだ） ${jump(u.biz_date, id)}</span>` }));
  if(r.kind === "home") a.push({ key: "", html: `<span style="color:#9C8B8F">🏠 直帰（精算はまだ） ${jump(r.day, id)}</span>` });
  if(r.kind === "open") a.push({ key: "", html: `<span style="color:#c0392b">💴 まだ精算していない ${jump(r.day, id)}</span>` });
  if(!r.exact) a.push({ key: "", html: `<span style="color:#9C8B8F">（金額は予約からの概算・雑費こみ）</span>` });
  return a;
}
// ✓ を保存しているあいだは、押した ✓ をこちらで覚えておく（続けて押したとき、前の ✓ が古い内容で上書きされて消えないように）2026/11/15
const DONE_PEND = {};
let COL_Q = Promise.resolve();   // ✓ の保存は1つずつ順番に
const doneItems = r => DONE_PEND[r.day + "|" + r.id] || (Array.isArray(r.cl.done_items) ? r.cl.done_items : []);
// 処理がまだの項目の数（処理✓がつく項目だけ）
const todoOf = r => extraList(r).filter(x => x.key && !doneItems(r).includes(x.key)).length;
function extraItems(r, ed){

  return extraList(r).map(x => `<label class="xi">${x.key ? `<input type="checkbox" ${done.includes(x.key) ? "checked" : ""} ${ed ? "" : "disabled"} onchange="setDoneItem('${r.id}','${x.key}',this.checked,'${r.day}')" title="処理した"> ` : ""}${x.html}${x.key && done.includes(x.key) ? ` <small style="color:#2e8b57">✓処理ずみ</small>` : ""}</label>`).join("");

// 1日の合計
function totalsFor(day, R, rows){
  const all = rowsFor(day, R), ho = R.ho.find(h => h.biz_date === day) || null;
  rows = rows || all;
  const sum = (l, f) => l.reduce((a, r) => a + f(r), 0);
  // kb_handovers.expenses：経費（キャッシュフローへの補充）と、type:"transfer" の振込（キャンセル料など。カードと同じ扱い）
  const items = ho && Array.isArray(ho.expenses) ? ho.expenses : [];
  const ex = sum(items.filter(x => !x.type || x.type === "ex"), x => Number(x.amount) || 0);   // type:"advance"（キキララの立て替え）は経費ではない
  // 🪙 キキララが足りなくて、売上金（回収金）から立て替えた分（type:"advance"）。キキララから精算（返してもらう）まで、回収金から出ている
  const adv = items.map((x, i) => Object.assign({ i }, x)).filter(x => x.type === "advance"), advOpen = sum(adv.filter(x => !x.settled), x => Number(x.amount) || 0);
  // 🏦 振込：予約枠の振込（SQL 173。キャンセルの予約は売上に入っていないので、粗利に足してから引く）＋ 回収明細で手で入れた振込
  const trRes = R.resv.filter(r => r.biz_date === day && r.transfer_status && Number(r.transfer_amount));
  const trCancel = sum(trRes.filter(r => ["cancel", "tobi", "flowed"].includes(r.status)), r => Number(r.transfer_amount));
  const tr = sum(items.filter(x => x.type === "transfer"), x => Number(x.amount) || 0) + trCancel;
  const staff = R.staff.filter(x => x.biz_date === day), staffSum = sum(staff, x => Number(x.day_paid) || 0);
  const T = {
    n: rows.length, shop: sum(rows, r => r.shop), card: sum(rows, r => r.card),
    dayN: rows.filter(r => r.state === "day").length, laterN: rows.filter(r => r.state === "later").length, meN: rows.filter(r => r.state === "me").length,
    noneN: rows.filter(r => r.state === "none").length, yetN: rows.filter(r => !r.state).length,
    daySum: sum(rows.filter(r => r.state === "day"), r => r.amt),
    notCol: sum(rows.filter(r => r.state === "none" || !r.state), r => r.amt),
    todo: rows.reduce((a, r) => a + todoOf(r), 0),
  };
  // 経費・内勤日払い・手渡しは、その日の全部（場所で絞っても）
  const A = { shop: sum(all, r => r.shop), card: sum(all, r => r.card), tr: sum(all, r => r.tr), notCol: sum(all.filter(r => r.state === "none" || !r.state), r => r.amt), yetN: all.filter(r => !r.state).length };
  // 紙の回収明細と同じ：B（キャストの A の合計）＋振込 − C（内勤日払い）＝ F（店落ち粗利）。F − D（カード）− 振込 − E（経費）＝ 最終的に社長に渡す額
  const B = A.shop + tr, F = B - staffSum, fin = F - A.card - A.tr - tr - ex;
  // 🪙 キキララから払った日払いは、その日の回収金からは出ていない（回収金に残っている）→ 足す。
  //    キキララへ返した日に、はじめてその日の回収金から引く
  const kikiPaid = (R.kikiPaid || []).filter(x => x.biz_date === day), kikiPaidSum = sum(kikiPaid, kikiAmt);
  const kikiRet = (R.kikiRet || []).filter(x => x.kiki_returned_on === day), kikiRetSum = sum(kikiRet, kikiAmt);
  const unpaid = staff.filter(x => !x.paid), unpaidSum = sum(unpaid, x => Number(x.day_paid) || 0);   // まだ払っていない日払いは、回収金に残っている
  const rfOut = rfOutOf(R, day), rfRet = rfRetOf(R, day), rfOutSum = sum(rfOut, rfAmt), rfRetSum = sum(rfRet, rfAmt);   // 💴 キキララから立て替えた返金：その日は回収金に残っている（＋）／返金完了の日に回収金から（−）
  const hand = fin - A.notCol + kikiPaidSum - kikiRetSum + unpaidSum - advOpen + rfOutSum - rfRetSum;   // 随時の回収合計（未回収 ■ を引いた、今渡す額・実際のお金）
  return { T, A, ho, ex, tr, trRes, trCancel, staff, staffSum, B, F, fin, hand, all, kikiPaid, kikiPaidSum, kikiRet, kikiRetSum, unpaid, unpaidSum, adv, advOpen, rfOut, rfRet, rfOutSum, rfRetSum };
}

    const dt = new Date(d + "T12:00:00Z");
    return `<tr class="${T.yetN || T.todo ? "bad" : ""}"><td class="l"><a class="j" style="font-size:13.5px;margin:0" href="javascript:void 0" onclick="openDay('${d}')">${md(d)}(${DOW[dt.getUTCDay()]})</a></td>
      <td>${num(F)}</td><td>${A.card ? "−" + num(A.card) : ""}</td><td>${tr ? "−" + num(tr) : ""}</td><td>${ex ? "−" + num(ex) : ""}</td><td><b>${num(fin)}</b></td>
      <td class="l"><span class="mk day">✔${T.dayN}</span> <span class="mk later">✔${T.laterN}</span> <span class="mk me">✔${T.meN}</span> <span class="mk none">■${T.noneN}</span>${T.yetN ? ` <span class="st wait">まだ ${T.yetN}</span>` : ""}${T.todo ? ` <span class="st wait">処理 ${T.todo}</span>` : ""}</td>
      <td>${A.notCol ? "−" + num(A.notCol) : ""}</td><td><b style="color:#E0001B">${num(hand)}</b></td>
      <td class="l">${rcv ? `<span class="st ok">🤝 ${num(got)} ${when(ho.received_at)}</span>` : `<span class="st no">まだ</span>`}</td></tr>`;
  });
  let html = MO.no171 ? `<div class="warn" style="margin-bottom:10px">⚠️ 回収のチェックを入れるには、SQL 171 の実行が必要です。</div>` : "";
  html += `<div class="sum">
    <div class="s">店落ち粗利（F）<b>${yen(S.F)}</b></div>
    <div class="s">カード（D）<b>${yen(S.card)}</b></div>
    ${S.tr ? `<div class="s">振込<b>${yen(S.tr)}</b></div>` : ""}
    <div class="s">経費（E）<b>${yen(S.ex)}</b></div>
    <div class="s">全部回収したら社長に渡す額<b>${yen(S.fin)}</b></div>
    <div class="s">社長が受け取った<b>${yen(S.rcv)}</b></div>
    <div class="s ${S.fin - S.rcv ? "ng" : S.fin ? "ok" : ""}">まだ渡していない<b>${yen(S.fin - S.rcv)}</b></div>
    <div class="s ${S.yet ? "ng" : ""}">回収サインまだ<b>${S.yet}人</b></div></div>`;
  html += `<div class="card"><h2>📅 ${esc($("ymLabel").textContent)}の回収${place ? "（" + esc(place) + "）" : ""}</h2>`
    + (days.length ? `<div class="tbl"><table>
      <tr><th class="l">営業日</th><th>店落ち粗利（F）</th><th>カード（D）</th><th>振込</th><th>経費（E）</th><th>全部回収したら</th><th class="l">回収サイン</th><th>未回収</th><th>随時の回収合計</th><th class="l">社長が受け取った</th></tr>
      ${lines.join("")}
      <tr class="tot"><td class="l">合計</td><td>${num(S.F)}</td><td>${S.card ? "−" + num(S.card) : ""}</td><td>${S.tr ? "−" + num(S.tr) : ""}</td><td>${S.ex ? "−" + num(S.ex) : ""}</td><td>${num(S.fin)}</td><td class="l">${S.yet ? `まだ ${S.yet}人` : ""}</td><td>${S.notCol ? "−" + num(S.notCol) : ""}</td><td>${num(S.hand)}</td><td class="l">${num(S.rcv)}（${S.rdays}日分）</td></tr>
    </table></div>
    <div class="leg">・日付を押すと、その日の「1日ごと」が開きます　・場所で絞っても、店落ち粗利から右はその日の全部です<br>
      ・店落ち粗利（F）＝ キャスト全員の店落ち（暫定的な残額＋雑費）＋ 振込 − 内勤日払い　・全部回収したら ＝ F − D − 振込 − E</div>` : `<div class="lead">この月の予約はありません。</div>`) + `</div>`
    + staffMonthHtml();
  $("dayArea").innerHTML = html;
}

/* ---------- 📮 待機場の封筒 ---------- */
async function load(){
  try{
    const chk = CHK = q(await sb.from("kb_envelope_checks").select("*").order("checked_at", { ascending: false }).limit(100)) || [];
    for(const p of PLACES){
      const hist = chk.filter(x => x.place === p), last = hist[0] || null;
      let qq = sb.from("kb_cast_days").select("biz_date,cast_id,settled_at").eq("settled", true).eq("settle_place", p).order("settled_at");
      if(last) qq = qq.gt("settled_at", last.checked_at);   // 回収の記録がまだなければ、これまでの全部を数える
      ENV[p] = { last, hist: hist.slice(0, 5), since: q(await qq) || [] };
    }
  }catch(e){ toast("封筒の記録が読めませんでした：" + (e.message || e)); return; }
  paint();
}
function paint(){ if(mode === "day") paintDay(); }   // 📮 封筒は ② 池袋・鶯谷・五反田 の中に出す
// 回収した封筒の数を打ったら、あるはずの数と合っているか、その場で出す
function envCheck(p){
  const v = $("env-" + p).value, el = $("envres-" + p); if(!el) return;
  if(v === ""){ el.innerHTML = ""; return; }
  const found = Math.max(0, Number(v) || 0), exp = ENV[p].since.length;
  el.innerHTML = found === exp ? `<span class="ok">✅ 合っています（${exp}通）</span>` : `<span class="ng">⚠️ 合いません：回収 ${found}通／あるはず ${exp}通（${found > exp ? "多い " + (found - exp) : "足りない " + (exp - found)}）</span>`;
}
async function save(p){
  const v = $("env-" + p).value; if(v === ""){ toast("回収した封筒の数を入れてください"); return; }
  const found = Math.max(0, Number(v) || 0), expected = ENV[p].since.length;
  if(!confirm(`${p} の封筒を回収しましたか？\n回収した封筒 ${found}通／あるはず ${expected}通 → ${found === expected ? "✅ 一致" : "⚠️ 合いません"}\n（ここからまた 0 から数えます）`)) return;
  try{ q(await sb.from("kb_envelope_checks").insert({ place: p, found, expected, checked_by: KB.operatorName() })); }
  catch(e){ toast("保存できませんでした：" + (e.message || e)); return; }
  toast(found === expected ? `✅ ${p}：記録しました` : `⚠️ ${p}：${found}通／記録 ${expected}件。精算をたしかめてください`);
  load();
}
