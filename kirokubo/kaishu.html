<style>

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;} @media(max-width:900px){.grid{grid-template-columns:1fr;}}

  .ex input,.ex select{font-family:inherit;font-size:13px;padding:3px 6px;border:1.5px solid #ddd;border-radius:6px;max-width:100%;}
  .envhist{font-size:12.5px;color:#555;margin-top:4px;line-height:1.7} .envhist .ng{color:#c0392b}
  .coltbl tr.sgrp td{background:#FFE4EC;font-weight:900;color:#c2185b;padding:5px 8px;border-top:2px solid #e5638c;border-left:8px solid var(--pc,#e5638c)}
  .kanabar{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px} .kanabar .kb{font-family:inherit;font-size:15px;font-weight:800;min-width:36px;padding:5px 8px;border:1.5px solid #FFC2D1;border-radius:9px;background:#fff;color:#e5638c;cursor:pointer} .kanabar .kb:hover{background:#FFE4EC} .kanabar .kb.off{opacity:.35} .kanabar .kb.on{background:#e5638c;color:#fff;border-color:#e5638c}
  .rowlinks{font-size:12px;font-weight:700;margin-top:3px;white-space:nowrap}
  .envres{margin-top:6px;font-weight:900;font-size:14px} .envres .ok{color:#2e8b57} .envres .ng{color:#c0392b}
  .hand{background:#FFF8D6;border:3px solid #F2C94C;border-radius:14px;padding:10px 16px;margin-top:10px;}   /* 社長に手渡し＝随時の回収合計（同じ枠の色） */
  .sum .s.handbox{background:#FFF8D6;border:3px solid #F2C94C;}
  .flow .handrow{background:#FFF8D6;border:3px solid #F2C94C;border-radius:10px;padding:6px 10px;margin-top:4px;display:flex;justify-content:space-between;align-items:center;font-weight:900;grid-column:1 / -1;}
  .hand .k{font-weight:800;color:#6b4e00;} .hand .v{text-align:right;font-weight:900;font-size:32px;color:#E0001B;}
  .chk{border:2.5px solid #2e8b57;background:#F0FBF4;border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .chk input{width:22px;height:22px;accent-color:#2e8b57;} .chk small{font-weight:700;color:var(--sub);}
  .leg{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7;}
  .egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
  .ec{background:#fff;border:2.5px solid;border-radius:16px;overflow:hidden;}
  .ec .et{font-weight:900;font-size:17px;padding:8px 14px;display:flex;align-items:center;gap:8px;}
  .ec .body{padding:10px 14px;}
  .ec .now{font-size:13px;color:var(--sub);font-weight:700;}
  .ec .num{font-size:40px;font-weight:900;text-align:right;line-height:1.1;margin:2px 0 4px;} .ec .num small{font-size:16px;margin-left:4px;}
  .ec .who{font-size:12px;color:var(--sub);line-height:1.7;max-height:120px;overflow-y:auto;border-top:1px dashed var(--line);padding-top:6px;}
  .ec .f{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font-weight:800;font-size:13.5px;}

  .ym{font-weight:900;font-size:15px;padding:0 6px;}

  .cs{display:inline-flex;gap:4px;} .cs button{font-family:inherit;font-weight:900;font-size:12.5px;border:1.5px solid #ddd;background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;color:#999;}

  .cs button:disabled{cursor:default;}
  input.cnt{width:96px;text-align:right;font-family:inherit;font-size:15px;font-weight:800;padding:5px 6px;border:1.5px solid var(--line);border-radius:10px}
  input.cnt.auto{color:#5b6b8a;font-style:italic} input.cnt::-webkit-outer-spin-button,input.cnt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0} input.cnt{-moz-appearance:textfield;appearance:textfield}
  /* 回収の表：項目ごとに縦の線・横にスクロールしないで1画面に */
  table.coltbl th, table.coltbl td{border-left:1px solid #E6D6DC;border-right:1px solid #E6D6DC;padding:6px 7px}
  table.coltbl td.l{white-space:normal} table.coltbl td.wrapc{min-width:180px;word-break:break-all} table.coltbl th{white-space:normal}
  td.cntc .dif{font-size:12px;font-weight:800;color:var(--sub);margin-top:2px} td.cntc.ok{background:#E5F6EC} td.cntc.ok .dif{color:#2e8b57} td.cntc.ok input.cnt{border-color:#2e8b57;color:#2e8b57;background:#fff}
  td.cntc.ng{background:#FFF1F1} td.cntc.ng .dif{color:#c0392b} td.cntc .hyaku{font-size:20px;margin-left:4px;vertical-align:middle}
  tr.perfect td:first-child b{color:#2e8b57}
  .mk{font-weight:900;font-size:16px;} .mk.day{color:#222;} .mk.later{color:#1f6fd1;} .mk.me,.mk.none{color:#E0001B;}
  .paperfoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 14px;margin:10px 0;padding:10px 12px;border:2px solid #E9C9D3;border-radius:12px;background:#FFF8FA}
  .paperfoot>div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}.paperfoot>div.ng b{color:#E0001B}.paperfoot .pf-staff{grid-column:1/-1;justify-content:flex-start}
  .who3{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:4px;line-height:1.5}
  .xi{display:block;font-size:12px;font-weight:700;line-height:1.6;}
  .hl{margin-top:4px;font-size:11.5px;} .hl summary{cursor:pointer;color:#8a6d00;font-weight:800;} .hli{background:#FFFCEB;border:1px solid #F2D27A;border-radius:8px;padding:4px 7px;margin-top:4px;white-space:normal;min-width:220px;line-height:1.5;} .hli .ht{white-space:pre-wrap;color:var(--ink);} .hli .hb{color:var(--sub);text-align:right;}
  .who2{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:3px;}
  td.amt b{font-size:15px;} td.amt small{color:var(--sub);font-weight:700;}
  .sec{font-size:16px;margin:16px 0 6px;color:#7a4a5a;border-bottom:2px solid #F1E3E7;padding-bottom:3px;}
  .gh{border:2px solid;border-radius:12px 12px 0 0;margin-top:10px;overflow:hidden;} .ght{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 12px;font-size:15px;} .ghs{font-size:13px;font-weight:700;color:#5C4B4F;}
  .payline,.envline{padding:6px 12px;font-size:13.5px;background:#fff;border-top:1px dashed #E8D8DC;} .envres{margin-left:6px;font-weight:800;}
  .tk{font-size:13px;font-weight:700;margin-left:6px;white-space:nowrap;}

<body>
<div class="wrap">
  <header class="kbh"><h1>📦 回収明細<span class="lock">🔒 きゃ・社長だけ</span></h1><div id="navArea" class="navinhead"></div></header>
  <div id="gate" class="gate">読み込み中…</div>
  <div id="main" style="display:none">
    <div id="wip"></div>
    <div class="bar">
      <span class="seg"><button id="mDay" class="on" onclick="setMode('day')">1日ごと</button><button id="mMonth" onclick="setMode('month')">1か月ごと</button></span>
      <button class="btn btn-ghost btn-sm" onclick="shift(-1)">◀</button><label class="datebox" id="dayBox" onclick="event.preventDefault();openCuteCal()" title="押すとカレンダー"><span id="dayLabel"></span><span class="calico">📅</span><input type="date" id="day" onchange="reload()"></label><span id="ymLabel" class="ym" style="display:none"></span><button class="btn btn-ghost btn-sm" onclick="shift(1)">▶</button>
      <button class="btn btn-ghost btn-sm" onclick="$('day').value=KB.bizDateOf();reload()" id="todayBtn">今日</button>
      <span style="width:12px"></span><span id="plBar"></span>
    </div>
    <div id="dayArea"></div>

  </div>
</div>
<script>
/* ============================================================
   📦 回収明細（紙の回収明細のかわり。店長と社長だけ。社長は見る＋サイン＋「受け取った」）
   ・キャストごと：店落ち（暫定的な残額＋雑費）／カード。回収サイン：✔黒＝当日回収／✔赤＝店長が回収／■赤＝未回収のまま社長に渡す（kb_collections・SQL 171）
       交通費・プラスはキャッシュフローから出して袋にそろえる → 袋には「店落ち − カード」が入る。精算ミス・前の日の分も出す。処理✓
       精算済にしていない日（直帰・まだ）は、予約から出した概算（雑費こみ。プラス・マイナスはまだ）
   ・社長に渡す ＝ 店落ち − カード − 経費（回収金からキャッシュフローに補充）− 未回収 − 内勤日払い（回収金から払った分）
   ・当日現金回収 ＝ ✔黒 の合計 − 内勤日払い（紙と同じ）
   ・📮 待機場の封筒：kb_envelope_checks（SQL 170）の前回の回収から、settle_place がその待機場の精算済を数える
   ============================================================ */
const { sb, q, esc, yen, toast } = KB;
const $ = id => document.getElementById(id);
const PLACES = ["池袋", "鶯谷", "五反田"];
const ALL_PLACES = ["池袋", "鶯谷", "五反田", "回収"];
const PLACE_COLOR = { "池袋": "#FFC966", "鶯谷": "#CCCCFF", "五反田": "#C6E0B4", "回収": "#FFC2D1" };
const DOW = ["日","月","火","水","木","金","土"];
const STATE = { day: "✔ 当日回収", later: "✔ 後日内勤回収", me: "✔ 店長回収", none: "■ 未回収" };   // later：あとの日に内勤が受け取った（SQL 225。2026/11/6）
const when = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const md = s => { const p = String(s).split("-"); return `${Number(p[1])}/${Number(p[2])}`; };
const num = n => (Number(n) || 0).toLocaleString("ja-JP");
const sgn = n => (n > 0 ? "＋" : n < 0 ? "−" : "") + num(Math.abs(n));
const jump = (d, cid) => `<a class="j" href="settle.html?d=${d}${cid ? "&c=" + encodeURIComponent(cid) : ""}" target="_blank" rel="noopener" title="その日のそのキャストの精算へ">${md(d)} ↗</a>`;
const backOf = r => r.back_override != null ? Number(r.back_override) : (Number(r.course_back) || 0) + (Number(r.option_back) || 0) + (Number(r.extra_back) || 0);
// 雑費（精算と同じ）：手で直していればその額。なければ 報酬＋OP 10,500円ごとに500円（3,000円まで）。雑費なしの曜日（キャストのルール）は0
let ZRULES = [];
function zappiOf(id, day, cd, mine){
  if(cd && cd.zappi_override != null) return Number(cd.zappi_override) || 0;
  const dow = new Date(day + "T12:00:00Z").getUTCDay();
  if(ZRULES.some(x => x.cast_id === id && (x.valid_from || "2000-01-01") <= day && (!x.valid_to || x.valid_to > day) && ((x.params || {}).days || []).includes(dow))) return 0;
  return Math.min(3000, Math.floor(mine.reduce((a, r) => a + backOf(r), 0) / 10500) * 500);
}
const RESV_COLS = "*";   // 振込（SQL 173）の欄もあるので全部
let sortMode = (() => { try{ return localStorage.getItem("kaishuSort") || ""; }catch(e){ return ""; } })();
let names = {}, kanas = {}, kanaSel = "", staffNames = {}, ENV = {}, D = null, MO = null, place = "", mode = "day";

async function init(){
  // 📦 回収明細は、ポータル・記録簿のタブには出さない、店長・社長だけの別のページ（2026/11/4 社長の希望）。上のタブも出さない
  $("navArea").innerHTML = "";
  if(!(await KB.staffSession({ owner: true }))){ $("gate").innerHTML = `店長・社長だけのページです。<br><a class="btn btn-primary" style="display:inline-block;margin-top:12px" href="../index.html?next=kaishu">🔑 Googleでログインする</a><br><small>ログインすると、この回収明細にもどります</small>`; return; }
  if(!(await KB.passGate("回収明細"))) return;   // 🔒 端末の登録の合言葉
  $("wip").innerHTML = KB.wipBanner();
  $("gate").style.display = "none"; $("main").style.display = "";
  try{ (q(await sb.from("master_casts").select("*")) || []).forEach(c => { names[c.id] = c.official_name || c.temp_name || c.id; kanas[c.id] = c.kana || names[c.id]; }); }catch(e){}
  try{ ZRULES = q(await sb.from("kb_cast_rules").select("*").eq("active", true).eq("kind", "zappi_exempt")) || []; }catch(e){}
  try{ (q(await sb.from("kb_staff_rates").select("staff_id,record_name")) || []).forEach(r => { if(r.record_name) staffNames[r.staff_id] = r.record_name; }); }catch(e){}
  $("day").value = KB.startDay();   // 記録簿・精算で見ていた日
  paintPlaces(); loadDay(); load();
}
function setMode(m){
  mode = m; $("mDay").classList.toggle("on", m === "day"); $("mMonth").classList.toggle("on", m === "month");
  $("dayBox").style.display = m === "day" ? "" : "none"; $("ymLabel").style.display = m === "month" ? "" : "none";
  $("todayBtn").textContent = m === "day" ? "今日" : "今月";
  reload();
}
function reload(){ if(mode === "day") loadDay(); else loadMonth(); }
function shift(n){
  const d = new Date($("day").value + "T12:00:00Z");
  if(mode === "day") d.setUTCDate(d.getUTCDate() + n); else { d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); }
  $("day").value = d.toISOString().slice(0, 10); reload();
}
function paintPlaces(){
  $("plBar").innerHTML = [["", "ぜんぶ"]].concat(ALL_PLACES.map(p => [p, p])).map(([v, l]) => `<button class="chip ${place === v ? "on" : ""}" onclick="place='${v}';paintPlaces();mode === 'day' ? paintDay() : paintMonth()">${l}</button>`).join(" ");
}
function openDay(d){ $("day").value = d; setMode("day"); scrollTo(0, 0); }

// 1日分の材料（cds・予約・回収チェック・経費など）を読む
async function readRange(from, to){
  const R = { cds: [], resv: [], col: [], ho: [], staff: [], no171: false };
  const [a, b, c] = await Promise.all([
    sb.from("kb_cast_days").select("*").gte("biz_date", from).lt("biz_date", to),
    sb.from("kb_reservations").select(RESV_COLS).gte("biz_date", from).lt("biz_date", to).eq("deleted", false),
    sb.from("kb_staff_work").select("*").gte("biz_date", from).lt("biz_date", to),
  ]);
  // 内勤日払い：想定店落ち（F）からは、どこから払ったか（回収金・キキララ）に関係なく全部引く（記録簿の「今日の店落ち」と同じ）
  R.cds = q(a) || []; R.resv = q(b) || []; R.staff = (c.error ? [] : (c.data || [])).filter(x => Number(x.day_paid));   // まだ払っていない日払いも（店落ちからは引く・回収金には残っている）
  // 🪙 キキララ：その期間に「キキララから払った」日払いと、その期間に「キキララへ返した」日払い（SQL 185）
  R.kikiPaid = R.staff.filter(x => x.paid && kikiAmt(x) > 0);
  R.kikiRet = []; R.no185 = false;
  try{
    const kr = await sb.from("kb_staff_work").select("*").eq("paid", true).in("pay_source", ["kikirara", "split"]).gte("kiki_returned_on", from).lt("kiki_returned_on", to);
    if(kr.error) R.no185 = true; else R.kikiRet = kr.data || [];
  }catch(e){ R.no185 = true; }
  try{
    R.col = q(await sb.from("kb_collections").select("*").gte("biz_date", from).lt("biz_date", to)) || [];
    R.ho = q(await sb.from("kb_handovers").select("*").gte("biz_date", from).lt("biz_date", to)) || [];
  }catch(e){ R.no171 = true; }
  return R;
}
// 🪙 日払いのうち、キキララ（両替金）から取った額（SQL 224）。全部キキララ＝日払い全額／分けた（split）＝キキララの分だけ／回収金＝0
//   店落ち（F）からは、どこから払ったかに関係なく日払いの全額を引く（ここは変えない）。キキララの分だけ「回収金に残っている」になる
function kikiAmt(x){
  if(!x) return 0;
  if(x.pay_source === "kikirara") return Number(x.day_paid) || 0;
  if(x.pay_source === "split") return Math.max(0, Math.min(Number(x.day_paid) || 0, Number(x.paid_kiki) || 0));
  return 0;
}
const nextDay = d => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + 1); return x.toISOString().slice(0, 10); };

// その日のキャストごとの行
function rowsFor(day, R){
  const cds = R.cds.filter(c => c.biz_date === day), resv = R.resv.filter(r => r.biz_date === day && !["cancel", "tobi", "flowed"].includes(r.status));
  // お茶・欠勤で予約のない子は出さない

function totalsFor(day, R, rows){
  const all = rowsFor(day, R), ho = R.ho.find(h => h.biz_date === day) || null;
  rows = rows || all;
  const sum = (l, f) => l.reduce((a, r) => a + f(r), 0);
  // kb_handovers.expenses：経費（キャッシュフローへの補充）と、type:"transfer" の振込（キャンセル料など。カードと同じ扱い）
  const items = ho && Array.isArray(ho.expenses) ? ho.expenses : [];
  const ex = sum(items.filter(x => !x.type || x.type === "ex"), x => Number(x.amount) || 0);   // type:"advance"（キキララの立て替え）は経費ではない
  // 🪙 キキララが足りなくて、売上金（回収金）から立て替えた分（type:"advance"）。キキララから精算（返してもらう）まで、回収金から出ている
  const adv = items.map((x, i) => Object.assign({ i }, x)).filter(x => x.type === "advance"), advOpen = sum(adv.filter(x => !x.settled), x => Number(x.amount) || 0);
  // 🏦 振込：予約枠の振込（SQL 173。キャンセルの予約は売上に入っていないので、粗利に足してから引く）＋ 回収明細で手で入れた振込
  const trRes = R.resv.filter(r => r.biz_date === day && r.transfer_status && Number(r.transfer_amount));
  const trCancel = sum(trRes.filter(r => ["cancel", "tobi", "flowed"].includes(r.status)), r => Number(r.transfer_amount));
  const tr = sum(items.filter(x => x.type === "transfer"), x => Number(x.amount) || 0) + trCancel;
  const staff = R.staff.filter(x => x.biz_date === day), staffSum = sum(staff, x => Number(x.day_paid) || 0);
  const T = {
    n: rows.length, shop: sum(rows, r => r.shop), card: sum(rows, r => r.card),
    dayN: rows.filter(r => r.state === "day").length, laterN: rows.filter(r => r.state === "later").length, meN: rows.filter(r => r.state === "me").length,
    noneN: rows.filter(r => r.state === "none").length, yetN: rows.filter(r => !r.state).length,
    daySum: sum(rows.filter(r => r.state === "day"), r => r.amt),
    notCol: sum(rows.filter(r => r.state === "none" || !r.state), r => r.amt),
    todo: rows.reduce((a, r) => a + todoOf(r), 0),
  };
  // 経費・内勤日払い・手渡しは、その日の全部（場所で絞っても）
  const A = { shop: sum(all, r => r.shop), card: sum(all, r => r.card), tr: sum(all, r => r.tr), notCol: sum(all.filter(r => r.state === "none" || !r.state), r => r.amt), yetN: all.filter(r => !r.state).length };
  // 紙の回収明細と同じ：B（キャストの A の合計）＋振込 − C（内勤日払い）＝ F（店落ち粗利）。F − D（カード）− 振込 − E（経費）＝ 最終的に社長に渡す額
  const B = A.shop + tr, F = B - staffSum, fin = F - A.card - A.tr - tr - ex;
  // 🪙 キキララから払った日払いは、その日の回収金からは出ていない（回収金に残っている）→ 足す。
  //    キキララへ返した日に、はじめてその日の回収金から引く
  const kikiPaid = (R.kikiPaid || []).filter(x => x.biz_date === day), kikiPaidSum = sum(kikiPaid, kikiAmt);
  const kikiRet = (R.kikiRet || []).filter(x => x.kiki_returned_on === day), kikiRetSum = sum(kikiRet, kikiAmt);

  const hand = fin - A.notCol + kikiPaidSum - kikiRetSum + unpaidSum - advOpen;   // 随時の回収合計（未回収 ■ を引いた、今渡す額・実際のお金）
  return { T, A, ho, ex, tr, trRes, trCancel, staff, staffSum, B, F, fin, hand, all, kikiPaid, kikiPaidSum, kikiRet, kikiRetSum, unpaid, unpaidSum, adv, advOpen };
}

const KANA_ROWS = [["あ", "あいうえおぁぃぅぇぉ"], ["か", "かきくけこがぎぐげご"], ["さ", "さしすせそざじずぜぞ"], ["た", "たちつてとだぢづでどっ"], ["な", "なにぬねの"],
  ["は", "はひふへほばびぶべぼぱぴぷぺぽ"], ["ま", "まみむめも"], ["や", "やゆよゃゅょ"], ["ら", "らりるれろ"], ["わ", "わをんゐゑ"]];
function kanaHeadK(id){
  let s = String(kanas[id] || names[id] || "").trim().charAt(0);
  const code = s.charCodeAt(0); if(code >= 0x30A1 && code <= 0x30F6) s = String.fromCharCode(code - 0x60);   // カタカナ→ひらがな
  const row = KANA_ROWS.find(r => r[1].includes(s));
  return row ? row[0] : "他";
}
function kanaBarK(rows){
  const have = new Set(rows.map(r => kanaHeadK(r.id)));
  return `<div class="kanabar"><button type="button" class="kb ${kanaSel ? "" : "on"}" onclick="pickKana('')">全員</button>`
    + KANA_ROWS.map(([k]) => `<button type="button" class="kb ${kanaSel === k ? "on" : ""} ${have.has(k) ? "" : "off"}" onclick="pickKana('${k}')">${k}</button>`).join("") + `</div>`;
}

// 🖼 その日のその子の精算の写真（精算画面で入れたもの。SQL 196：settle-photos／<営業日>/<キャストid>/…）
async function phView(day, cid){
  const bg = document.createElement("div");
  bg.style.cssText = "position:fixed;inset:0;z-index:1200;background:rgba(40,20,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto";
  bg.innerHTML = `<div style="width:100%;max-width:900px;background:#fff;border-radius:18px;padding:16px 18px">
    <div style="display:flex;align-items:center;gap:8px"><b style="font-size:17px;color:#e5638c">🖼 ${esc(names[cid] || cid)}（${md(day)}）の写真</b><span style="flex:1"></span>
      <a class="j" href="settle.html?d=${day}&c=${encodeURIComponent(cid)}" target="_blank" rel="noopener">↗ 精算</a>
      <button type="button" class="btn btn-ghost btn-sm" id="phClose">とじる</button></div>
    <div id="phList" style="margin-top:10px;color:#9C8B8F">読みこみ中…</div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector("#phClose").onclick = close;
  bg.addEventListener("click", e => { if(e.target === bg) close(); });
  const dir = day + "/" + cid, box = bg.querySelector("#phList");
  try{
    const r = await sb.storage.from("settle-photos").list(dir, { limit: 100, sortBy: { column: "name", order: "asc" } });
    if(r.error) throw r.error;
    const files = (r.data || []).filter(f => f.name && !f.name.startsWith("."));
    if(!files.length){ box.textContent = "この日の写真はありません（精算画面の「📷 お金・領収書の写真」で入れます）"; return; }
    const s = await sb.storage.from("settle-photos").createSignedUrls(files.map(f => dir + "/" + f.name), 3600);
    if(s.error) throw s.error;
    const at = n => { const t = Number(String(n).split("_")[0]); return t ? when(new Date(t).toISOString()) : ""; };
    box.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">${files.map((f, i) => { const u = (s.data[i] || {}).signedUrl; return u ? `<a href="${u}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:#9C8B8F;font-size:12px"><img src="${u}" alt="写真" style="width:100%;border-radius:12px;border:1.5px solid #F1E3E7;display:block">${esc(at(f.name))}</a>` : ""; }).join("")}</div>`;
  }catch(e){ box.textContent = "読めませんでした：" + (e.message || e) + "（SQL 196 は実行ずみ？）"; }
}

/* ---------- 封筒の中（数えた額）・差額・💯 完璧回収（スプレッドシートと同じ）
   ・封筒には「店落ち − カード − 振込」がそろっているはず（交通費・プラスはキャッシュフローから足してそろえる）
   ・数えた額がそろっているはずの額と同じなら、自動で 💯 完璧回収（押し忘れがないように、ボタンはなし）
   ・kb_collections.collected（数えた額）・done（完璧回収。数えた額を保存したときに自動で入る）（SQL 171） ---------- */
// 当日回収（✔黒）・店長が回収（✔赤）を押したら、精算画面の「実際に投函した額」から自動で入れる（額がちがったら手で入れなおす）（交通費・プラスはキャッシュフローから足すので、精算ミスの分だけずれる）
const countAuto = r => (r.state === "day" || r.state === "later" || r.state === "me") && r.s ? r.amt + Number(r.s.diff || 0) : null;   // 精算済なら（カードで投函がなくても）自動
const countVal = r => r.cl.collected != null ? Number(r.cl.collected) : countAuto(r);
// 領収書だけ投函（あとで回収が必要）
const hasReceipt = r => (Array.isArray(r.cd.settle_log) ? r.cd.settle_log : []).some(l => l.kind === "receipt");
// 💯 完璧回収：封筒の中がそろっているはずの額と同じ・精算ミスなし・領収書の回収待ちなし（あとで変われば自動ではずれる）
const countPerfect = r => { const v = countVal(r); return v != null && v === r.amt && !Number((r.s || {}).diff || 0) && !hasReceipt(r); };
function countCell(r, ed){
  const man = r.cl.collected != null, v = countVal(r), auto = !man && v != null, diff = v == null ? null : v - r.amt, ok = countPerfect(r);
  const why = v == null ? "はず " + num(r.amt) : ok ? "完璧回収" : diff ? "差額 " + (diff > 0 ? "＋" : "−") + num(Math.abs(diff)) : (r.s || {}).diff ? "精算ミスあり" : hasReceipt(r) ? "領収書の回収待ち" : "";
  return `<td class="amt cntc ${ok ? "ok" : v != null ? "ng" : ""}">${ed ? `<input type="number" class="cnt ${auto ? "auto" : ""}" value="${v != null ? v : ""}" onchange="setCollected('${r.id}',this.value,${r.amt})">` : (v != null ? `<b>${num(v)}</b>` : "")}${ok ? `<span class="hyaku">💯</span>` : ""}
      <div class="dif">${why}${auto ? `<br><small>自動（精算で投函した額）</small>` : ""}</div></td>`;
}

/* ---------- 📮 待機場の封筒 ---------- */
async function load(){
  try{
    const chk = q(await sb.from("kb_envelope_checks").select("*").order("checked_at", { ascending: false }).limit(100)) || [];
    for(const p of PLACES){
      const hist = chk.filter(x => x.place === p), last = hist[0] || null;
      let qq = sb.from("kb_cast_days").select("biz_date,cast_id,settled_at").eq("settled", true).eq("settle_place", p).order("settled_at");
      if(last) qq = qq.gt("settled_at", last.checked_at);   // 回収の記録がまだなければ、これまでの全部を数える
      ENV[p] = { last, hist: hist.slice(0, 5), since: q(await qq) || [] };
    }
  }catch(e){ toast("封筒の記録が読めませんでした：" + (e.message || e)); return; }
  paint();
}

  if(v === ""){ el.innerHTML = ""; return; }
  const found = Math.max(0, Number(v) || 0), exp = ENV[p].since.length;
  el.innerHTML = found === exp ? `<span class="ok">✅ 合っています（${exp}通）</span>` : `<span class="ng">⚠️ 合いません：回収 ${found}通／あるはず ${exp}通（${found > exp ? "多い " + (found - exp) : "足りない " + (exp - found)}）</span>`;
}
async function save(p){
  const v = $("env-" + p).value; if(v === ""){ toast("回収した封筒の数を入れてください"); return; }
  const found = Math.max(0, Number(v) || 0), expected = ENV[p].since.length;
  if(!confirm(`${p} の封筒を回収しましたか？\n回収した封筒 ${found}通／あるはず ${expected}通 → ${found === expected ? "✅ 一致" : "⚠️ 合いません"}\n（ここからまた 0 から数えます）`)) return;
  try{ q(await sb.from("kb_envelope_checks").insert({ place: p, found, expected, checked_by: KB.operatorName() })); }
  catch(e){ toast("保存できませんでした：" + (e.message || e)); return; }
  toast(found === expected ? `✅ ${p}：記録しました` : `⚠️ ${p}：${found}通／記録 ${expected}件。精算をたしかめてください`);
  load();
}

init();
