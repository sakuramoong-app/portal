<style>
  body{font-size:14.5px;}
  .wrap{max-width:1180px;}
  .lead{font-size:13px;color:var(--sub);line-height:1.7;margin:6px 0 10px;}
  .lock{font-size:12px;font-weight:800;background:#333;color:#fff;border-radius:99px;padding:3px 12px;margin-left:6px;vertical-align:middle}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 12px;}
  .bar input[type=date]{font-family:inherit;font-weight:800;font-size:14px;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--ink);}
  .sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .sum .s{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;font-size:12px;color:var(--sub);font-weight:800;}
  .sum .s b{display:block;font-size:18px;color:var(--ink);} .sum .s.ng b{color:#c0392b;} .sum .s.ok b{color:#2e8b57;}
  .card{margin-bottom:12px;} .card h2{font-size:16px;margin:0 0 8px;}
  .tbl{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;} th,td{border-bottom:1px solid #F0E3E8;padding:8px;text-align:right;font-size:13.5px;white-space:nowrap;vertical-align:middle;}
  th{background:#FBEFF3;font-size:12px;color:#6b3550;} td.l,th.l{text-align:left;} td.wrapc{white-space:normal;min-width:180px;}
  td.in input{width:100px;text-align:right;font-family:inherit;font-size:15px;font-weight:900;color:#1a3a8a;padding:3px 6px;border:1.5px solid #ccc;border-radius:8px;}
  .z{font-weight:900;} .z.ok{color:#2e8b57;} .z.ng{color:#c0392b;} .z.pl{color:#2f7fd0;}
  .st{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px;margin:1px 0;}
  .st.ok{background:#E5F6EC;color:#2e8b57;} .st.wait{background:#FDE7E7;color:#c0392b;} .st.mv{background:#F1EAFA;color:#5b3fa6;} .st.no{background:#F4F4F4;color:#9C8B8F;}
  a.j{font-size:12px;font-weight:800;color:#2f7fd0;text-decoration:none;margin-left:4px;}
  tr.bad td{background:#FFF6F6;} tr.tot td{background:#F7F7F7;font-weight:900;border-top:2px solid #ccc;}
  td select{font-family:inherit;font-size:12px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;} @media(max-width:900px){.grid{grid-template-columns:1fr;}}
  .flow{display:grid;grid-template-columns:1fr auto;gap:5px 16px;font-size:14px;}
  .flow .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;}
  .flow .eq{border-top:2px solid #333;padding-top:4px;font-weight:900;}
  .flow .ref{font-size:12px;color:var(--sub);}
  .ex{width:100%;margin-top:6px;} .ex td{font-size:13px;padding:5px 6px;white-space:normal;}
  .ex input,.ex select{font-family:inherit;font-size:13px;padding:3px 6px;border:1.5px solid #ddd;border-radius:6px;max-width:100%;}
  .hand{background:#00B0F0;border:3px solid #0A84C6;border-radius:14px;padding:10px 16px;margin-top:10px;}
  .hand .k{font-weight:800;color:#08304d;} .hand .v{text-align:right;font-weight:900;font-size:32px;color:#E0001B;}
  .chk{border:2.5px solid #2e8b57;background:#F0FBF4;border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .chk input{width:22px;height:22px;accent-color:#2e8b57;} .chk small{font-weight:700;color:var(--sub);}
  .leg{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7;}
  .egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
  .ec{background:#fff;border:2.5px solid;border-radius:16px;overflow:hidden;}
  .ec .et{font-weight:900;font-size:17px;padding:8px 14px;display:flex;align-items:center;gap:8px;}
  .ec .body{padding:10px 14px;}
  .ec .now{font-size:13px;color:var(--sub);font-weight:700;}
  .ec .num{font-size:40px;font-weight:900;text-align:right;line-height:1.1;margin:2px 0 4px;} .ec .num small{font-size:16px;margin-left:4px;}
  .ec .who{font-size:12px;color:var(--sub);line-height:1.7;max-height:120px;overflow-y:auto;border-top:1px dashed var(--line);padding-top:6px;}
  .ec .f{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font-weight:800;font-size:13.5px;}
  .ec .f input{width:80px;font-family:inherit;font-size:18px;font-weight:900;text-align:right;padding:4px 8px;border:1.5px solid #ccc;border-radius:8px;}
  .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:#fff;}
  .seg button{border:none;background:none;font-family:inherit;font-weight:800;font-size:13px;padding:7px 14px;color:var(--sub);cursor:pointer;} .seg button.on{background:var(--pink);color:#fff;}
  .ym{font-weight:900;font-size:15px;padding:0 6px;}
  .hist{margin-top:10px;font-size:12.5px;}
  .hist div{display:flex;gap:6px;padding:3px 0;border-bottom:1px solid #F4EDF0;} .hist .ok{color:#2e8b57;font-weight:800;} .hist .ng{color:#c0392b;font-weight:800;}
  .cs{display:inline-flex;gap:4px;} .cs button{font-family:inherit;font-weight:900;font-size:12.5px;border:1.5px solid #ddd;background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;color:#999;}
  .cs button.day.on{background:#222;border-color:#222;color:#fff;} .cs button.me.on{background:#E0001B;border-color:#E0001B;color:#fff;} .cs button.none.on{background:#fff;border-color:#E0001B;color:#E0001B;box-shadow:inset 0 0 0 2px #E0001B;}
  .cs button:disabled{cursor:default;}
  .mk{font-weight:900;font-size:16px;} .mk.day{color:#222;} .mk.me,.mk.none{color:#E0001B;}
  .xi{display:block;font-size:12px;font-weight:700;line-height:1.6;}
  .hl{margin-top:4px;font-size:11.5px;} .hl summary{cursor:pointer;color:#8a6d00;font-weight:800;} .hli{background:#FFFCEB;border:1px solid #F2D27A;border-radius:8px;padding:4px 7px;margin-top:4px;white-space:normal;min-width:220px;line-height:1.5;} .hli .ht{white-space:pre-wrap;color:var(--ink);} .hli .hb{color:var(--sub);text-align:right;}
  .who2{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:3px;}
  td.amt b{font-size:15px;} td.amt small{color:var(--sub);font-weight:700;}
</style>

<body>
<div class="wrap">
  <header class="kbh"><h1>📦 回収明細<span class="lock">🔒 きゃ・社長だけ</span></h1><div id="navArea" class="navinhead"></div></header>
  <div id="gate" class="gate">読み込み中…</div>
  <div id="main" style="display:none">
    <div id="wip"></div>
    <div class="bar">
      <span class="seg"><button id="mDay" class="on" onclick="setMode('day')">1日ごと</button><button id="mMonth" onclick="setMode('month')">1か月ごと</button></span>
      <button class="btn btn-ghost btn-sm" onclick="shift(-1)">◀</button><input type="date" id="day" onchange="reload()"><span id="ymLabel" class="ym" style="display:none"></span><button class="btn btn-ghost btn-sm" onclick="shift(1)">▶</button>
      <button class="btn btn-ghost btn-sm" onclick="$('day').value=KB.bizDateOf();reload()" id="todayBtn">今日</button>
      <span style="width:12px"></span><span id="plBar"></span>
    </div>
    <div id="dayArea"></div>

    <h2 style="font-size:17px;margin:18px 0 2px">📮 待機場の封筒</h2>
    <div class="lead">「精算済にする」で精算場所に池袋・鶯谷・五反田を選んだ分が、前回の回収から数えられていきます。<br>
      封筒を回収したら、あった封筒の数を入れて「📮 回収した」を押してください（そこからまた 0 から数えます）。記録簿の数と同じなら ✅、ちがえば ⚠️ が残ります。</div>
    <div class="egrid" id="egrid"></div>
  </div>
</div>
<script>
/* ============================================================
   📦 回収明細（紙の回収明細のかわり。店長と社長だけ。社長は見る＋サイン＋「受け取った」）
   ・キャストごと：店落ち（暫定的な残額＋雑費）／カード。回収サイン：✔黒＝当日回収／✔赤＝店長が回収／■赤＝未回収のまま社長に渡す（kb_collections・SQL 171）
       交通費・プラスはキャッシュフローから出して袋にそろえる → 袋には「店落ち − カード」が入る。精算ミス・前の日の分も出す。処理✓
       精算済にしていない日（直帰・まだ）は、予約から出した概算（雑費ぬき）
   ・社長に渡す ＝ 店落ち − カード − 経費（回収金からキャッシュフローに補充）− 未回収 − 内勤日払い（回収金から払った分）
   ・当日現金回収 ＝ ✔黒 の合計 − 内勤日払い（紙と同じ）
   ・📮 待機場の封筒：kb_envelope_checks（SQL 170）の前回の回収から、settle_place がその待機場の精算済を数える
   ============================================================ */
const { sb, q, esc, yen, toast } = KB;
const $ = id => document.getElementById(id);
const PLACES = ["池袋", "鶯谷", "五反田"];
const ALL_PLACES = ["池袋", "鶯谷", "五反田", "回収"];
const PLACE_COLOR = { "池袋": "#FFC966", "鶯谷": "#CCCCFF", "五反田": "#C6E0B4", "回収": "#FFC2D1" };
const DOW = ["日","月","火","水","木","金","土"];
const STATE = { day: "✔ 当日回収", me: "✔ 店長が回収", none: "■ 未回収" };
const when = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const md = s => { const p = String(s).split("-"); return `${Number(p[1])}/${Number(p[2])}`; };
const num = n => (Number(n) || 0).toLocaleString("ja-JP");
const sgn = n => (n > 0 ? "＋" : n < 0 ? "−" : "") + num(Math.abs(n));
const jump = (d, cid) => `<a class="j" href="settle.html?d=${d}${cid ? "&c=" + encodeURIComponent(cid) : ""}" target="_blank" rel="noopener" title="その日のそのキャストの精算へ">${md(d)} ↗</a>`;
const backOf = r => r.back_override != null ? Number(r.back_override) : (Number(r.course_back) || 0) + (Number(r.option_back) || 0) + (Number(r.extra_back) || 0);
const RESV_COLS = "*";   // 振込（SQL 173）の欄もあるので全部
let names = {}, staffNames = {}, ENV = {}, D = null, MO = null, place = "", mode = "day";

async function init(){
  $("navArea").innerHTML = KB.nav("kaishu.html");
  if(!(await KB.staffSession({ owner: true }))){ $("gate").textContent = "ポータルから開いてください（ポータルでログインしてから20時間たった場合も、開き直してください）"; return; }
  $("wip").innerHTML = KB.wipBanner();
  $("gate").style.display = "none"; $("main").style.display = "";
  try{ (q(await sb.from("master_casts").select("id,official_name,temp_name")) || []).forEach(c => { names[c.id] = c.official_name || c.temp_name || c.id; }); }catch(e){}
  try{ (q(await sb.from("kb_staff_rates").select("staff_id,record_name")) || []).forEach(r => { if(r.record_name) staffNames[r.staff_id] = r.record_name; }); }catch(e){}
  $("day").value = KB.startDay();   // 記録簿・精算で見ていた日
  paintPlaces(); loadDay(); load();
}
function setMode(m){
  mode = m; $("mDay").classList.toggle("on", m === "day"); $("mMonth").classList.toggle("on", m === "month");
  $("day").style.display = m === "day" ? "" : "none"; $("ymLabel").style.display = m === "month" ? "" : "none";
  $("todayBtn").textContent = m === "day" ? "今日" : "今月";
  reload();
}
function reload(){ if(mode === "day") loadDay(); else loadMonth(); }
function shift(n){
  const d = new Date($("day").value + "T12:00:00Z");
  if(mode === "day") d.setUTCDate(d.getUTCDate() + n); else { d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); }
  $("day").value = d.toISOString().slice(0, 10); reload();
}
function paintPlaces(){
  $("plBar").innerHTML = [["", "ぜんぶ"]].concat(ALL_PLACES.map(p => [p, p])).map(([v, l]) => `<button class="chip ${place === v ? "on" : ""}" onclick="place='${v}';paintPlaces();mode === 'day' ? paintDay() : paintMonth()">${l}</button>`).join(" ");
}
function openDay(d){ $("day").value = d; setMode("day"); scrollTo(0, 0); }

// 1日分の材料（cds・予約・回収チェック・経費など）を読む
async function readRange(from, to){
  const R = { cds: [], resv: [], col: [], ho: [], staff: [], no171: false };
  const [a, b, c] = await Promise.all([
    sb.from("kb_cast_days").select("*").gte("biz_date", from).lt("biz_date", to),
    sb.from("kb_reservations").select(RESV_COLS).gte("biz_date", from).lt("biz_date", to).eq("deleted", false),
    sb.from("kb_staff_work").select("biz_date,staff_id,day_paid,paid,pay_source").gte("biz_date", from).lt("biz_date", to),
  ]);
  R.cds = q(a) || []; R.resv = q(b) || []; R.staff = (c.error ? [] : (c.data || [])).filter(x => x.paid && x.pay_source === "drop" && Number(x.day_paid));
  try{
    R.col = q(await sb.from("kb_collections").select("*").gte("biz_date", from).lt("biz_date", to)) || [];
    R.ho = q(await sb.from("kb_handovers").select("*").gte("biz_date", from).lt("biz_date", to)) || [];
  }catch(e){ R.no171 = true; }
  return R;
}
const nextDay = d => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + 1); return x.toISOString().slice(0, 10); };

// その日のキャストごとの行
function rowsFor(day, R){
  const cds = R.cds.filter(c => c.biz_date === day), resv = R.resv.filter(r => r.biz_date === day && !["cancel", "tobi"].includes(r.status));
  const ids = [...new Set(resv.map(r => r.cast_id).filter(Boolean).concat(cds.filter(c => c.settled || c.direct_home).map(c => c.cast_id)))];
  return ids.map(id => {
    const cd = cds.find(c => c.cast_id === id) || {}, s = cd.settled ? (cd.settle_snapshot || {}) : null, mine = resv.filter(r => r.cast_id === id);
    const cl = R.col.find(x => x.biz_date === day && x.cast_id === id) || {};
    let shop, card, tr = 0, exact = true;
    if(s && (s.shopDrop != null || s.total != null)){
      shop = s.shopDrop != null ? Number(s.shopDrop) : Number(s.total || 0) - Number(s.reward || 0) - Number(s.option || 0) + Number(s.zappi || 0);
      card = Number(s.cardPaid || 0); tr = Number(s.transferPaid || 0);
    } else {
      shop = mine.reduce((a, r) => a + (Number(r.total) || 0) - backOf(r), 0);
      card = mine.filter(r => r.payment === "card" || r.payment === "card_paid").reduce((a, r) => a + (Number(r.total) || 0), 0);
      tr = mine.filter(r => r.transfer_status && Number(r.transfer_amount)).reduce((a, r) => a + (Number(r.transfer_amount) || 0), 0);
      exact = false;
    }
    const kind = cd.settled ? (s.paidOn && s.paidOn !== day ? "later" : "done") : cd.direct_home ? "home" : "open";
    // 精算場所が「回収」（内勤がその場でお金を受け取った）なら、チェックしなくても ✔ 当日回収（精算した内勤・時刻を出す）
    const auto = !cl.state && kind === "done" && cd.settle_place === "回収";
    return { id, cd, s, cl, day, shop, card, tr, amt: shop - card - tr, exact, kind, place: cd.settle_place || "", state: cl.state || (auto ? "day" : ""), auto, done: !!cl.done };
  }).sort((a, b) => (ALL_PLACES.indexOf(a.place) + 1 || 9) - (ALL_PLACES.indexOf(b.place) + 1 || 9) || String(names[a.id] || "").localeCompare(String(names[b.id] || ""), "ja"));
}
// 交通費・経費・精算ミス（その子のぶん）
// 項目ごとに { key（処理✓のキー。空＝チェックなし）, html }
function extraList(r){
  const s = r.s || {}, a = [], id = r.id;
  const tb = Number(s.transportBack || 0) + Number(s.plus || 0);
  if(tb) a.push({ key: "tb", html: `🚃 交通費・プラス ${num(tb)}（キャッシュフローから）` });
  if(Number(s.minus || 0)) a.push({ key: "minus", html: `➖ マイナス ${num(s.minus)}` });
  if(s.diff) a.push({ key: "diff", warn: true, html: `<span style="color:#c0392b">⚠️ 精算ミス：投函が${s.diff < 0 ? "足りない " + num(-s.diff) + "（未精算へ）" : "多い " + num(s.diff) + "（お釣りへ）"}</span>` });
  (s.uns || []).forEach(x => a.push({ key: "uns:" + x.date, html: `<span style="color:#5b3fa6">↔ ${md(x.date)} の${x.kind === "day" ? "精算" : x.amount >= 0 ? "未精算 " + num(x.amount) : "お釣り " + num(-x.amount)} をいっしょに精算 ${jump(x.date, id)}</span>` }));
  if(r.kind === "later") a.push({ key: "", html: `<span style="color:#5b3fa6">→ ${md(r.s.paidOn)} にまとめて精算 ${jump(r.s.paidOn, id)}</span>` });
  if(r.kind === "home") a.push({ key: "", html: `<span style="color:#9C8B8F">🏠 直帰（精算はまだ）</span>` });
  if(r.kind === "open") a.push({ key: "", html: `<span style="color:#c0392b">💴 まだ精算していない ${jump(r.day, id)}</span>` });
  if(!r.exact) a.push({ key: "", html: `<span style="color:#9C8B8F">（金額は予約からの概算・雑費ぬき）</span>` });
  return a;
}
const doneItems = r => Array.isArray(r.cl.done_items) ? r.cl.done_items : [];
// 処理がまだの項目の数（処理✓がつく項目だけ）
const todoOf = r => extraList(r).filter(x => x.key && !doneItems(r).includes(x.key)).length;
function extraItems(r, ed){
  const done = doneItems(r);
  return extraList(r).map(x => `<label class="xi">${x.key ? `<input type="checkbox" ${done.includes(x.key) ? "checked" : ""} ${ed ? "" : "disabled"} onchange="setDoneItem('${r.id}','${x.key}',this.checked)" title="処理した"> ` : ""}${x.html}${x.key && done.includes(x.key) ? ` <small style="color:#2e8b57">✓処理ずみ</small>` : ""}</label>`).join("");
}
// 1日の合計
function totalsFor(day, R, rows){
  const all = rowsFor(day, R), ho = R.ho.find(h => h.biz_date === day) || null;
  rows = rows || all;
  const sum = (l, f) => l.reduce((a, r) => a + f(r), 0);
  // kb_handovers.expenses：経費（キャッシュフローへの補充）と、type:"transfer" の振込（キャンセル料など。カードと同じ扱い）
  const items = ho && Array.isArray(ho.expenses) ? ho.expenses : [];
  const ex = sum(items.filter(x => x.type !== "transfer"), x => Number(x.amount) || 0);
  // 🏦 振込：予約枠の振込（SQL 173。キャンセルの予約は売上に入っていないので、粗利に足してから引く）＋ 回収明細で手で入れた振込
  const trRes = R.resv.filter(r => r.biz_date === day && r.transfer_status && Number(r.transfer_amount));
  const trCancel = sum(trRes.filter(r => ["cancel", "tobi"].includes(r.status)), r => Number(r.transfer_amount));
  const tr = sum(items.filter(x => x.type === "transfer"), x => Number(x.amount) || 0) + trCancel;
  const staff = R.staff.filter(x => x.biz_date === day), staffSum = sum(staff, x => Number(x.day_paid) || 0);
  const T = {
    n: rows.length, shop: sum(rows, r => r.shop), card: sum(rows, r => r.card),
    dayN: rows.filter(r => r.state === "day").length, meN: rows.filter(r => r.state === "me").length,
    noneN: rows.filter(r => r.state === "none").length, yetN: rows.filter(r => !r.state).length,
    daySum: sum(rows.filter(r => r.state === "day"), r => r.amt),
    notCol: sum(rows.filter(r => r.state === "none" || !r.state), r => r.amt),
    todo: rows.reduce((a, r) => a + todoOf(r), 0),
  };
  // 経費・内勤日払い・手渡しは、その日の全部（場所で絞っても）
  const A = { shop: sum(all, r => r.shop), card: sum(all, r => r.card), tr: sum(all, r => r.tr), notCol: sum(all.filter(r => r.state === "none" || !r.state), r => r.amt), yetN: all.filter(r => !r.state).length };
  // 紙の回収明細と同じ：B（キャストの A の合計）＋振込 − C（内勤日払い）＝ F（店落ち粗利）。F − D（カード）− 振込 − E（経費）＝ 最終的に社長に渡す額
  const B = A.shop + tr, F = B - staffSum, fin = F - A.card - A.tr - tr - ex;
  const hand = fin - A.notCol;   // 随時の回収合計（未回収 ■ を引いた、今渡す額）
  return { T, A, ho, ex, tr, trRes, trCancel, staff, staffSum, B, F, fin, hand, all };
}

      ENV[p] = { last, hist: hist.slice(0, 5), since: last ? (q(await qq) || []) : null };
    }
  }catch(e){ $("egrid").innerHTML = `<div class="warn">読めませんでした（SQL 170 は実行ずみ？）：${esc(e.message || e)}</div>`; return; }
  paint();
}
function paint(){
  $("egrid").innerHTML = PLACES.map(p => { const E = ENV[p], l = E.last;
    return `<div class="ec" style="border-color:${PLACE_COLOR[p]}"><div class="et" style="background:${PLACE_COLOR[p]}">${p}</div><div class="body">
      ${l ? `<div class="now">前回の回収 ${when(l.checked_at)}（${esc(l.checked_by)}）から、今あるはずの封筒</div>
        <div class="num">${E.since.length}<small>通</small></div>
        <div class="who">${E.since.length ? E.since.map(x => `${md(x.biz_date)} ${esc(names[x.cast_id] || x.cast_id)}`).join("　") : "まだ投函はありません"}</div>`
      : `<div class="now">まだ回収の記録がありません。いちど回収して「📮 回収した」を押すと、そこから数えはじめます。</div>`}
      ${KB.CAN_EDIT ? `<div class="f">あった封筒 <input type="number" min="0" id="env-${p}" placeholder="0"> 通 <button class="btn btn-primary btn-sm" onclick="save('${p}')">📮 回収した</button></div>` : ""}
      ${E.hist.length ? `<div class="hist">${E.hist.map(h => `<div><span>${when(h.checked_at)} ${esc(h.checked_by)}</span><span style="flex:1"></span>
        ${h.found === h.expected ? `<span class="ok">✅ ${h.found}通 一致</span>` : `<span class="ng">⚠️ ${h.found}通／記録 ${h.expected}件</span>`}</div>`).join("")}</div>` : ""}
    </div></div>`; }).join("");
}
async function save(p){
  const v = $("env-" + p).value; if(v === ""){ toast("あった封筒の数を入れてください"); return; }
  const found = Math.max(0, Number(v) || 0), first = !ENV[p].last, expected = first ? found : ENV[p].since.length;
  if(!confirm(first ? `${p} の封筒を回収しましたか？（はじめての記録なので、ここから数えはじめます）\nあった封筒 ${found}通`
    : `${p} の封筒を回収しましたか？\nあった封筒 ${found}通／記録簿 ${expected}件 → ${found === expected ? "✅ 一致" : "⚠️ 合いません"}`)) return;
  try{ q(await sb.from("kb_envelope_checks").insert({ place: p, found, expected, checked_by: KB.operatorName() })); }
  catch(e){ toast("保存できませんでした：" + (e.message || e)); return; }
  toast(found === expected ? `✅ ${p}：記録しました` : `⚠️ ${p}：${found}通／記録 ${expected}件。精算をたしかめてください`);
  load();
}
init();
</script>
</body>
</html>
