<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受付│記録簿</title>
<link rel="icon" type="image/png" href="../favicon.png?v=3">
<link rel="stylesheet" href="kb.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="kb_common.js"></script>
<style>
  .daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .daybar input[type=date]{font-family:inherit;font-size:14px;padding:8px 12px;border:1.5px solid var(--line);border-radius:99px;background:#fff;color:var(--ink);}
  .notice{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;}
  .notice textarea{flex:1;min-height:44px;font-family:inherit;font-size:13.5px;padding:9px 12px;border:1.5px solid #f2d27a;border-radius:12px;background:var(--lemon-soft);color:var(--ink);resize:vertical;}
  .sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .sum .s{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;font-size:12px;color:var(--sub);font-weight:800;}
  .sum .s b{display:block;font-size:17px;color:var(--ink);}
  .sum .s.hide b{filter:blur(7px);user-select:none;}
  table.list{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px;}
  table.list th{font-size:11px;color:var(--sub);text-align:left;padding:0 8px;font-weight:800;}
  table.list td{background:#fff;padding:9px 8px;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);}
  table.list td:first-child{border-left:1.5px solid var(--line);border-radius:12px 0 0 12px;}
  table.list td:last-child{border-right:1.5px solid var(--line);border-radius:0 12px 12px 0;}
  table.list tr.r{cursor:pointer;}
  table.list tr.r:hover td{background:var(--pink-soft);}
  .wrapx{overflow-x:auto;}
  .st{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap;}
  .st.done{background:var(--mint-soft);color:#1a7a5e;}
  .st.checking,.st.pre_call,.st.hour_call{background:var(--lemon-soft);color:#9a7000;}
  .st.wait_hotel,.st.wait_guest,.st.wait_cast{background:var(--lav-soft);color:#6c5896;}
  .st.cancel,.st.tobi{background:var(--gray-soft);color:#999;}
  .money{text-align:right;white-space:nowrap;font-weight:800;}
  .form-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  @media (max-width:860px){ .form-cols{grid-template-columns:1fr;} }
  .calc{background:#FAF8F6;border-radius:16px;padding:14px;position:sticky;top:10px;align-self:start;}
  .calc .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .calc .row.total{font-size:16px;font-weight:800;border-top:2px solid var(--line);margin-top:6px;padding-top:8px;}
  .calc .row.back{color:#6c5896;}
  .calc h3{font-size:13px;font-weight:800;margin:10px 0 4px;color:var(--pink-deep);}
  .calc .why{font-size:11px;color:var(--sub);white-space:pre-wrap;line-height:1.5;margin-top:4px;}
  .opt{display:grid;grid-template-columns:22px 1fr 70px 80px 80px;gap:6px;align-items:center;font-size:13px;padding:3px 0;}
  .opt input[type=number],.opt input[type=text]{width:100%;font-family:inherit;font-size:13px;padding:5px 8px;border:1.5px solid #eee;border-radius:8px;background:#FAF8F6;color:var(--ink);}
  .opt .lbl small{color:var(--sub);font-size:11px;}
  .hist{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6;}
  .msg{width:100%;min-height:200px;font-family:inherit;font-size:13px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);white-space:pre;}
</style>
</head>
<body>
<div class="wrap">
  <header class="kbh"><h1>🧾 受付（記録簿）</h1><span class="spacer"></span>
    <button class="btn btn-primary edit-only" onclick="openForm(null)">＋ 受付する</button></header>
  <div id="navArea"></div>
  <div id="wipArea"></div>
  <div id="gate" class="gate">読み込み中…</div>

  <div id="main" style="display:none">
    <div class="daybar">
      <button class="btn btn-ghost btn-sm" onclick="moveDay(-1)">◀</button>
      <input type="date" id="day" onchange="loadDay()">
      <button class="btn btn-ghost btn-sm" onclick="moveDay(1)">▶</button>
      <button class="btn btn-ghost btn-sm" onclick="goToday()">今日（営業日）</button>
      <span class="bd" id="dayInfo"></span>
    </div>
    <div class="notice">
      <textarea id="notice" placeholder="📢 本日のお知らせ（例：ムムの明日のコス、待機に用意してムムに連絡お願いします）" onchange="saveNotice()"></textarea>
    </div>
    <div class="sum" id="sum"></div>
    <div class="wrapx"><table class="list" id="list"></table></div>
  </div>
</div>

<!-- 受付の小窓 -->
<div class="modal-bg" id="formBg">
  <div class="modal">
    <button class="x" onclick="closeForm()" aria-label="閉じる">×</button>
    <h2 id="formTitle">受付</h2>
    <div id="receptionNotes"></div>
    <div class="form-cols">
      <div>
        <div class="grid3">
          <div class="f"><label>店舗</label><select id="f_store" onchange="onStore()"></select></div>
          <div class="f"><label>開始時間</label><input type="time" id="f_start" step="300" oninput="recalc()"></div>
          <div class="f"><label>状態</label>
            <select id="f_status">
              <option value="checking">確認中</option><option value="pre_call">前日確電</option><option value="hour_call">1H前確電</option>
              <option value="wait_hotel">ホテル連絡待ち</option><option value="wait_guest">客入室待ち</option><option value="wait_cast">キャスト入室待ち</option>
              <option value="done">終了</option><option value="cancel">キャンセル</option><option value="tobi">トビ</option>
            </select></div>
        </div>

        <div class="sec">💁 キャスト</div>
        <div class="f"><select id="f_cast" onchange="onCast()"></select></div>
        <div id="castInfo"></div>

        <div class="sec">👤 お客さん</div>
        <div class="grid2">
          <div class="f"><label>電話番号</label><input id="f_phone" inputmode="tel" placeholder="09012345678" onchange="lookupCustomer()"></div>
          <div class="f"><label>お名前</label><input id="f_name" maxlength="40"></div>
        </div>
        <div id="custInfo"></div>
        <div class="grid2" style="margin-top:8px">
          <div class="f"><label>NG客</label>
            <select id="f_ng"><option value="0">NGではない</option><option value="1">⚠️ NG客</option></select></div>
          <div class="f"><label>NGの理由・お客さんメモ</label><input id="f_custnote" maxlength="200"></div>
        </div>
        <div class="f" style="margin-top:8px"><label>新規・リピ</label>
          <div class="chips" id="f_visit"></div></div>

        <div class="sec">📋 コース</div>
        <div class="grid3">
          <div class="f"><label>コース</label><select id="f_course" onchange="recalc()"></select></div>
          <div class="f"><label>フリー</label>
            <select id="f_free" onchange="recalc()">
              <option value="">指名あり（フリーではない）</option><option value="free">フリー</option>
              <option value="special_free">特別フリー</option><option value="event_free">イベフリー</option>
            </select></div>
          <div class="f"><label>延長（30分の回数）／デート（30分の回数）</label>
            <div style="display:flex;gap:6px"><input type="number" id="f_ext" min="0" value="0" oninput="recalc()"><input type="number" id="f_date" min="0" value="0" oninput="recalc()"></div></div>
        </div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:800">
          <label><input type="checkbox" id="f_nh" onchange="recalc()"> キューティ：NH料金で取った</label>
          <label><input type="checkbox" id="f_adm" onchange="recalc()"> 入会金あり（極門の新規）</label>
        </div>
        <div id="courseInfo"></div>

        <div class="sec">✨ オプション</div>
        <div id="f_opts"></div>
        <div class="opt" style="margin-top:4px">
          <span></span><input type="text" id="f_xop_label" placeholder="ほかのOP（自由入力）" oninput="recalc()">
          <span></span><input type="number" id="f_xop_price" placeholder="料金" oninput="recalc()"><input type="number" id="f_xop_back" placeholder="バック" oninput="recalc()">
        </div>

        <div class="sec">📍 場所・媒体・お支払い</div>
        <div class="grid2">
          <div class="f"><label>エリア</label><input id="f_area" maxlength="60" placeholder="例：池袋"></div>
          <div class="f"><label>ホテル・自宅（住所・部屋番号）</label><input id="f_address" maxlength="200"></div>
          <div class="f"><label>交通費（お客さんから）</label><input type="number" id="f_transport" min="0" value="0" oninput="recalc()"></div>
          <div class="f"><label>割引（円）・割引の名前</label>
            <div style="display:flex;gap:6px"><input type="number" id="f_discount" min="0" value="0" oninput="recalc()"><input id="f_discnote" placeholder="例：口コミ割" maxlength="60"></div></div>
          <div class="f"><label>お支払い</label>
            <select id="f_pay" onchange="recalc()"><option value="cash">現金</option><option value="card">カード（×1.15）</option><option value="card_paid">カード精算済</option></select></div>
          <div class="f"><label>確認電話</label><input id="f_confirm" maxlength="60" placeholder="例：前日OK・1H前OK"></div>
        </div>
        <div class="f" style="margin-top:8px"><label>媒体（いくつでも）</label><div class="chips" id="f_media"></div></div>
        <div class="f" style="margin-top:8px"><label>備考</label><textarea id="f_note"></textarea></div>
      </div>

      <div class="calc" id="calc"></div>
    </div>

    <div class="sec">📨 キャストへの予約連絡（コピーして送る）</div>
    <textarea class="msg" id="msg" readonly></textarea>
    <div style="margin-top:6px"><button class="btn btn-ghost btn-sm" onclick="copyMsg()">📋 文面をコピー</button></div>

    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-danger edit-only" id="delBtn" onclick="removeRes()">🗑 削除</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost" onclick="closeForm()">キャンセル</button>
      <button class="btn btn-primary edit-only" onclick="saveRes()">💾 保存する</button>
    </div>
    <div class="hist" id="logInfo"></div>
  </div>
</div>

<script>
/* ============================================================
   受付（記録簿）
   ・料金・バックは Supabase のマスタ（kb_prices・kb_back・kb_options・kb_cast_rules・kb_settings）から自動で計算
   ・キャストはキャスト台帳（master_casts）から選ぶ。お客さんは電話番号で探す
   ・保存すると、だれが・いつ・何を直したかが自動で残る（kb_reservation_log）
   ============================================================ */
const { sb, q, esc, yen, toast } = KB;
const $ = id => document.getElementById(id);
const DOW = ["日","月","火","水","木","金","土"];
const STATUS = { checking:"確認中", pre_call:"前日確電", hour_call:"1H前確電", wait_hotel:"ホテル連絡待ち", wait_guest:"客入室待ち", wait_cast:"キャスト入室待ち", done:"終了", cancel:"キャンセル", tobi:"トビ" };
const VISIT = [["new","新規"],["repeat","店リピ"],["honshi","本指名"]];
const FREE_SUFFIX = { "":"", free:"フリー", special_free:"特別フリー", event_free:"イベフリー" };

let M = {};              // マスタ一式
let day = "", rows = [], editing = null, curCustomer = null, visit = "new", mediaSel = [];
let showMoney = false;

$("navArea").innerHTML = KB.nav("reception.html");
$("wipArea").innerHTML = KB.wipBanner();
if(!KB.CAN_EDIT) document.body.classList.add("readonly");
KB.closeOnBackdrop($("formBg"), closeForm);

async function init(){
  if(location.hash) history.replaceState(null, "", location.pathname + location.search);
  if(!(await KB.staffSession())){ $("gate").textContent = "ポータルから開いてください（ポータルでログインしてから20時間たった場合も、開き直してください）"; return; }
  try{
    const r = await Promise.all([
      sb.from("master_stores").select("*").order("sort"),
      sb.from("master_casts").select("id,official_name,temp_name,kana,status,ranks,special_notes,ng_notes,aliases").neq("status","left"),
      sb.from("kb_prices").select("*"),
      sb.from("kb_back").select("*"),
      sb.from("kb_options").select("*").order("sort"),
      sb.from("kb_cast_rules").select("*").eq("active", true),
      sb.from("kb_settings").select("*"),
      sb.from("kb_media").select("*").eq("active", true).order("sort"),
      sb.from("kb_course_info").select("*"),
      sb.from("kb_rank_history").select("cast_id,grp,rank,valid_from,id,hearing_text,by_name,at"),
    ]);
    const [stores, casts, prices, back, options, rules, settings, media, courseInfo, rankHist] = r.map(q);
    M = { stores, casts, prices, options, rules, media, courseInfo, rankHist: rankHist || [], back: {}, set: {} };
    back.forEach(b=>{ M.back[b.rank + "|" + b.course] = b.amount; });
    settings.forEach(s=>{ M.set[s.key] = s.value; });
    M.casts.sort((a,b)=> String(a.kana || a.official_name || a.temp_name).localeCompare(String(b.kana || b.official_name || b.temp_name), "ja"));
  }catch(e){ $("gate").textContent = "読み込みに失敗しました：" + (e.message || e); return; }
  $("gate").style.display = "none"; $("main").style.display = "";
  goToday();
}

/* ---------- 日付・一覧 ---------- */
function goToday(){ $("day").value = KB.bizDateOf(); loadDay(); }
function moveDay(n){ const d = new Date($("day").value + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); $("day").value = d.toISOString().slice(0,10); loadDay(); }
async function loadDay(){
  day = $("day").value;
  const d = new Date(day + "T12:00:00Z");
  $("dayInfo").textContent = `${d.getUTCMonth()+1}/${d.getUTCDate()}(${DOW[d.getUTCDay()]}) の営業日（朝6時まで）`;
  try{
    const [res, note] = await Promise.all([
      sb.from("kb_reservations").select("*, kb_customers(id,name,phone,ng)").eq("biz_date", day).eq("deleted", false).order("start_at"),
      sb.from("kb_day_notes").select("notice").eq("biz_date", day).maybeSingle(),
    ]);
    rows = q(res) || [];
    $("notice").value = (q(note) || {}).notice || "";
  }catch(e){ toast("読み込みに失敗しました：" + (e.message || e)); rows = []; }
  renderList();
}
function castName(id){ const c = M.casts.find(x=>x.id===id); return c ? (c.official_name || c.temp_name) : (id || "—"); }
function storeLabel(k){ const s = M.stores.find(x=>x.key===k); return s ? s.label : k; }
function hm(iso){ if(!iso) return ""; const d = new Date(iso); const j = new Date(d.getTime()+9*3600*1000); return String(j.getUTCHours()).padStart(2,"0")+":"+String(j.getUTCMinutes()).padStart(2,"0"); }
function backOf(r){ return r.back_override != null ? r.back_override : (r.course_back + r.option_back + r.extra_back); }

function renderList(){
  const live = rows.filter(r=>r.status !== "cancel" && r.status !== "tobi");
  const total = live.reduce((a,r)=>a + r.total, 0), back = live.reduce((a,r)=>a + backOf(r), 0);
  $("sum").innerHTML = `<div class="s">件数<b>${live.length}件</b></div>
    <div class="s ${showMoney?"":"hide"}">売上総額<b>${yen(total)}</b></div>
    <div class="s ${showMoney?"":"hide"}">キャスト報酬<b>${yen(back)}</b></div>
    <div class="s ${showMoney?"":"hide"}">店落ち（暫定）<b>${yen(total - back)}</b></div>
    <button class="btn btn-ghost btn-sm" onclick="showMoney=!showMoney;renderList()">${showMoney?"🙈 金額をかくす":"👁 金額を見る"}</button>`;
  $("list").innerHTML = rows.length ? `<tr><th>時間</th><th>キャスト</th><th>店舗</th><th>コース</th><th>お客さん</th><th>状態</th><th>総額</th><th>報酬</th><th>対応</th></tr>` +
    rows.map(r=>{
      const c = r.kb_customers || {};
      return `<tr class="r" onclick="openForm(${r.id})">
        <td>${hm(r.start_at)}〜${hm(r.end_at)}</td><td><b>${esc(castName(r.cast_id))}</b></td><td>${esc(storeLabel(r.store_key))}</td>
        <td>${esc(r.course)}${r.free_kind?"・"+FREE_SUFFIX[r.free_kind]:""}${r.extension_count?" 延長"+r.extension_count:""}</td>
        <td>${c.ng?"⚠️":""}${esc(c.name||"")}<small style="color:var(--sub)"> ${VISIT.find(v=>v[0]===r.visit_kind)?.[1]||""}</small></td>
        <td><span class="st ${r.status}">${STATUS[r.status]||r.status}</span></td>
        <td class="money">${yen(r.total)}</td><td class="money">${yen(backOf(r))}</td><td>${esc(r.created_by||"")}</td></tr>`;
    }).join("") : `<tr><td style="text-align:center;color:var(--sub);font-weight:800;padding:24px">この日の受付はまだありません</td></tr>`;
}
async function saveNotice(){
  if(!KB.CAN_EDIT) return;
  try{ q(await sb.from("kb_day_notes").upsert({ biz_date: day, notice: $("notice").value, updated_by: KB.operatorName() })); toast("お知らせを保存しました"); }
  catch(e){ toast("保存できませんでした：" + (e.message || e)); }
}

/* ---------- 受付の小窓 ---------- */
function storeGroup(store){ const br = M.set.back_ranks || {}; for(const g in br){ if((br[g]||[]).includes(store)) return g; } return "sakurana"; }
function minutesOf(course){ const m = String(course).match(/(\d+)$/); if(String(course).includes("泊")) return 480; return m ? Number(m[1]) : 0; }

function openForm(id){
  editing = id ? rows.find(r=>r.id===id) : null;
  const r = editing || {};
  $("formTitle").textContent = id ? `受付の編集（No.${id}）` : "＋ 受付";
  $("receptionNotes").innerHTML = (M.set.reception_notes || []).map(t=>`<div class="info">📌 ${esc(t)}</div>`).join("");
  $("f_store").innerHTML = M.stores.map(s=>`<option value="${s.key}">${esc(s.label)}</option>`).join("");
  $("f_store").value = r.store_key || "sakuramoon";
  const grp = { active:"在籍", break:"お休み中", new:"入店前", interview:"面接中" };
  $("f_cast").innerHTML = `<option value="">（キャストを選ぶ）</option>` + Object.keys(grp).map(st=>{
    const list = M.casts.filter(c=>c.status===st); if(!list.length) return "";
    return `<optgroup label="${grp[st]}">` + list.map(c=>`<option value="${c.id}">${esc(c.official_name || c.temp_name)}</option>`).join("") + `</optgroup>`;
  }).join("");
  $("f_cast").value = r.cast_id || "";
  $("f_start").value = r.start_at ? hm(r.start_at) : "";
  $("f_status").value = r.status || "checking";
  $("f_free").value = r.free_kind || "";
  $("f_ext").value = r.extension_count || 0; $("f_date").value = r.date_count || 0;
  $("f_nh").checked = !!r.nh_rate; $("f_adm").checked = (r.admission || 0) > 0;
  $("f_area").value = r.area || ""; $("f_address").value = r.address || "";
  $("f_transport").value = r.transport || 0; $("f_discount").value = r.discount || 0; $("f_discnote").value = r.discount_note || "";
  $("f_pay").value = r.payment || "cash"; $("f_confirm").value = r.confirm_call || ""; $("f_note").value = r.note || "";
  visit = r.visit_kind || "new"; mediaSel = (r.media || []).slice();
  const c = r.kb_customers || {};
  curCustomer = r.customer_id ? { id: r.customer_id, ...c } : null;
  $("f_phone").value = c.phone || ""; $("f_name").value = c.name || ""; $("f_ng").value = c.ng ? "1" : "0"; $("f_custnote").value = "";
  $("custInfo").innerHTML = "";
  onStore(r);
  onCast();
  if(curCustomer) lookupCustomer(true);
  $("delBtn").style.display = id ? "" : "none";
  document.querySelectorAll("#formBg input, #formBg select, #formBg textarea:not(#msg)").forEach(el=>{ el.disabled = !KB.CAN_EDIT; });
  $("logInfo").textContent = "";
  if(id) loadLog(id);
  $("formBg").classList.add("show");
  recalc();
}
function closeForm(){ $("formBg").classList.remove("show"); }

function onStore(r){
  const store = $("f_store").value, g = storeGroup(store);
  const list = M.prices.filter(p=>p.store_key===store);
  const keep = (r && r.course) || $("f_course").value;
  $("f_course").innerHTML = list.map(p=>`<option value="${esc(p.course)}">${esc(p.course)}${/^\d+$/.test(p.course)?"分":""}　${yen(p.price)}${p.note?"（"+esc(p.note)+"）":""}</option>`).join("");
  if(keep && list.some(p=>p.course===keep)) $("f_course").value = keep;
  // オプション
  const sel = (r && r.options) || [];
  $("f_opts").innerHTML = M.options.filter(o=>o.store_group===g).map(o=>{
    const s = sel.find(x=>x.code===o.code && x.group===g);
    const qty = s ? s.qty : 1;
    return `<div class="opt">
      <input type="checkbox" id="o_${o.code}" ${s?"checked":""} onchange="recalc()">
      <label class="lbl" for="o_${o.code}">${esc(o.label)}${o.note?`<br><small>${esc(o.note)}</small>`:""}</label>
      <input type="number" id="oq_${o.code}" min="1" value="${qty}" title="${o.unit==="per_item"?"枚数":o.unit==="per_cast"?"キャストの人数":"回数"}" oninput="recalc()" ${o.unit==="once"?'style="visibility:hidden"':""}>
      <input type="number" id="op_${o.code}" value="${s?s.price:o.price}" title="料金（1回あたり）" oninput="recalc()" ${o.manual?"":"readonly"}>
      <input type="number" id="ob_${o.code}" value="${s?s.back:o.back}" title="バック（1回あたり）" oninput="recalc()" ${o.manual?"":"readonly"}>
    </div>`;
  }).join("") + `<div style="font-size:11px;color:var(--sub);margin-top:4px">右の2つは「料金」「バック」（1回あたり）。内容で変わるOPだけ直せます。</div>`;
  const x = sel.find(s=>s.code==="custom");
  $("f_xop_label").value = x ? x.label : ""; $("f_xop_price").value = x ? x.price : ""; $("f_xop_back").value = x ? x.back : "";
  // 媒体・新規リピ
  $("f_media").innerHTML = M.media.map(m=>`<button type="button" class="chip ${mediaSel.includes(m.code)?"on":""}" onclick="toggleMedia('${m.code}')">${esc(m.label)}</button>`).join("");
  $("f_visit").innerHTML = VISIT.map(([k,l])=>`<button type="button" class="chip ${visit===k?"on":""}" onclick="setVisit('${k}')">${l}</button>`).join("");
  // コースの説明（極門）
  recalc();
}
function toggleMedia(code){ mediaSel = mediaSel.includes(code) ? mediaSel.filter(x=>x!==code) : [...mediaSel, code];
  document.querySelectorAll("#f_media .chip").forEach((b,i)=>b.classList.toggle("on", mediaSel.includes(M.media[i].code))); }

/* ---------- その日に効いているランク・条件（台帳の「適用開始日つき」の履歴から） ---------- */
function rankRowsOn(cast){
  const out = {};
  M.rankHist.forEach(r=>{
    if(r.cast_id !== cast.id || r.valid_from > day) return;
    const b = out[r.grp];
    if(!b || r.valid_from > b.valid_from || (r.valid_from === b.valid_from && r.id > b.id)) out[r.grp] = r;
  });
  return out;
}
function ranksOn(cast){
  const rows = rankRowsOn(cast), o = {};
  if(!Object.keys(rows).length) return cast.ranks || {};   // 履歴がまだ無いキャストは台帳の値
  Object.keys(rows).forEach(g=>{ if(rows[g].rank) o[g] = rows[g].rank; });
  return o;
}
function rulesOn(castId){
  return M.rules.filter(r=>r.cast_id === castId && (r.valid_from || "2000-01-01") <= day && (!r.valid_to || r.valid_to > day));
}
// ヒアリングを見る
let hearings = [];
function hearLink(text, by, at){
  hearings.push({ text, by, at });
  return ` <a href="javascript:void(0)" onclick="showHear(${hearings.length - 1})" style="color:#c9556a;font-weight:800">🔗ヒアリング</a>`;
}
function showHear(i){
  const h = hearings[i]; if(!h) return;
  const d = h.at ? new Date(h.at) : null;
  alert("💬 ヒアリング" + (h.by ? "（" + h.by + (d ? "　" + (d.getMonth()+1) + "/" + d.getDate() : "") + "）" : "") + "\n\n" + (h.text || "（記録がありません）"));
}

function onCast(){
  const c = M.casts.find(x=>x.id===$("f_cast").value);
  if(!c){ $("castInfo").innerHTML = ""; recalc(); return; }
  hearings = [];
  const GL = {sakurana:"サクラナ",cutie:"CC",gokumon:"極門",event:"イベ"};
  const rr = rankRowsOn(c), rks = ranksOn(c);
  const rk = Object.entries(rks).map(([k,v])=>`${GL[k]||k} ${esc(v)}` + (rr[k] ? hearLink(rr[k].hearing_text, rr[k].by_name, rr[k].at) : "")).join("　");
  const rules = rulesOn(c.id).map(r=>"・" + esc(r.note) + hearLink(r.hearing_text, r.by_name, r.created_at)).join("<br>");
  $("castInfo").innerHTML =
    (rk ? `<div class="info">⭐ ランク：${rk}</div>` : `<div class="warn">ランクが台帳に入っていません（バックは手で入れてください）</div>`) +
    (c.special_notes ? `<div class="info">📝 特記事項：${esc(c.special_notes)}</div>` : "") +
    (c.ng_notes ? `<div class="warn">🚫 NG：${esc(c.ng_notes)}</div>` : "") +
    (rules ? `<div class="info">🧮 このキャストの条件：<br>${rules}</div>` : "");
  recalc();
}

/* ---------- お客さん ---------- */
const digits = s => String(s||"").replace(/[^\d]/g, "");
async function lookupCustomer(keepName){
  const phone = digits($("f_phone").value);
  $("f_phone").value = phone;
  if(phone.length < 6){ curCustomer = null; $("custInfo").innerHTML = ""; return; }
  try{
    const c = q(await sb.from("kb_customers").select("*").eq("phone", phone).order("id").limit(1).maybeSingle());
    curCustomer = c || null;
    if(!c){ $("custInfo").innerHTML = `<div class="info">🆕 はじめての電話番号です（保存すると新しいお客さんとして登録します）</div>`; if(!editing) setVisit("new"); return; }
    if(!keepName || !$("f_name").value) $("f_name").value = c.name || "";
    $("f_ng").value = c.ng ? "1" : "0"; $("f_custnote").value = c.ng_reason || c.note || "";
    const past = q(await sb.from("kb_reservations").select("biz_date,cast_id,course,status").eq("customer_id", c.id).eq("deleted", false).order("biz_date", {ascending:false}).limit(10)) || [];
    const casts = [...new Set(past.map(p=>castName(p.cast_id)))];
    $("custInfo").innerHTML = (c.ng ? `<div class="warn">⚠️ NG客です：${esc(c.ng_reason||"理由なし")}</div>` : "") +
      `<div class="hist">これまで ${past.length}件${past.length>=10?"以上":""}（新しい順）：${past.map(p=>`${p.biz_date.slice(5).replace("-","/")} ${esc(castName(p.cast_id))} ${esc(p.course)}${p.status==="cancel"?"(キャンセル)":p.status==="tobi"?"(トビ)":""}`).join("、") || "なし"}<br>
       指名したことのあるキャスト：${casts.map(esc).join("、") || "なし"}<br>※ 台帳（エクセル）の過去データは、あとで入れます</div>`;
    if(!editing){
      const cid = $("f_cast").value;
      setVisit(cid && past.some(p=>p.cast_id===cid) ? "honshi" : (past.length ? "repeat" : "new"));
    }
  }catch(e){ $("custInfo").innerHTML = `<div class="warn">お客さんを探せませんでした：${esc(e.message||e)}</div>`; }
}
function setVisit(v){ visit = v; document.querySelectorAll("#f_visit .chip").forEach((b,i)=>b.classList.toggle("on", VISIT[i][0]===v)); recalc(); }

/* ---------- 計算 ---------- */
function calc(){
  const store = $("f_store").value, g = storeGroup(store), course = $("f_course").value;
  const cast = M.casts.find(x=>x.id===$("f_cast").value);
  const free = $("f_free").value, ext = Math.max(0, +$("f_ext").value||0), date = Math.max(0, +$("f_date").value||0);
  const why = [];
  const price = (M.prices.find(p=>p.store_key===store && p.course===course) || {}).price || 0;
  // 指名料：フリーは0。キャストの特例があればその額。キューティの NH 料金は＋3,000円
  let nomination = 0;
  if(!free){
    nomination = (M.set.nomination || {}).default || 2000;
    const nr = cast && rulesOn(cast.id).find(r=>r.kind==="nomination_fee");
    if(nr){ nomination = nr.params.amount; why.push(`指名料：特例 ${yen(nomination)}`); }
    if(g === "cutie" && $("f_nh").checked){ nomination += 3000; why.push("NH料金：指名料＋3,000円"); }
  }
  const extSet = (M.set.extension || {})[g] || { price:10000, back:5000 };
  const dateSet = M.set.date || { price:5000, back:2500 };
  const admSet = M.set.admission || { price:2000, back_add:1000 };
  const admission = $("f_adm").checked ? admSet.price : 0;
  // オプション
  const opts = [];
  M.options.filter(o=>o.store_group===g).forEach(o=>{
    if(!$("o_"+o.code) || !$("o_"+o.code).checked) return;
    let p = +$("op_"+o.code).value||0, b = +$("ob_"+o.code).value||0;
    const special = cast && rulesOn(cast.id).find(r=>r.kind==="op_price" && r.params.op===o.code && (!r.params.group || r.params.group===g));
    if(special){ p = special.params.price; b = special.params.back; why.push(`${o.label}：特例 ${yen(p)}（バック${yen(b)}）`); }
    const qty = o.unit === "once" ? 1 : Math.max(1, +$("oq_"+o.code).value||1);
    opts.push({ group:g, code:o.code, label:o.label, qty, price:p, back:b, manual:o.manual });
  });
  if($("f_xop_label").value.trim()){
    opts.push({ group:g, code:"custom", label:$("f_xop_label").value.trim(), qty:1, price:+$("f_xop_price").value||0, back:+$("f_xop_back").value||0, manual:true });
  }
  const optionTotal = opts.reduce((a,o)=>a + o.price*o.qty, 0);
  const optionBack = opts.reduce((a,o)=>a + o.back*o.qty, 0);
  const transport = Math.max(0, +$("f_transport").value||0), discount = Math.max(0, +$("f_discount").value||0);
  let total = price + admission + nomination + ext*extSet.price + date*dateSet.price + transport + optionTotal - discount;
  const pay = $("f_pay").value;
  const cardRate = (M.set.card || {}).rate || 1.15;
  if(pay !== "cash"){ total = Math.round(total * cardRate); }
  // バック：店舗のグループのランク（特別フリー・イベフリーは「イベ」のランク）＋コース＋（本指／フリー…）
  let courseBack = 0, rank = "", key = "";
  if(cast){
    rank = (free === "special_free" || free === "event_free") ? ranksOn(cast).event : ranksOn(cast)[g];
    const suffix = free ? FREE_SUFFIX[free] : (visit === "honshi" ? "本指" : "");
    if(rank){
      let r2 = rank;
      if(g === "cutie" && $("f_nh").checked && !/NH/.test(rank)) r2 = rank + "+NH指名";
      key = course + suffix;
      courseBack = M.back[r2 + "|" + key];
      if(courseBack == null && r2 !== rank) courseBack = M.back[rank + "|" + key];
      if(courseBack == null){ courseBack = 0; why.push(`⚠️ バック表に「${rank}・${key}」がありません → 報酬を手で入れてください`); }
      else why.push(`コースのバック：${rank}・${key} → ${yen(courseBack)}`);
    }else why.push("⚠️ このお店用のランクが台帳にありません → 報酬を手で入れてください");
  }
  let extra = ext*extSet.back + date*dateSet.back;
  if(ext) why.push(`延長 ${ext}回：バック ${yen(ext*extSet.back)}`);
  if(date) why.push(`デート ${date}回：バック ${yen(date*dateSet.back)}`);
  if(admission){ extra += admSet.back_add; why.push(`入会金あり：報酬＋${yen(admSet.back_add)}`); }
  if(cast){
    rulesOn(cast.id).filter(r=>r.kind==="back_add").forEach(r=>{
      const p = r.params || {};
      const okStore = !p.store || p.store === store, okCourse = !p.course || p.course === course;
      const okMin = !p.min_minutes || minutesOf(course) >= p.min_minutes;
      if(okStore && okCourse && okMin){ extra += p.amount; why.push(`特例：${r.note}（＋${yen(p.amount)}）`); }
    });
  }
  return { store, g, course, price, nomination, admission, extFee: ext*extSet.price, dateFee: date*dateSet.price, opts, optionTotal,
           optionBack, transport, discount, total, pay, courseBack, extra, why, rank, ext, date, free };
}

let last = null;
function recalc(){
  if(!$("f_store").value) return;
  const c = last = calc();
  const ov = editing && editing.back_override != null ? editing.back_override : "";
  const back = c.courseBack + c.optionBack + c.extra;
  $("calc").innerHTML = `
    <h3>💴 お客さんの料金</h3>
    <div class="row"><span>基本額（${esc(c.course)}）</span><b>${yen(c.price)}</b></div>
    ${c.admission?`<div class="row"><span>入会金</span><b>${yen(c.admission)}</b></div>`:""}
    <div class="row"><span>指名料</span><b>${yen(c.nomination)}</b></div>
    ${c.extFee?`<div class="row"><span>延長</span><b>${yen(c.extFee)}</b></div>`:""}
    ${c.dateFee?`<div class="row"><span>デート</span><b>${yen(c.dateFee)}</b></div>`:""}
    ${c.optionTotal?`<div class="row"><span>オプション</span><b>${yen(c.optionTotal)}</b></div>`:""}
    ${c.transport?`<div class="row"><span>交通費</span><b>${yen(c.transport)}</b></div>`:""}
    ${c.discount?`<div class="row"><span>割引</span><b>−${yen(c.discount)}</b></div>`:""}
    ${c.pay!=="cash"?`<div class="row"><span>カード（×${(M.set.card||{}).rate||1.15}）</span><b></b></div>`:""}
    <div class="row total"><span>総額</span><b>${yen(c.total)}</b></div>
    <h3>💗 キャストの報酬</h3>
    <div class="row back"><span>コースのバック</span><b>${yen(c.courseBack)}</b></div>
    <div class="row back"><span>OPのバック</span><b>${yen(c.optionBack)}</b></div>
    <div class="row back"><span>延長・入会金・特例</span><b>${yen(c.extra)}</b></div>
    <div class="row total"><span>報酬</span><b>${yen(back)}</b></div>
    <div class="f" style="margin-top:8px"><label>報酬を手で直す（空なら自動）</label><input type="number" id="f_backov" value="${ov}" ${KB.CAN_EDIT?"":"disabled"}></div>
    <div class="why">${esc(c.why.join("\n"))}</div>`;
  // コースの説明（極門など）
  const info = M.courseInfo.find(i=>i.store_key===c.store && String(c.course).startsWith(i.course_type));
  $("courseInfo").innerHTML = info ? `<div class="info"><b>${esc(info.title)}</b>\n${esc(info.description)}</div>` : "";
  buildMsg(c);
}

/* ---------- 予約連絡の文面 ---------- */
function buildMsg(c){
  const cast = M.casts.find(x=>x.id===$("f_cast").value);
  const d = new Date(day + "T12:00:00Z");
  const st = $("f_start").value;
  let en = "";
  if(st){ const [h,m] = st.split(":").map(Number); const mins = minutesOf(c.course) + c.ext*30 + c.date*30; const t = h*60+m+mins; en = String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }
  const backOps = c.opts.filter(o=>o.back>0).map(o=>o.label + (o.qty>1?"×"+o.qty:"")).join("・") || "なし";
  const noBackOps = c.opts.filter(o=>!(o.back>0)).map(o=>o.label + (o.qty>1?"×"+o.qty:"")).join("・") || "なし";
  $("msg").value =
`【${cast ? (cast.official_name || cast.temp_name) : "キャスト"}】
${d.getUTCMonth()+1}/${d.getUTCDate()}(${DOW[d.getUTCDay()]}) ${st||"--:--"}〜${en||"--:--"}
【店名】${storeLabel(c.store)}
【名前】${$("f_name").value || "お客"}様 ${VISIT.find(v=>v[0]===visit)[1]}
【コース】${c.course}${/^\d+$/.test(c.course)?"分":""}${c.free?"（"+FREE_SUFFIX[c.free]+"）":""}${c.ext?"＋延長"+c.ext*30+"分":""}
【ホテル・自宅】${$("f_area").value} ${$("f_address").value}
【バック有OP】${backOps}
【バック無OP】${noBackOps}
【料金総額】${c.total.toLocaleString("ja-JP")}円
※お会いしたら最初に料金をいただいてください。盗難・貰い忘れに注意！`;
}
function copyMsg(){ navigator.clipboard.writeText($("msg").value).then(()=>toast("📋 文面をコピーしました")); }

/* ---------- 保存・削除 ---------- */
function startAt(){
  const st = $("f_start").value; if(!st) return null;
  const [h,m] = st.split(":").map(Number);
  // 日本時間で組み立てる。朝6時より前は次の日の日付（営業日はそのまま）
  const d = new Date(`${day}T${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:00+09:00`);
  if(h < 6) d.setTime(d.getTime() + 24*3600*1000);
  return d;
}
async function saveRes(){
  if(!KB.CAN_EDIT){ toast("作成中のため、直せるのは店長だけです"); return; }
  if(!$("f_cast").value){ toast("キャストを選んでください"); return; }
  if(!$("f_course").value){ toast("コースを選んでください"); return; }
  if(!(await KB.staffSession())){ toast("ログインの期限が切れました。ポータルから開き直してください"); return; }
  const c = calc(), by = KB.operatorName();
  try{
    // お客さん（電話番号があれば探す・なければ作る）
    let customerId = curCustomer ? curCustomer.id : null;
    const phone = digits($("f_phone").value), name = $("f_name").value.trim(), ng = $("f_ng").value === "1", cn = $("f_custnote").value.trim();
    if(phone || name){
      if(!customerId && phone){
        const ex = q(await sb.from("kb_customers").select("id").eq("phone", phone).limit(1).maybeSingle());
        if(ex) customerId = ex.id;
      }
      const cu = { phone, name, ng, updated_by: by };
      if(ng) cu.ng_reason = cn; else if(cn) cu.note = cn;
      if(customerId) q(await sb.from("kb_customers").update(cu).eq("id", customerId));
      else customerId = q(await sb.from("kb_customers").insert(cu).select("id").single()).id;
    }
    const s = startAt();
    const mins = minutesOf(c.course) + c.ext*30 + c.date*30;
    const ovRaw = $("f_backov") ? $("f_backov").value : "";
    const row = {
      biz_date: day, store_key: c.store, cast_id: $("f_cast").value, customer_id: customerId,
      visit_kind: visit, free_kind: c.free, nh_rate: $("f_nh").checked,
      start_at: s ? s.toISOString() : null, end_at: s ? new Date(s.getTime() + mins*60000).toISOString() : null,
      area: $("f_area").value.trim(), address: $("f_address").value.trim(), course: c.course,
      extension_count: c.ext, date_count: c.date, options: c.opts, media: mediaSel,
      base_price: c.price, admission: c.admission, nomination_fee: c.nomination, extension_fee: c.extFee + c.dateFee,
      transport: c.transport, option_total: c.optionTotal, discount: c.discount, discount_note: $("f_discnote").value.trim(),
      total: c.total, payment: c.pay, card_total: c.pay === "cash" ? 0 : c.total,
      course_back: c.courseBack, option_back: c.optionBack, extra_back: c.extra,
      back_override: ovRaw === "" ? null : Number(ovRaw),
      status: $("f_status").value, confirm_call: $("f_confirm").value.trim(), note: $("f_note").value, updated_by: by,
    };
    if(editing) q(await sb.from("kb_reservations").update(row).eq("id", editing.id));
    else { row.created_by = by; q(await sb.from("kb_reservations").insert(row)); }
    closeForm(); toast("保存しました🌸"); loadDay();
  }catch(e){ toast("保存できませんでした：" + (e.message || e)); }
}
async function removeRes(){
  if(!KB.CAN_EDIT || !editing) return;
  if(!confirm("この受付を削除しますか？（記録には「削除」として残ります）")) return;
  try{ q(await sb.from("kb_reservations").update({ deleted: true, updated_by: KB.operatorName() }).eq("id", editing.id)); closeForm(); toast("削除しました"); loadDay(); }
  catch(e){ toast("削除できませんでした：" + (e.message || e)); }
}
async function loadLog(id){
  try{
    const logs = q(await sb.from("kb_reservation_log").select("at,by_name,action,changes").eq("reservation_id", id).order("at")) || [];
    $("logInfo").innerHTML = "🕒 記録：" + logs.map(l=>{
      const t = new Date(l.at); const j = new Date(t.getTime()+9*3600*1000);
      const w = `${j.getUTCMonth()+1}/${j.getUTCDate()} ${String(j.getUTCHours()).padStart(2,"0")}:${String(j.getUTCMinutes()).padStart(2,"0")}`;
      const what = l.action === "insert" ? "受付" : l.action === "delete" ? "削除" : "変更（" + Object.keys(l.changes||{}).slice(0,6).join("・") + "）";
      return `${w} ${esc(l.by_name||"")} ${what}`;
    }).join(" ／ ");
  }catch(e){}
}

init();
