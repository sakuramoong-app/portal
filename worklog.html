<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店長作業ログ│サクラG</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/session_guard.js"></script><!-- 退勤時刻で自動ログアウト -->
<style>
  :root{ color-scheme: light; --bg:#FBF7F8; --ink:#5C4B4F; --sub:#9C8B8F; --line:#F1E3E7; --pink:#FF9EC0; --pink-deep:#e5638c; --pink-soft:#FFF0F5; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 70px;}
  h1{font-size:20px;font-weight:800;color:var(--pink-deep);}
  .lead{font-size:12.5px;color:var(--sub);margin:6px 0 14px;line-height:1.7;}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--sub);cursor:pointer;}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff;}
  .day{margin-bottom:16px;}
  .day h2{font-size:14px;font-weight:800;margin-bottom:6px;display:flex;gap:8px;align-items:baseline;}
  .day h2 small{font-size:11.5px;color:var(--sub);font-weight:700;}
  .item{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--pink);border-radius:12px;padding:9px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;}
  .item .t{font-size:12px;font-weight:800;color:var(--sub);min-width:44px;}
  .item .app{font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap;}
  .item .msg{font-size:14px;line-height:1.6;flex:1;}
  .empty{text-align:center;color:var(--sub);font-weight:800;padding:40px 0;}
  .tabs{display:flex;gap:6px;margin:12px 0 10px;}
  .tab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-family:inherit;font-size:13.5px;font-weight:800;color:var(--sub);cursor:pointer;}
  .tab.on{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff;}
  .quick{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px;}
  .quick input{width:100%;font-family:inherit;font-size:14px;border:1.5px dashed var(--pink);border-radius:10px;padding:9px 11px;}
  .quick-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .quick-row select{flex:1;min-width:120px;}
  select{font-family:inherit;font-size:12.5px;border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;color:var(--ink);}
  .btn{border:none;border-radius:99px;padding:8px 16px;background:var(--pink-deep);color:#fff;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;}
  .card.vision{border-color:#D9CCF2;}
  .card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;font-weight:800;font-size:14.5px;}
  .card-h small{font-size:11.5px;color:var(--sub);font-weight:700;}
  .card-b{display:none;padding:0 12px 12px;}
  .card-b.show{display:block;}
  .sec{font-size:12px;font-weight:800;color:var(--sub);margin:10px 0 4px;display:flex;justify-content:space-between;align-items:center;}
  .row{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .row + .row{border-top:1px dashed var(--line);}
  .row.dragging{background:var(--pink-soft);box-shadow:0 6px 16px rgba(229,99,140,.25);}
  .row .num{font-size:11px;font-weight:800;color:var(--sub);min-width:18px;text-align:right;}
  .row .t{flex:1;font-size:13.5px;line-height:1.5;word-break:break-word;}
  .row .t.can{cursor:text;}
  .row .t.can:hover{background:var(--pink-soft);border-radius:6px;}
  .row.done .t{color:var(--sub);text-decoration:line-through;text-decoration-color:#ddd;}
  .row .d{font-size:11px;color:var(--sub);white-space:nowrap;}
  .ib{flex:0 0 auto;border:none;border-radius:99px;padding:4px 9px;font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;background:#F1ECEA;color:var(--sub);}
  .ib.ok{background:#E6F6EE;color:#2c7a55;}
  .ib.go{background:#FFF0F5;color:#c9556a;}
  .edit{width:100%;font-family:inherit;font-size:13.5px;padding:5px 8px;border:1.5px solid var(--pink);border-radius:8px;-webkit-user-select:text;user-select:text;}
  .add{display:flex;gap:6px;margin:6px 0 2px;}
  .add input{flex:1;font-family:inherit;font-size:13px;border:1.5px dashed var(--line);border-radius:10px;padding:7px 10px;}
  .none{font-size:12px;color:var(--sub);padding:4px;}
  .row{flex-wrap:wrap;}
  .sugg{flex-basis:100%;font-size:12px;font-weight:700;color:#1f5fbf;background:#EEF5FF;border-radius:8px;padding:5px 8px;margin-top:4px;line-height:1.6;}
  .sugg .ib{margin-left:4px;}
  .appTabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px;}
  .appTabs .chip small{font-weight:700;opacity:.8;margin-left:2px;}
  .kindTabs{display:flex;gap:4px;flex-wrap:wrap;}
  .chip.sm{padding:4px 10px;font-size:11.5px;}
  .apptag{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#7a6468;border-radius:99px;padding:2px 8px;white-space:nowrap;}
  .kindtag{flex:0 0 auto;font-size:12px;}
  .back{position:fixed;left:12px;bottom:12px;background:#fff;color:#e5638c;border:1.5px solid #ffc2d1;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;text-decoration:none;box-shadow:0 4px 14px rgba(229,99,140,.2);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 店長作業ログ</h1>
  <div class="tabs">
    <button class="tab on" id="tabBoard" onclick="showTab('board')">📋 ボード</button>
    <button class="tab" id="tabLog" onclick="showTab('log')">🕒 作業ログ（自動）</button>
    <button class="tab" id="tabSum" onclick="showTab('sum')">📊 実績まとめ</button>
  </div>

  <!-- ===== ボード ===== -->
  <div id="boardView">
    <div id="boardNote" class="lead"></div>
    <!-- 思いついたらすぐメモ -->
    <div class="quick" id="quick" style="display:none">
      <input type="text" id="qText" maxlength="300" placeholder="💡 思いついたことを、すぐメモ">
      <div class="quick-row">
        <select id="qApp"></select>
        <select id="qKind"><option value="idea">💡 アイデア</option><option value="task">📋 やること</option></select>
        <button class="btn" onclick="quickAdd()">メモする</button>
      </div>
    </div>
    <!-- 全体像 -->
    <div class="card vision">
      <div class="card-h" onclick="toggleBox('vision')"><span>🗺 全体像（これから作るもの）</span><span class="caret" id="caret-vision">▾</span></div>
      <div class="card-b" id="box-vision"></div>
    </div>
    <div id="apps"><div class="empty">読み込み中…</div></div>
  </div>

  <!-- ===== 作業ログ（GitHub の公開の記録） ===== -->
  <div id="logView" style="display:none">
    <p class="lead">店長がアプリを直したり、新しい機能を足したりした記録です。<b>アプリを公開（アップロード）するたびに、自動でここに増えます。</b><br>
    時刻は、その作業を公開した時刻です（日本時間）。</p>
    <div class="filters" id="filters"></div>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>

  <!-- ===== 実績まとめ（GitHub の記録＋ボードの完了から） ===== -->
  <div id="sumView" style="display:none">
    <div id="sum"><div class="empty">読み込み中…（GitHub の記録をぜんぶ読むので、少しかかります）</div></div>
  </div>
</div>
<a class="back" href="./">🏠 ポータル</a>

<script>
/* ============================================================
   アプリ作業ログ
   GitHub に公開されている各アプリの「更新の記録（コミット）」を読んで、日ごとに並べる。
   ログインもデータベースもいらない（公開されている情報だけを読む）。
   ============================================================ */
const OWNER = "sakuramoong-app";
const REPOS = [
  { repo:"portal",              label:"ポータル・記録簿", color:"#FFE3EC" },
  { repo:"sakurashift-staff",   label:"サクラシフト（内勤）", color:"#E6F6EE" },
  { repo:"sakurashift-cast",    label:"サクラシフト（キャスト）", color:"#E6F6EE" },
  { repo:"cast-sakura-profile", label:"キャストプロフ", color:"#FFF0F5" },
  { repo:"sakura-newcast",      label:"在籍作成ルーム", color:"#F1EAFA" },
  { repo:"naikin-shift",        label:"内勤カレンダー", color:"#E7F2FD" },
];
const DOW = ["日","月","火","水","木","金","土"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items = [], filter = "all";

async function load(){
  const results = await Promise.all(REPOS.map(async r=>{
    try{
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${r.repo}/commits?per_page=100`);
      if(!res.ok) return [];
      const list = await res.json();
      return list.map(c=>({
        repo: r, at: new Date(c.commit.author.date),
        // 1行目だけ（2行目以降の署名などは出さない）
        msg: String(c.commit.message || "").split("\n")[0].trim()
      })).filter(x=>x.msg && !/^Add files via upload$|^Update [\w.\-]+$|^Initial commit$|^Merge /i.test(x.msg));
    }catch(e){ return []; }
  }));
  items = results.flat().sort((a,b)=> b.at - a.at);
  render();
}
function jst(d){ return new Date(d.getTime() + 9*3600*1000); }
function render(){
  document.getElementById("filters").innerHTML = [{repo:"all",label:"ぜんぶ"}].concat(REPOS).map(r=>
    `<button class="chip ${filter===r.repo?"on":""}" onclick="filter='${r.repo}';render()">${esc(r.label)}</button>`).join("");
  const list = items.filter(x=> filter === "all" || x.repo.repo === filter);
  if(!list.length){ document.getElementById("list").innerHTML = `<div class="empty">記録がありません（または GitHub に一時的につながりません）</div>`; return; }
  const byDay = {};
  list.forEach(x=>{ const j = jst(x.at); const k = j.toISOString().slice(0,10); (byDay[k] = byDay[k] || []).push(x); });
  document.getElementById("list").innerHTML = Object.keys(byDay).sort().reverse().map(k=>{
    const arr = byDay[k];
    const d = new Date(k + "T00:00:00Z");
    const times = arr.map(x=>jst(x.at)).sort((a,b)=>a-b);
    const hm = t => String(t.getUTCHours()).padStart(2,"0") + ":" + String(t.getUTCMinutes()).padStart(2,"0");
    return `<div class="day"><h2>${d.getUTCMonth()+1}/${d.getUTCDate()}(${DOW[d.getUTCDay()]})
        <small>${arr.length}件　${hm(times[0])}〜${hm(times[times.length-1])}ごろ</small></h2>` +
      arr.map(x=>`<div class="item"><span class="t">${hm(jst(x.at))}</span>
        <span class="app" style="background:${x.repo.color}">${esc(x.repo.label)}</span>
        <span class="msg">${esc(x.msg)}</span></div>`).join("") + `</div>`;
  }).join("");
}
// 作業ログは、タブを開いたときに1回だけ読む
let logLoaded = false;
let sumLoaded = false;
function showTab(t){
  document.getElementById("tabBoard").classList.toggle("on", t === "board");
  document.getElementById("tabLog").classList.toggle("on", t === "log");
  document.getElementById("tabSum").classList.toggle("on", t === "sum");
  document.getElementById("boardView").style.display = t === "board" ? "" : "none";
  document.getElementById("logView").style.display = t === "log" ? "" : "none";
  document.getElementById("sumView").style.display = t === "sum" ? "" : "none";
  if(t === "log" && !logLoaded){ logLoaded = true; load(); }
  if(t === "sum" && !sumLoaded){ sumLoaded = true; loadSummary(); }
}
</script>

<script>
/* ============================================================
   店長ボード
   アプリごとに 💡アイデア／📋やること／✅完了。いちばん上に 🗺 全体像。
   Supabase の mgr_items に入れる（内勤のログインで読める）。書きかえは担当「きゃ」のときだけ。
   ・文章をクリック → その場で編集　・長押し → ドラッグで並べ替え
   ============================================================ */
const sb = supabase.createClient("https://tuxqpqokbvkrckgxcfdn.supabase.co", "sb_publishable_PyvCZHSzYlaqauYbdZybng_zbftghak");
const APPS = ["ポータル","サクラシフト","内勤カレンダー","在籍作成ルーム","キャストプロフ","記録簿・キャスト台帳","公式HP連携・一括在籍登録","新しいアプリ・その他"];
const operator = (()=>{ try{ return localStorage.getItem("currentOperator") || ""; }catch(e){ return ""; } })();
const CAN = operator === "きゃ";
let rows = [], open = {};
try{ open = JSON.parse(localStorage.getItem("mgrOpen") || "{}"); }catch(e){ open = {}; }

function appList(){
  const extra = [...new Set(rows.filter(r=>r.app && !APPS.includes(r.app)).map(r=>r.app))];
  return APPS.concat(extra);
}
async function loadBoard(){
  const { data, error } = await sb.from("mgr_items").select("*").order("sort").order("id");
  if(error){
    document.getElementById("apps").innerHTML = `<div class="empty">読み込めませんでした。ポータルからログインし直してください。</div>`;
    return;
  }
  rows = data || [];
  renderBoard();
  // 「これ終わった？」のために、公開の記録（作業ログ）も読んでおく
  if(!logLoaded){ logLoaded = true; try{ await load(); }catch(e){} renderBoard(); }
}

/* ---------- 「これ終わった？」：やることの文章と、公開の記録（作業ログ）の文章が似ていたら知らせる ----------
   勝手に完了にはしない（似ているだけで、まちがえることがあるため）。押したら完了 */
function bigrams(s){
  const t = String(s || "").replace(/^[^：:]{1,20}[：:]/, "").replace(/[\s　・、。，．（）()「」『』【】！!？?〜~＋+\-—…:：/]/g, "").toLowerCase();
  const out = new Map(); for(let i = 0; i < t.length - 1; i++){ const g = t.slice(i, i + 2); out.set(g, (out.get(g) || 0) + 1); }
  return out;
}
// やることの言葉（2文字ずつ）のうち、公開の文に入っている割合
function cover(a, b){
  let n = 0, sa = 0;
  a.forEach((v, g)=>{ sa += v; if(b.has(g)) n += Math.min(v, b.get(g)); });
  return { r: sa ? n / sa : 0, n };
}
function dice(a, b){
  let n = 0, sa = 0, sb2 = 0;
  a.forEach(v=>{ sa += v; }); b.forEach(v=>{ sb2 += v; });
  a.forEach((v, g)=>{ if(b.has(g)) n += Math.min(v, b.get(g)); });
  return sa + sb2 ? 2 * n / (sa + sb2) : 0;
}
const dismissed = (()=>{ try{ return new Set(JSON.parse(localStorage.getItem("mgrDismiss") || "[]")); }catch(e){ return new Set(); } })();
function suggestDone(r){
  if(r.kind !== "task" || !items.length || dismissed.has(r.id)) return null;
  const tb = bigrams(r.title); let best = null;
  items.forEach(it=>{
    if(r.created_at && it.at < new Date(r.created_at)) return;   // やることを書く前の公開は見ない
    const cv = cover(tb, bigrams(it.msg)), s = cv.r;
    if(cv.n < 4) return;   // 一致が少なすぎるものは出さない
    if(s >= 0.5 && (!best || s > best.s)) best = { s, it };
  });
  return best;
}
function dismissSuggest(id){ dismissed.add(id); try{ localStorage.setItem("mgrDismiss", JSON.stringify([...dismissed])); }catch(e){} renderBoard(); }
function list(app, kind){ return rows.filter(r=>r.kind === kind && (kind === "vision" || r.app === app)); }
function fmt(d){ if(!d) return ""; const x = new Date(d); return (x.getMonth()+1) + "/" + x.getDate(); }

function rowHtml(r, i, opts){
  const isDone = r.kind === "done";
  let h = `<div class="row ${isDone ? "done" : ""}" ${CAN && !isDone ? `data-id="${r.id}" data-group="${opts.group}"` : ""}>`;
  if(opts.num) h += `<span class="num">${i + 1}</span>`;
  if(opts.tag && r.kind === "idea") h += `<span class="kindtag">💡</span>`;
  h += `<span class="t ${CAN ? "can" : ""}" ${CAN ? `onclick="startEdit(this,${r.id})"` : ""}>${esc(r.title)}</span>`;
  if(opts.tag) h += appTag(r.app);
  if(isDone && r.done_at) h += `<span class="d">✓ ${fmt(r.done_at)}</span>`;
  if(CAN){
    if(r.kind === "idea") h += `<button class="ib go" onclick="setKind(${r.id},'task')">→ やることへ</button>`;
    if(r.kind === "task") h += `<button class="ib ok" onclick="setKind(${r.id},'done')">✓ 完了</button>`;
    if(isDone) h += `<button class="ib" onclick="setKind(${r.id},'task')">戻す</button>`;
    h += `<button class="ib" onclick="delItem(${r.id})" title="消す">🗑</button>`;
  }
  const sg = CAN ? suggestDone(r) : null;
  if(sg) h += `<div class="sugg">🤖 これ終わった？　似ている公開：「${esc(sg.it.msg)}」（${fmt(sg.it.at)}）
      <button class="ib ok" onclick="setKind(${r.id},'done')">✅ 終わった</button><button class="ib" onclick="dismissSuggest(${r.id})">まだ</button></div>`;
  return h + `</div>`;
}
function addHtml(app, kind, ph){
  if(!CAN) return "";
  const id = "add_" + kind + "_" + btoa(unescape(encodeURIComponent(app))).replace(/[^a-z0-9]/gi, "");
  return `<div class="add"><input id="${id}" maxlength="300" placeholder="${ph}"
    onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();addItem('${kind}',decodeURIComponent('${encodeURIComponent(app)}'),'${id}');}">
    <button class="ib go" onclick="addItem('${kind}',decodeURIComponent('${encodeURIComponent(app)}'),'${id}')">追加</button></div>`;
}
// アプリの色（項目の横の札）
const APP_COLOR = { "ポータル":"#FFE3EC", "サクラシフト":"#E6F6EE", "内勤カレンダー":"#E7F2FD", "在籍作成ルーム":"#F1EAFA", "キャストプロフ":"#FFF0F5",
  "記録簿・キャスト台帳":"#FFF4DC", "公式HP連携・一括在籍登録":"#E3F4F7", "新しいアプリ・その他":"#F1ECEA" };
let boardApp = (()=>{ try{ return localStorage.getItem("mgrApp") || "all"; }catch(e){ return "all"; } })();
let boardKind = "all";   // 未完了の中：all／task（やること）／idea（アイデア）
function setBoardApp(a){ boardApp = a; try{ localStorage.setItem("mgrApp", a); }catch(e){} renderBoard(); }
function setBoardKind(k){ boardKind = k; renderBoard(); }
function appTag(app){ return `<span class="apptag" style="background:${APP_COLOR[app] || "#F1ECEA"}">${esc(app || "（なし）")}</span>`; }
function renderBoard(){
  document.getElementById("boardNote").innerHTML = CAN
    ? "文章をクリックで編集・<b>長押しで並べ替え</b>（同じアプリのやることの中で。上から完成させたい順に）。"
    : "見るだけです（書きかえは、担当「きゃ」のときだけできます）。";
  document.getElementById("quick").style.display = CAN ? "" : "none";
  const qa = document.getElementById("qApp"), cur = qa.value;
  qa.innerHTML = appList().map(a=>`<option>${esc(a)}</option>`).join("");
  if(boardApp !== "all") qa.value = boardApp; else if(cur) qa.value = cur;

  // 全体像
  const vs = list("", "vision");
  document.getElementById("box-vision").innerHTML =
    (vs.length ? vs.map((r, i)=>rowHtml(r, i, { num: true, group: "vision" })).join("") : `<div class="none">（まだありません）</div>`)
    + addHtml("", "vision", "＋ 全体像に足す");
  document.getElementById("box-vision").classList.toggle("show", open.vision !== false);
  document.getElementById("caret-vision").textContent = open.vision !== false ? "▴" : "▾";

  // アプリのタブ（すべて／アプリごと）→ 未完了（やること・アイデア）と完了
  const apps = appList();
  if(boardApp !== "all" && !apps.includes(boardApp)) boardApp = "all";
  const inApp = r => boardApp === "all" || r.app === boardApp;
  const notDone = r => r.kind === "task" || r.kind === "idea";
  const appOrder = a => { const i = apps.indexOf(a); return i < 0 ? 99 : i; };
  const cnt = a => rows.filter(r => notDone(r) && (a === "all" || r.app === a)).length;
  let h = `<div class="appTabs">${[["all", "すべて"]].concat(apps.map(a => [a, a])).map(([a, l]) =>
    `<button class="chip ${boardApp === a ? "on" : ""}" onclick="setBoardApp(decodeURIComponent('${encodeURIComponent(a)}'))">${esc(l)} <small>${cnt(a)}</small></button>`).join("")}</div>`;
  // 未完了：やること（アプリの順 → 完成させたい順）、そのあとアイデア
  const open1 = rows.filter(r => notDone(r) && inApp(r) && (boardKind === "all" || r.kind === boardKind))
    .sort((a, b) => (a.kind === b.kind ? 0 : a.kind === "task" ? -1 : 1) || appOrder(a.app) - appOrder(b.app) || (Number(a.sort) || 0) - (Number(b.sort) || 0) || a.id - b.id);
  const nT = rows.filter(r => r.kind === "task" && inApp(r)).length, nI = rows.filter(r => r.kind === "idea" && inApp(r)).length;
  h += `<div class="card"><div class="card-h" style="cursor:default"><span>📋 未完了 <small>${open1.length}</small></span>
      <span class="kindTabs">${[["all", "ぜんぶ"], ["task", "📋 やること " + nT], ["idea", "💡 アイデア " + nI]].map(([k, l]) =>
        `<button class="chip sm ${boardKind === k ? "on" : ""}" onclick="setBoardKind('${k}')">${l}</button>`).join("")}</span></div>
    <div class="card-b show">`;
  const nOf = {};   // 番号はアプリごとに 1 から（そのアプリで完成させたい順）
  h += open1.length ? open1.map(r => rowHtml(r, r.kind === "task" ? (nOf[r.app] = (nOf[r.app] || 0) + 1) - 1 : 0, { num: r.kind === "task", group: r.kind + ":" + r.app, tag: true })).join("") : `<div class="none">（ありません）</div>`;
  if(boardApp !== "all") h += addHtml(boardApp, "task", "＋ " + boardApp + " のやることを足す") + addHtml(boardApp, "idea", "＋ " + boardApp + " のアイデアを足す");
  h += `</div></div>`;
  // 完了（新しい順）
  const dones = rows.filter(r => r.kind === "done" && inApp(r)).sort((a, b) => String(b.done_at).localeCompare(String(a.done_at)));
  const dOpen = !!open["done:" + boardApp];
  h += `<div class="card"><div class="card-h" onclick="toggleKey(decodeURIComponent('${encodeURIComponent("done:" + boardApp)}'))"><span>✅ 完了 <small>${dones.length}</small></span><small>${dOpen ? "▴" : "▾"}</small></div>
    <div class="card-b ${dOpen ? "show" : ""}">${dones.length ? dones.map(r => rowHtml(r, 0, { tag: true })).join("") : `<div class="none">（ありません）</div>`}</div></div>`;
  document.getElementById("apps").innerHTML = h;
}
function toggleKey(k){ open[k] = !open[k]; try{ localStorage.setItem("mgrOpen", JSON.stringify(open)); }catch(e){} renderBoard(); }
function toggleBox(k){ open[k] = open[k] === false; try{ localStorage.setItem("mgrOpen", JSON.stringify(open)); }catch(e){} renderBoard(); }

function nextSort(kind, app){
  const l = list(app, kind);
  return l.length ? Math.max(...l.map(r=>Number(r.sort) || 0)) + 1 : 1;
}
async function save(p){
  const { error } = await p;
  if(error){ alert("保存できませんでした：" + (error.message || error)); }
  await loadBoard();
}
function addItem(kind, app, inputId){
  const el = document.getElementById(inputId), v = el ? el.value.trim() : "";
  if(!v) return;
  save(sb.from("mgr_items").insert({ kind, app: kind === "vision" ? "" : app, title: v, sort: nextSort(kind, kind === "vision" ? "" : app) }));
}
function quickAdd(){
  const v = document.getElementById("qText").value.trim();
  if(!v) return;
  const app = document.getElementById("qApp").value, kind = document.getElementById("qKind").value;
  document.getElementById("qText").value = "";
  open["app:" + app] = true;
  try{ localStorage.setItem("mgrOpen", JSON.stringify(open)); }catch(e){}
  save(sb.from("mgr_items").insert({ kind, app, title: v, sort: nextSort(kind, app) }));
}
function setKind(id, kind){
  const r = rows.find(x=>x.id === id);
  if(!r) return;
  save(sb.from("mgr_items").update({ kind, sort: nextSort(kind, r.app), done_at: kind === "done" ? new Date().toISOString() : null, updated_at: new Date().toISOString() }).eq("id", id));
}
function delItem(id){
  const r = rows.find(x=>x.id === id);
  if(!r || !confirm("「" + r.title + "」を消しますか？（もどせません）")) return;
  save(sb.from("mgr_items").delete().eq("id", id));
}
function startEdit(el, id){
  if(dragging) return;
  const r = rows.find(x=>x.id === id);
  if(!r) return;
  const inp = document.createElement("input");
  inp.className = "edit"; inp.maxLength = 300; inp.value = r.title;
  el.replaceWith(inp); inp.focus();
  let done = false;
  const finish = (ok)=>{
    if(done) return; done = true;
    const v = inp.value.trim();
    if(!ok || !v || v === r.title){ renderBoard(); return; }
    save(sb.from("mgr_items").update({ title: v, updated_at: new Date().toISOString() }).eq("id", id));
  };
  inp.addEventListener("keydown", e=>{ if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); finish(true); } else if(e.key === "Escape") finish(false); });
  inp.addEventListener("blur", ()=>finish(true));
}

// 長押しで並べ替え（0.45秒押したまま → ドラッグ）
let dragging = false;
(function(){
  let timer = null, row = null, sx = 0, sy = 0, just = false;
  const rowFrom = t => t && t.closest ? t.closest(".row[data-id]") : null;
  function begin(x, y, target){
    if(target.closest("input,button,select,a")) return;
    const r = rowFrom(target); if(!r) return;
    sx = x; sy = y; clearTimeout(timer);
    timer = setTimeout(()=>{ row = r; dragging = true; row.classList.add("dragging"); try{ navigator.vibrate && navigator.vibrate(20); }catch(e){} }, 450);
  }
  function move(x, y){
    if(!row){ if(timer && (Math.abs(x - sx) > 8 || Math.abs(y - sy) > 8)){ clearTimeout(timer); timer = null; } return false; }
    const t = rowFrom(document.elementFromPoint(x, y));
    if(t && t !== row && t.parentNode === row.parentNode && t.dataset.group === row.dataset.group){
      const b = t.getBoundingClientRect();
      t.parentNode.insertBefore(row, y < b.top + b.height / 2 ? t : t.nextSibling);
    }
    return true;
  }
  async function end(){
    clearTimeout(timer); timer = null;
    if(!row) return;
    const r = row; row = null; r.classList.remove("dragging");
    just = true; setTimeout(()=>{ just = false; dragging = false; }, 50);
    const ids = [...r.parentNode.querySelectorAll('.row[data-group="' + r.dataset.group + '"]')].map(x=>Number(x.dataset.id));
    const ups = ids.map((id, i)=>sb.from("mgr_items").update({ sort: i + 1 }).eq("id", id));
    const res = await Promise.all(ups);
    const bad = res.find(x=>x.error);
    if(bad) alert("並びを保存できませんでした：" + bad.error.message);
    loadBoard();
  }
  document.addEventListener("touchstart", e=>{ if(e.touches.length === 1) begin(e.touches[0].clientX, e.touches[0].clientY, e.target); }, { passive: true });
  document.addEventListener("touchmove", e=>{ if(move(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault(); }, { passive: false });
  document.addEventListener("touchend", end);
  document.addEventListener("touchcancel", end);
  document.addEventListener("mousedown", e=>{ if(e.button === 0) begin(e.clientX, e.clientY, e.target); });
  document.addEventListener("mousemove", e=>{ if(move(e.clientX, e.clientY)) e.preventDefault(); });
  document.addEventListener("mouseup", end);
  document.addEventListener("contextmenu", e=>{ if(rowFrom(e.target) && (row || timer)) e.preventDefault(); });
  document.addEventListener("click", e=>{ if(just && rowFrom(e.target)){ e.preventDefault(); e.stopPropagation(); } }, true);
})();

document.getElementById("qText").addEventListener("keydown", e=>{ if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); quickAdd(); } });
loadBoard();
</script>

<style>
  .sumcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px;}
  .sumcards .c{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;}
  .sumcards .k{font-size:11.5px;font-weight:800;color:var(--sub);}
  .sumcards .v{font-size:20px;font-weight:800;color:var(--pink-deep);margin-top:2px;}
  .sumcards .s{font-size:11px;color:var(--sub);margin-top:2px;}
  .sbox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;}
  .sbox h3{font-size:14.5px;color:var(--pink-deep);margin-bottom:8px;}
  .st{width:100%;border-collapse:collapse;font-size:13px;}

  .bignote{font-size:17px;font-weight:800;line-height:1.7;color:#8a3a12;background:#FFF4E5;border:2px solid #FFB547;border-radius:14px;padding:12px 16px;margin:4px 0 14px;}
  @media print{ .tabs,.back,#boardView,#logView,.noprint{display:none !important;} #sumView{display:block !important;} body{background:#fff;} }
</style>
<script>
/* ============================================================
   📊 実績まとめ
   ・GitHub の全アプリの公開の記録（コミット）をぜんぶ読んで、日・月・アプリ・時間帯で数える
   ・ボードの「完了」から、できたことの一覧
   作業した時間の「目安」＝その日の最初の公開〜最後の公開の幅（公開の前にも作業しているので、実際はこれより長い）
   ============================================================ */
const SUM_REPOS = REPOS.concat([
  { repo:"sakurashift",            label:"サクラシフト（はじめの版）" },
  { repo:"sakurashift-dev",        label:"サクラシフト（試作）" },
  { repo:"sakuramoong-onboarding", label:"新人さん向け" },
]);
// GitHub はログインなしだと 1時間に60回までしか読めない → 読んだ記録はこのブラウザに覚えておき、次からは新しい分だけ読む
// 覚えておくもの：アプリごとに { at: 読んだ時刻, list: [{ sha, date }] }。30分以内に読んだアプリは、読みにいかない
let rateReset = null;
function cacheGet(){ try{ return JSON.parse(localStorage.getItem("wlCommitCache") || "{}"); }catch(e){ return {}; } }
function cacheSet(c){ try{ localStorage.setItem("wlCommitCache", JSON.stringify(c)); }catch(e){} }
async function ghPage(repo, page, since){
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo}/commits?per_page=100&page=${page}` + (since ? "&since=" + encodeURIComponent(since) : ""));
  if(!res.ok){ const r = res.headers.get("x-ratelimit-reset"); if(r) rateReset = new Date(Number(r) * 1000); throw new Error("GitHub " + res.status); }
  return (await res.json()).map(c=>({ sha: c.sha, date: c.commit.author.date }));
}
async function fetchAllCommits(repo, cache){
  const old = cache[repo];
  if(old && Date.now() - old.at < 30 * 60000) return old.list;      // 30分以内に読んだ → そのまま
  let list = [];
  const since = old && old.list.length ? old.list.reduce((m, c)=>c.date > m ? c.date : m, "") : null;
  for(let page = 1; page <= 10; page++){
    const got = await ghPage(repo, page, since);
    list = list.concat(got);
    if(got.length < 100) break;
  }
  if(old){ const seen = new Set(old.list.map(c=>c.sha)); list = old.list.concat(list.filter(c=>!seen.has(c.sha))); }
  cache[repo] = { at: Date.now(), list };
  return list;
}
async function loadSummary(){
  const el = document.getElementById("sum");
  let commits = [], failed = [], stale = [];
  const cache = cacheGet();
  for(const r of SUM_REPOS){   // 1つずつ読む（上限にかかったら、そこから先は覚えている記録を使う）
    let list = null;
    if(!rateReset){ try{ list = await fetchAllCommits(r.repo, cache); }catch(e){} }
    if(!list && cache[r.repo]){ list = cache[r.repo].list; stale.push(r.label); }
    if(!list){ failed.push(r.label); continue; }
    list.forEach(c=>commits.push({ repo: r, at: new Date(c.date) }));
  }
  cacheSet(cache);
  let done = [];
  try{ const { data } = await sb.from("mgr_items").select("app,title,done_at,created_at").eq("kind", "done").order("done_at"); done = data || []; }catch(e){}
  const resetTxt = rateReset ? `${String(rateReset.getHours()).padStart(2, "0")}:${String(rateReset.getMinutes()).padStart(2, "0")}ごろ` : "1時間ほどたってから";
  if(!commits.length){ el.innerHTML = `<div class="empty">GitHub の記録を読めませんでした。<br>GitHub は1時間に読める回数に上限があります。${resetTxt}に開き直してください。<br><small>（一度読めたら、このブラウザが覚えておくので、次からはほとんど読みにいきません）</small></div>`; return; }
  commits.sort((a, b)=>a.at - b.at);
  const ymd = d=>jst(d).toISOString().slice(0, 10), hh = d=>jst(d).getUTCHours();
  const hm = d=>{ const j = jst(d); return String(j.getUTCHours()).padStart(2, "0") + ":" + String(j.getUTCMinutes()).padStart(2, "0"); };
  // 日ごと（朝6時までは前の日として数える＝夜中の作業をまとめる）
  const workDay = d=>{ const j = jst(d); if(j.getUTCHours() < 6) j.setUTCDate(j.getUTCDate() - 1); return j.toISOString().slice(0, 10); };
  const days = {};
  commits.forEach(c=>{ const k = workDay(c.at); (days[k] = days[k] || []).push(c); });
  const dayKeys = Object.keys(days).sort();
  const span = k=>{ const a = days[k]; return (a[a.length - 1].at - a[0].at) / 3600000; };
  const totalSpan = dayKeys.reduce((s, k)=>s + span(k), 0);
  const first = commits[0].at, last = commits[commits.length - 1].at;
  const fmtD = d=>{ const j = jst(d); return `${j.getUTCFullYear()}/${j.getUTCMonth() + 1}/${j.getUTCDate()}`; };
  const h1 = v=>(Math.round(v * 10) / 10).toLocaleString("ja-JP");
  // 夜（22時〜朝6時）の公開の数
  const night = commits.filter(c=>{ const h = hh(c.at); return h >= 22 || h < 6; }).length;
  // 月ごと
  const months = {};
  dayKeys.forEach(k=>{ const m = k.slice(0, 7); const o = months[m] = months[m] || { days: 0, commits: 0, hours: 0 }; o.days++; o.commits += days[k].length; o.hours += span(k); });
  // アプリごと
  const apps = SUM_REPOS.map(r=>{ const cs = commits.filter(c=>c.repo.repo === r.repo); if(!cs.length) return null;
    const ad = {}; cs.forEach(c=>{ const k = workDay(c.at); (ad[k] = ad[k] || []).push(c.at); });
    const hours = Object.values(ad).reduce((s, a)=>s + (a[a.length - 1] - a[0]) / 3600000, 0);   // そのアプリの、日ごとの最初〜最後の公開の幅の合計
    return { label: r.label, n: cs.length, days: Object.keys(ad).length, hours, from: cs[0].at, to: cs[cs.length - 1].at }; }).filter(Boolean).sort((a, b)=>b.n - a.n);
  // 時間帯・曜日
  const byHour = Array(24).fill(0); commits.forEach(c=>byHour[hh(c.at)]++);
  const maxH = Math.max(...byHour, 1);
  const byDow = Array(7).fill(0); dayKeys.forEach(k=>byDow[new Date(k + "T00:00:00Z").getUTCDay()]++);
  // できたこと（ボードの完了）
  const doneBy = {}; done.forEach(d=>{ (doneBy[d.app || "その他"] = doneBy[d.app || "その他"] || []).push(d); });

  el.innerHTML = `
    <div class="bignote">⚠️ この数字は <b>GitHub に公開した記録</b> から数えたものです。<br>考えている時間・調べている時間・細かい作業の時間は<b>入っていません</b>（実際の作業時間はこれより長くなります）。</div>
    <p class="lead">アプリを作った記録のまとめです。<b>数字は GitHub に公開した記録（自動）から数えています。</b>
      <button class="chip noprint" style="margin-left:6px" onclick="window.print()">🖨 印刷・PDFにする</button></p>
    <div class="sumcards">
      <div class="c"><div class="k">期間</div><div class="v" style="font-size:15px">${fmtD(first)}〜${fmtD(last)}</div><div class="s">${Math.round((last - first) / 86400000) + 1}日間</div></div>
      <div class="c"><div class="k">作業した日</div><div class="v">${dayKeys.length}日</div><div class="s">公開した日（朝6時までは前の日）</div></div>
      <div class="c"><div class="k">公開した回数</div><div class="v">${commits.length.toLocaleString("ja-JP")}回</div><div class="s">${apps.length}つのアプリ</div></div>
      <div class="c"><div class="k">作業時間の目安</div><div class="v">${h1(totalSpan)}時間〜</div><div class="s">各日の最初〜最後の公開の幅の合計</div></div>
      <div class="c"><div class="k">夜（22時〜朝6時）の公開</div><div class="v">${Math.round(night / commits.length * 100)}%</div><div class="s">${night}回</div></div>
      <div class="c"><div class="k">ボードの完了</div><div class="v">${done.length}件</div><div class="s">できたこと</div></div>
    </div>
    ${failed.length ? `<div class="note2" style="color:#d9534f">※ 読めなかったアプリ：${failed.map(esc).join("、")}（GitHub の読める回数の上限です。${resetTxt}に開き直すと出ます）</div>` : ""}
    ${stale.length ? `<div class="note2">※ ${stale.map(esc).join("、")} は、前に読んだ記録で出しています（GitHub の上限のため。${resetTxt}に開き直すと新しくなります）</div>` : ""}
    <div class="sbox"><h3>📅 月ごと</h3>
      <table class="st"><tr><th class="l">月</th><th>作業した日</th><th>公開した回数</th><th>作業時間の目安</th></tr>
      ${Object.keys(months).sort().map(m=>{ const o = months[m]; return `<tr><td class="l">${m.slice(0, 4)}年${Number(m.slice(5))}月</td><td>${o.days}日</td><td>${o.commits}回</td><td>${h1(o.hours)}時間〜</td></tr>`; }).join("")}
      <tr class="tot"><td class="l">合計</td><td>${dayKeys.length}日</td><td>${commits.length}回</td><td>${h1(totalSpan)}時間〜</td></tr></table>
      <div class="note2">作業時間の目安＝その日の最初の公開から最後の公開までの時間。最初の公開の前にも作業していて、公開が1回だけの日は0時間になるので、<b>実際の作業時間はこれより長くなります。</b></div></div>
    <div class="sbox"><h3>📱 アプリごと</h3>
      <table class="st"><tr><th class="l">アプリ</th><th>公開した回数</th><th>作業した日</th><th>作業時間の目安</th><th>はじめ</th><th>さいご</th></tr>
      ${apps.map(a=>`<tr><td class="l">${esc(a.label)}</td><td>${a.n}回</td><td>${a.days}日</td><td>${h1(a.hours)}時間〜</td><td>${fmtD(a.from)}</td><td>${fmtD(a.to)}</td></tr>`).join("")}</table>
      <div class="note2">アプリごとの作業時間の目安＝そのアプリの、日ごとの最初〜最後の公開の幅の合計。同じ日に2つのアプリをさわった時間は、両方に入ることがあります。</div></div>
    <div class="sbox"><h3>🕐 公開した時間帯</h3>
      <div class="bars">${byHour.map((n, h)=>`<div class="b ${h >= 22 || h < 6 ? "night" : ""}" style="height:${n / maxH * 100}%" title="${h}時台 ${n}回"></div>`).join("")}</div>
      <div class="barlab">${byHour.map((n, h)=>`<div>${h % 3 === 0 ? h : ""}</div>`).join("")}</div>
      <div class="note2">紫＝夜（22時〜朝6時）。曜日ごとの作業した日：${["日", "月", "火", "水", "木", "金", "土"].map((w, i)=>`${w} ${byDow[i]}日`).join("・")}</div></div>
    <div class="sbox"><h3>✅ できたこと（ボードの完了）</h3>
      <div class="donelist">${Object.keys(doneBy).map(app=>`<b>${esc(app)}（${doneBy[app].length}件）</b><ul>${doneBy[app].map(d=>`<li>${esc(d.title)} <small>${d.done_at ? fmtD(new Date(d.done_at)) : ""}</small></li>`).join("")}</ul>`).join("") || `<div class="none">まだありません</div>`}</div>
      <div class="note2">ボードは2026年10月15日から使い始めたので、それより前にできたものは、ここには入っていません（作業ログには全部あります）。</div></div>`;
}
</script>
