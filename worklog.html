<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店長作業ログ│サクラG</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<style>
  :root{ color-scheme: light; --bg:#FBF7F8; --ink:#5C4B4F; --sub:#9C8B8F; --line:#F1E3E7; --pink:#FF9EC0; --pink-deep:#e5638c; --pink-soft:#FFF0F5; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 70px;}
  h1{font-size:20px;font-weight:800;color:var(--pink-deep);}
  .lead{font-size:12.5px;color:var(--sub);margin:6px 0 14px;line-height:1.7;}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--sub);cursor:pointer;}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff;}
  .day{margin-bottom:16px;}
  .day h2{font-size:14px;font-weight:800;margin-bottom:6px;display:flex;gap:8px;align-items:baseline;}
  .day h2 small{font-size:11.5px;color:var(--sub);font-weight:700;}
  .item{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--pink);border-radius:12px;padding:9px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;}
  .item .t{font-size:12px;font-weight:800;color:var(--sub);min-width:44px;}
  .item .app{font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap;}
  .item .msg{font-size:14px;line-height:1.6;flex:1;}
  .empty{text-align:center;color:var(--sub);font-weight:800;padding:40px 0;}
  .back{position:fixed;left:12px;bottom:12px;background:#fff;color:#e5638c;border:1.5px solid #ffc2d1;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;text-decoration:none;box-shadow:0 4px 14px rgba(229,99,140,.2);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 店長作業ログ</h1>
  <p class="lead">店長がアプリを直したり、新しい機能を足したりした記録です。<b>アプリを公開（アップロード）するたびに、自動でここに増えます。</b><br>
  時刻は、その作業を公開した時刻です（日本時間）。</p>
  <div class="filters" id="filters"></div>
  <div id="list"><div class="empty">読み込み中…</div></div>
</div>
<a class="back" href="./">🏠 ポータル</a>

<script>
/* ============================================================
   アプリ作業ログ
   GitHub に公開されている各アプリの「更新の記録（コミット）」を読んで、日ごとに並べる。
   ログインもデータベースもいらない（公開されている情報だけを読む）。
   ============================================================ */
const OWNER = "sakuramoong-app";
const REPOS = [
  { repo:"portal",              label:"ポータル・記録簿", color:"#FFE3EC" },
  { repo:"sakurashift-staff",   label:"サクラシフト（内勤）", color:"#E6F6EE" },
  { repo:"sakurashift-cast",    label:"サクラシフト（キャスト）", color:"#E6F6EE" },
  { repo:"cast-sakura-profile", label:"キャストプロフ", color:"#FFF0F5" },
  { repo:"sakura-newcast",      label:"在籍作成ルーム", color:"#F1EAFA" },
  { repo:"naikin-shift",        label:"内勤カレンダー", color:"#E7F2FD" },
];
const DOW = ["日","月","火","水","木","金","土"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items = [], filter = "all";

async function load(){
  const results = await Promise.all(REPOS.map(async r=>{
    try{
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${r.repo}/commits?per_page=100`);
      if(!res.ok) return [];
      const list = await res.json();
      return list.map(c=>({
        repo: r, at: new Date(c.commit.author.date),
        // 1行目だけ（2行目以降の署名などは出さない）
        msg: String(c.commit.message || "").split("\n")[0].trim()
      })).filter(x=>x.msg && !/^Add files via upload$|^Update [\w.\-]+$|^Initial commit$|^Merge /i.test(x.msg));
    }catch(e){ return []; }
  }));
  items = results.flat().sort((a,b)=> b.at - a.at);
  render();
}
function jst(d){ return new Date(d.getTime() + 9*3600*1000); }
function render(){
  document.getElementById("filters").innerHTML = [{repo:"all",label:"ぜんぶ"}].concat(REPOS).map(r=>
    `<button class="chip ${filter===r.repo?"on":""}" onclick="filter='${r.repo}';render()">${esc(r.label)}</button>`).join("");
  const list = items.filter(x=> filter === "all" || x.repo.repo === filter);
  if(!list.length){ document.getElementById("list").innerHTML = `<div class="empty">記録がありません（または GitHub に一時的につながりません）</div>`; return; }
  const byDay = {};
  list.forEach(x=>{ const j = jst(x.at); const k = j.toISOString().slice(0,10); (byDay[k] = byDay[k] || []).push(x); });
  document.getElementById("list").innerHTML = Object.keys(byDay).sort().reverse().map(k=>{
    const arr = byDay[k];
    const d = new Date(k + "T00:00:00Z");
    const times = arr.map(x=>jst(x.at)).sort((a,b)=>a-b);
    const hm = t => String(t.getUTCHours()).padStart(2,"0") + ":" + String(t.getUTCMinutes()).padStart(2,"0");
    return `<div class="day"><h2>${d.getUTCMonth()+1}/${d.getUTCDate()}(${DOW[d.getUTCDay()]})
        <small>${arr.length}件　${hm(times[0])}〜${hm(times[times.length-1])}ごろ</small></h2>` +
      arr.map(x=>`<div class="item"><span class="t">${hm(jst(x.at))}</span>
        <span class="app" style="background:${x.repo.color}">${esc(x.repo.label)}</span>
        <span class="msg">${esc(x.msg)}</span></div>`).join("") + `</div>`;
  }).join("");
}
load();
</script>
</body>
</html>
