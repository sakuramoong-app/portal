<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カード15%計算│サクラG</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<style>
  :root{ color-scheme: light; --bg:#FBF7F8; --ink:#5C4B4F; --sub:#9C8B8F; --line:#F1E3E7; --pink-deep:#e5638c; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px 80px;}
  h1{font-size:20px;font-weight:800;color:var(--pink-deep);}
  .lead{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.7;}
  .box{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;}
  label{font-size:13px;font-weight:800;color:var(--sub);}
  input{width:100%;font-family:inherit;font-size:30px;font-weight:800;padding:10px 14px;border:2px solid #FFC2D1;border-radius:14px;margin-top:6px;color:var(--ink);text-align:right;}
  input:focus{outline:none;border-color:var(--pink-deep);}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1.5px dashed var(--line);font-size:15px;}
  .row:last-child{border-bottom:none;}
  .row b{font-size:20px;}
  .big{background:#FFF0F5;border-radius:14px;padding:12px 14px;margin-top:10px;}
  .big .k{font-size:13px;font-weight:800;color:var(--pink-deep);} .big .v{font-size:40px;font-weight:900;text-align:right;color:var(--pink-deep);}
  .btn{font-family:inherit;font-size:14px;font-weight:800;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;cursor:pointer;margin-top:10px;}
  .back{position:fixed;left:12px;bottom:12px;background:#fff;color:#e5638c;border:1.5px solid #ffc2d1;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>💳 カード15%計算</h1>
  <div class="lead">総額（カードにする前の金額）を入れると、カード手数料15%をのせた額を出します。<br>記録簿アプリができるまでのつなぎです。</div>
  <div class="box">
    <label for="t">総額（円）</label>
    <input id="t" type="text" inputmode="numeric" placeholder="例：29000" autofocus oninput="calc()">
    <div class="big"><div class="k">💳 カードの総額（＋15%）</div><div class="v" id="card">－</div></div>
    <div class="row"><span>手数料（15%）</span><b id="fee">－</b></div>
    <button class="btn" onclick="copyCard()">📋 カードの総額をコピー</button>
    <button class="btn" onclick="document.getElementById('t').value='';calc();document.getElementById('t').focus()">クリア</button>
  </div>
</div>
<a class="back" href="./">🏠 ポータル</a>
<script>
const yen = n => n.toLocaleString("ja-JP") + "円";
let cardVal = 0;
function calc(){
  const raw = document.getElementById("t").value.replace(/[^\d]/g, "");
  const t = Number(raw) || 0;
  cardVal = Math.round(t * 1.15);
  document.getElementById("card").textContent = t ? yen(cardVal) : "－";
  document.getElementById("fee").textContent = t ? yen(cardVal - t) : "－";
}
function copyCard(){
  if(!cardVal) return;
  navigator.clipboard.writeText(String(cardVal)).then(() => { const b = event.target; const o = b.textContent; b.textContent = "✅ コピーしました"; setTimeout(() => b.textContent = o, 1200); });
}
</script>
</body>
</html>
